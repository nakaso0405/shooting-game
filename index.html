<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="google-site-verification" content="google-site-verification">
<meta name="description" content="スマホ・PC対応ローグライク・シューティング">
<meta name="keywords" content="シューティングゲーム,ローグライク・シューティング">
<title>ローグライク・シューティング</title>
<style>
  * { box-sizing: border-box; }
  body {
    background-color: #111;
    color: #fff;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
    padding: 8px;
    overflow: hidden;
    touch-action: none;
    font-family: sans-serif;
    user-select: none;
    -webkit-user-select: none;
  }
  canvas {
    background-color: #05050a;
    border: 2px solid #00ffcc;
    max-width: 96vw;
    max-height: 82vh;
    width: auto;
    height: auto;
    box-shadow: 0 0 18px rgba(0, 255, 204, 0.25);
    display: block;
  }
  p {
    margin: 8px 0 0;
    font-size: 12px;
    color: #aaa;
    text-align: center;
    line-height: 1.4;
  }
</style>
</head>
<body>
<canvas id="gameCanvas" width="360" height="600"></canvas>
<p>タッチ＆スライド / 矢印キー・WASD 移動（Space:ボム / V:バリア / P:一時停止）</p>

<script>
(() => {
  'use strict';

  const canvas = document.getElementById('gameCanvas');
  const ctx = canvas ? canvas.getContext('2d') : null;
  if (!canvas || !ctx) return;

  // ゲーム定数
  const HIGH_SCORE_KEY = 'roguelike_shooting_high_score_v1';
  const PLAYER_INVINCIBLE_DURATION = 90;
  const BARRIER_ITEM_DURATION = 300;
  const BASE_PLAYER_SPEED = 2.4;
  const MAX_WAVE = 10;
  const MAX_BOMBS = 3;
  const MAX_BARRIERS = 3;
  const MAX_PETS = 3;
  const ENEMY_DROP_CHANCE = 0.035;
  const SKY_ITEM_SPAWN_INTERVAL = 1800;
  const MID_BOSS_BOMB_DAMAGE = 28;
  const FINAL_BOSS_BOMB_DAMAGE = 95;

  // 安全なストレージ読み書き
  function loadHighScore() {
    try {
      const v = localStorage.getItem(HIGH_SCORE_KEY);
      return v ? (parseInt(v, 10) || 0) : 0;
    } catch (_) {
      return 0;
    }
  }
  function saveHighScore(score) {
    try {
      localStorage.setItem(HIGH_SCORE_KEY, String(score));
    } catch (_) {}
  }

  // 安全な画像ローダー（失敗時は ready=false で図形描画へ自動フォールバック）
  function createSafeImage(src) {
    const img = new Image();
    const state = { img, ready: false };
    img.onload = () => {
      if (img.naturalWidth > 0 && img.naturalHeight > 0) {
        state.ready = true;
      }
    };
    img.onerror = () => {
      state.ready = false;
    };
    try {
      img.src = src;
    } catch (_) {
      state.ready = false;
    }
    return state;
  }

  const sprites = {
    player: createSafeImage('player.png'),
    enemy_normal: createSafeImage('enemy_normal.png'),
    enemy_dash: createSafeImage('enemy_dash.png'),
    enemy_weave: createSafeImage('enemy_weave.png'),
    enemy_erratic: createSafeImage('enemy_erratic.png'),
    enemy_tank: createSafeImage('enemy_tank.png'),
    enemy_zigzag: createSafeImage('enemy_zigzag.png')
  };

  // 安全なBGM管理（自動再生制限・ファイル欠損・再生エラーで絶対に止まらない）
  function createSafeBgm(src) {
    let audio = null;
    let enabled = true;
    try {
      audio = new Audio(src);
      audio.loop = true;
      audio.volume = 0.35;
      audio.addEventListener('error', () => {
        enabled = false;
      });
    } catch (_) {
      enabled = false;
    }

    function play() {
      if (!enabled || !audio) return;
      try {
        const p = audio.play();
        if (p && typeof p.catch === 'function') {
          p.catch(() => {});
        }
      } catch (_) {}
    }

    function pause() {
      if (!audio) return;
      try {
        audio.pause();
      } catch (_) {}
    }

    function stop() {
      if (!audio) return;
      try {
        audio.pause();
        audio.currentTime = 0;
      } catch (_) {}
    }

    return { play, pause, stop };
  }

  const bgmMenu = createSafeBgm('menu_bgm.mp3');
  const bgmGame = createSafeBgm('bgm.mp3');

  function syncBgmState() {
    if (gameState === 'TITLE' || gameState === 'ENCYCLOPEDIA') {
      bgmGame.pause();
      bgmMenu.play();
    } else if (gameState === 'PLAYING' || gameState === 'CARD_SELECT') {
      bgmMenu.pause();
      bgmGame.play();
    } else {
      bgmMenu.pause();
      bgmGame.pause();
    }
  }

  // 状態変数
  let gameState = 'TITLE'; // TITLE, PLAYING, CARD_SELECT, PAUSE, GAMEOVER, CLEAR, ENCYCLOPEDIA
  let score = 0;
  let highScore = loadHighScore();
  let wave = 1;
  let waveTimer = 0;
  let frameCount = 0;
  let skyItemTimer = 0;
  let screenShake = 0;
  let hitStop = 0;
  let toastText = '';
  let toastTimer = 0;

  // デバッグモード
  let debugMode = false;
  let debugWaveSelectIndex = 0;
  let debugCardSelectIndex = 0;

  // プレイヤー状態
  const player = {
    x: canvas.width / 2,
    y: canvas.height - 80,
    w: 28,
    h: 28,
    hp: 5,
    maxHp: 5,
    speed: BASE_PLAYER_SPEED,
    invincible: 0,
    barrierTimer: 0,
    bombs: 1,
    barriers: 1,
    fireRate: 14,
    fireCooldown: 0,
    damage: 1,
    bulletSpeed: 7,
    bulletSize: 4,
    spreadLevel: 0,      // 0:通常, 1:拡散, 2:拡散プラス
    sideShotLevel: 0,    // 左右横弾
    bombShotLevel: 0,    // ミニ爆弾弾
    laserLevel: 0,       // 貫通レーザー
    homingLevel: 0,      // ホーミング弾
    blitzLevel: 0,       // ハイパーブリッツ
    pets: 0
  };

  // エンティティ配列
  let bullets = [];
  let enemyBullets = [];
  let enemies = [];
  let items = [];
  let particles = [];
  let floatingTexts = [];
  let stars = [];
  let cardChoices = [];

  for (let i = 0; i < 65; i++) {
    stars.push({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      s: 0.6 + Math.random() * 1.8,
      v: 0.6 + Math.random() * 2.2
    });
  }

  // アップグレードカード定義
  const ALL_CARDS = [
    { id: 'fire_rate', name: 'クイックトリガー', star: 1, desc: '連射速度がアップ' },
    { id: 'damage', name: 'ハイパワー弾', star: 1, desc: '通常弾・武装の威力 +1' },
    { id: 'speed', name: 'スラスター強化', star: 1, desc: '自機の移動速度アップ' },
    { id: 'max_hp', name: '装甲プレート', star: 1, desc: '最大HP +1 ＆ HP全回復' },
    { id: 'side_shot', name: 'サイドショット', star: 1, desc: '左右斜め方向へ追加射撃' },
    { id: 'bomb_shot', name: 'ミニ爆弾', star: 2, desc: '着弾/一定距離で範囲爆発弾' },
    { id: 'laser', name: '貫通レーザー', star: 2, desc: '敵を貫通する高出力ビーム' },
    { id: 'homing', name: 'ホーミング弾', star: 2, desc: '敵を追尾する誘導弾を発射' },
    { id: 'spread_up', name: '拡散ショット', star: 2, desc: '扇状の拡散弾を強化' },
    { id: 'pet', name: 'サポートペット', star: 2, desc: '周囲を回る攻撃＆身代わりペット +1' },
    { id: 'hyper_blitz', name: 'ハイパーブリッツ', star: 3, desc: '超連射＆広角弾幕の極意' },
    { id: 'full_support', name: 'フルウェポン＆補給', star: 3, desc: 'ボム+1・バリア+1・HP全回復' }
  ];

  function showToast(msg) {
    toastText = msg;
    toastTimer = 90;
  }

  function addScore(pts) {
    score += pts;
    if (score > highScore) {
      highScore = score;
      saveHighScore(highScore);
    }
  }

  function resetGame(startWave = 1) {
    score = 0;
    wave = Math.max(1, Math.min(MAX_WAVE, startWave));
    waveTimer = 0;
    skyItemTimer = 0;
    screenShake = 0;
    hitStop = 0;
    player.x = canvas.width / 2;
    player.y = canvas.height - 80;
    player.hp = 5;
    player.maxHp = 5;
    player.speed = BASE_PLAYER_SPEED;
    player.invincible = PLAYER_INVINCIBLE_DURATION;
    player.barrierTimer = 0;
    player.bombs = 1;
    player.barriers = 1;
    player.fireRate = 14;
    player.fireCooldown = 0;
    player.damage = 1;
    player.bulletSpeed = 7;
    player.bulletSize = 4;
    player.spreadLevel = 0;
    player.sideShotLevel = 0;
    player.bombShotLevel = 0;
    player.laserLevel = 0;
    player.homingLevel = 0;
    player.blitzLevel = 0;
    player.pets = 0;

    bullets = [];
    enemyBullets = [];
    enemies = [];
    items = [];
    particles = [];
    floatingTexts = [];
    gameState = 'PLAYING';
    spawnWaveEnemies(wave);
    syncBgmState();
  }

  function applyCard(card) {
    if (!card) return;
    switch (card.id) {
      case 'fire_rate':
        player.fireRate = Math.max(4, player.fireRate - 2);
        break;
      case 'damage':
        player.damage += 1;
        break;
      case 'speed':
        player.speed = Math.min(5.5, player.speed + 0.35);
        break;
      case 'max_hp':
        player.maxHp += 1;
        player.hp = player.maxHp;
        break;
      case 'side_shot':
        player.sideShotLevel += 1;
        break;
      case 'bomb_shot':
        player.bombShotLevel += 1;
        break;
      case 'laser':
        player.laserLevel += 1;
        break;
      case 'homing':
        player.homingLevel += 1;
        break;
      case 'spread_up':
        player.spreadLevel = Math.min(3, player.spreadLevel + 1);
        break;
      case 'pet':
        if (player.pets < MAX_PETS) {
          player.pets += 1;
        } else {
          player.damage += 1;
        }
        break;
      case 'hyper_blitz':
        player.blitzLevel += 1;
        player.fireRate = Math.max(4, player.fireRate - 2);
        player.damage += 1;
        break;
      case 'full_support':
        player.bombs = Math.min(MAX_BOMBS, player.bombs + 1);
        player.barriers = Math.min(MAX_BARRIERS, player.barriers + 1);
        player.hp = player.maxHp;
        break;
    }
    floatingTexts.push({
      x: player.x,
      y: player.y - 24,
      text: card.name + '!',
      color: '#00ffcc',
      life: 55
    });
  }

  function openCardSelect() {
    const pool = [];
    for (const c of ALL_CARDS) {
      const weight = c.star === 3 ? 1 : (c.star === 2 ? 2 : 4);
      for (let i = 0; i < weight; i++) pool.push(c);
    }
    const picked = [];
    const usedIds = new Set();
    let safety = 0;
    while (picked.length < 3 && safety < 60) {
      safety++;
      const candidate = pool[Math.floor(Math.random() * pool.length)];
      if (!usedIds.has(candidate.id)) {
        usedIds.add(candidate.id);
        picked.push(candidate);
      }
    }
    cardChoices = picked;
    gameState = 'CARD_SELECT';
    syncBgmState();
  }

  // ウェーブ出現生成
  function spawnWaveEnemies(w) {
    if (w === 5) {
      enemies.push({
        type: 'mid_boss',
        name: 'Δ-GUARDIAN',
        x: canvas.width / 2,
        y: 95,
        w: 68,
        h: 48,
        hp: 120,
        maxHp: 120,
        vx: 1.3,
        vy: 0,
        timer: 0,
        points: 1500
      });
      return;
    }
    if (w === 10) {
      enemies.push({
        type: 'final_boss',
        name: 'Ω-OVERLORD',
        x: canvas.width / 2,
        y: 105,
        w: 88,
        h: 60,
        hp: 1350,
        maxHp: 1350,
        vx: 1.5,
        vy: 0,
        timer: 0,
        points: 5000
      });
      return;
    }

    const count = 5 + w * 2;
    const types = ['normal', 'dash', 'weave', 'erratic', 'zigzag', 'tank'];
    for (let i = 0; i < count; i++) {
      const t = types[(i + w) % types.length];
      const baseHp = (t === 'tank' ? 8 + w * 2 : 2 + Math.floor(w * 0.8));
      enemies.push({
        type: t,
        x: 36 + ((i * 57) % (canvas.width - 72)),
        y: -30 - i * 48,
        w: t === 'tank' ? 34 : 26,
        h: t === 'tank' ? 34 : 26,
        hp: baseHp,
        maxHp: baseHp,
        vx: (i % 2 === 0 ? 1 : -1) * (1.0 + w * 0.08),
        vy: (t === 'dash' ? 2.4 : 1.15) + w * 0.08,
        timer: i * 15,
        points: (t === 'tank' ? 300 : 120) + w * 20
      });
    }
  }

  function spawnExplosion(x, y, color = '#ffaa00', count = 12) {
    for (let i = 0; i < count; i++) {
      const ang = (Math.PI * 2 * i) / count + Math.random() * 0.4;
      const spd = 1 + Math.random() * 3.5;
      particles.push({
        x, y,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd,
        r: 2 + Math.random() * 3,
        color,
        life: 20 + Math.floor(Math.random() * 18)
      });
    }
  }

  function maybeDropItem(x, y) {
    if (Math.random() > ENEMY_DROP_CHANCE) return;
    const roll = Math.random();
    const kind = roll < 0.45 ? 'heart' : (roll < 0.75 ? 'barrier' : 'bomb');
    items.push({ x, y, vy: 1.5, r: 11, kind });
  }

  function useBomb() {
    if (gameState !== 'PLAYING' || player.bombs <= 0) return;
    player.bombs -= 1;
    screenShake = 16;
    hitStop = 4;
    enemyBullets = [];
    spawnExplosion(player.x, player.y, '#ff55aa', 28);

    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      if (e.type === 'mid_boss') {
        e.hp -= MID_BOSS_BOMB_DAMAGE;
        floatingTexts.push({ x: e.x, y: e.y, text: '-' + MID_BOSS_BOMB_DAMAGE, color: '#ff88cc', life: 35 });
      } else if (e.type === 'final_boss') {
        e.hp -= FINAL_BOSS_BOMB_DAMAGE;
        floatingTexts.push({ x: e.x, y: e.y, text: '-' + FINAL_BOSS_BOMB_DAMAGE, color: '#ff88cc', life: 35 });
      } else {
        e.hp -= 999;
      }
      if (e.hp <= 0) {
        addScore(e.points);
        spawnExplosion(e.x, e.y, '#ffcc00', 18);
        maybeDropItem(e.x, e.y);
        enemies.splice(i, 1);
      }
    }
  }

  function useBarrier() {
    if (gameState !== 'PLAYING' || player.barriers <= 0) return;
    player.barriers -= 1;
    player.barrierTimer = BARRIER_ITEM_DURATION;
    player.invincible = Math.max(player.invincible, 60);
    showToast('エナジーバリア展開！');
  }

  function damagePlayer() {
    if (debugMode || player.invincible > 0 || gameState !== 'PLAYING') return;
    if (player.barrierTimer > 0) {
      player.barrierTimer = 0;
      player.invincible = 45;
      screenShake = 6;
      showToast('バリアで被弾を防いだ！');
      return;
    }
    if (player.pets > 0) {
      player.pets -= 1;
      player.invincible = PLAYER_INVINCIBLE_DURATION;
      screenShake = 8;
      spawnExplosion(player.x, player.y, '#66e0ff', 14);
      showToast('ペットが身代わりになった！');
      return;
    }
    player.hp -= 1;
    player.invincible = PLAYER_INVINCIBLE_DURATION;
    screenShake = 12;
    hitStop = 4;
    spawnExplosion(player.x, player.y, '#ff4444', 18);
    if (player.hp <= 0) {
      player.hp = 0;
      gameState = 'GAMEOVER';
      syncBgmState();
    }
  }

  // 射撃処理
  function firePlayerWeapons() {
    if (player.fireCooldown > 0) {
      player.fireCooldown--;
      return;
    }
    player.fireCooldown = player.fireRate;
    const dmg = player.damage;
    const spd = player.bulletSpeed;

    // 中心弾 / 拡散弾
    const spreadCount = 1 + player.spreadLevel * 2 + (player.blitzLevel > 0 ? 2 : 0);
    const stepAngle = 0.14;
    for (let i = 0; i < spreadCount; i++) {
      const offsetIdx = i - (spreadCount - 1) / 2;
      const ang = -Math.PI / 2 + offsetIdx * stepAngle;
      bullets.push({
        x: player.x,
        y: player.y - 14,
        vx: Math.cos(ang) * spd,
        vy: Math.sin(ang) * spd,
        r: player.bulletSize,
        dmg,
        kind: 'normal',
        color: '#00ffcc'
      });
    }

    // サイドショット
    if (player.sideShotLevel > 0) {
      for (const dir of [-1, 1]) {
        const ang = -Math.PI / 2 + dir * (0.42 + player.sideShotLevel * 0.05);
        bullets.push({
          x: player.x + dir * 12,
          y: player.y - 6,
          vx: Math.cos(ang) * spd,
          vy: Math.sin(ang) * spd,
          r: 3.5,
          dmg: Math.max(1, Math.floor(dmg * 0.8)),
          kind: 'normal',
          color: '#66aaff'
        });
      }
    }

    // ミニ爆弾
    if (player.bombShotLevel > 0 && frameCount % 24 === 0) {
      bullets.push({
        x: player.x,
        y: player.y - 16,
        vx: 0,
        vy: -spd * 0.75,
        r: 6,
        dmg: dmg + player.bombShotLevel,
        kind: 'bomb_shot',
        blastRadius: 56 + player.bombShotLevel * 12,
        life: 45,
        color: '#ff9900'
      });
    }

    // 貫通レーザー
    if (player.laserLevel > 0 && frameCount % 28 === 0) {
      bullets.push({
        x: player.x,
        y: player.y - 18,
        vx: 0,
        vy: -11,
        r: 5 + player.laserLevel,
        dmg: dmg + player.laserLevel,
        kind: 'laser',
        pierce: 99,
        hitIds: new Set(),
        color: '#ff3399'
      });
    }

    // ホーミング弾
    if (player.homingLevel > 0 && frameCount % 22 === 0) {
      for (let i = 0; i < Math.min(3, player.homingLevel); i++) {
        const ang = -Math.PI / 2 + (i - 0.5) * 0.5;
        bullets.push({
          x: player.x,
          y: player.y - 10,
          vx: Math.cos(ang) * 4.5,
          vy: Math.sin(ang) * 4.5,
          r: 4,
          dmg: Math.max(1, dmg),
          kind: 'homing',
          color: '#cc66ff'
        });
      }
    }

    // ペット射撃
    if (player.pets > 0 && frameCount % 26 === 0) {
      for (let p = 0; p < player.pets; p++) {
        const pAng = frameCount * 0.05 + (Math.PI * 2 * p) / player.pets;
        const px = player.x + Math.cos(pAng) * 34;
        const py = player.y + Math.sin(pAng) * 34;
        bullets.push({
          x: px,
          y: py,
          vx: 0,
          vy: -8,
          r: 3,
          dmg: Math.max(1, Math.floor(dmg * 0.7)),
          kind: 'normal',
          color: '#88eeff'
        });
      }
    }
  }

  // 更新処理
  function update() {
    frameCount++;
    if (toastTimer > 0) toastTimer--;
    if (screenShake > 0) screenShake--;

    for (const st of stars) {
      st.y += st.v * (gameState === 'PLAYING' ? 1.3 : 0.5);
      if (st.y > canvas.height) {
        st.y = 0;
        st.x = Math.random() * canvas.width;
      }
    }

    if (gameState !== 'PLAYING') return;
    if (hitStop > 0) {
      hitStop--;
      return;
    }

    // キーボード移動
    let moveX = 0;
    let moveY = 0;
    if (keys['ArrowLeft'] || keys['KeyA']) moveX -= 1;
    if (keys['ArrowRight'] || keys['KeyD']) moveX += 1;
    if (keys['ArrowUp'] || keys['KeyW']) moveY -= 1;
    if (keys['ArrowDown'] || keys['KeyS']) moveY += 1;
    if (moveX !== 0 && moveY !== 0) {
      const inv = 1 / Math.SQRT2;
      moveX *= inv;
      moveY *= inv;
    }
    player.x += moveX * player.speed;
    player.y += moveY * player.speed;

    player.x = Math.max(player.w / 2 + 4, Math.min(canvas.width - player.w / 2 - 4, player.x));
    player.y = Math.max(player.h / 2 + 24, Math.min(canvas.height - player.h / 2 - 8, player.y));

    if (player.invincible > 0) player.invincible--;
    if (player.barrierTimer > 0) player.barrierTimer--;

    firePlayerWeapons();

    // 空からのアイテム出現
    skyItemTimer++;
    if (skyItemTimer >= SKY_ITEM_SPAWN_INTERVAL) {
      skyItemTimer = 0;
      const kinds = ['heart', 'barrier', 'bomb'];
      items.push({
        x: 32 + Math.random() * (canvas.width - 64),
        y: -14,
        vy: 1.4,
        r: 12,
        kind: kinds[Math.floor(Math.random() * kinds.length)]
      });
    }

    // プレイヤー弾更新
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      if (b.kind === 'homing' && enemies.length > 0) {
        let target = enemies[0];
        let bestDist = Infinity;
        for (const e of enemies) {
          const d = Math.hypot(e.x - b.x, e.y - b.y);
          if (d < bestDist) {
            bestDist = d;
            target = e;
          }
        }
        const desired = Math.atan2(target.y - b.y, target.x - b.x);
        const cur = Math.atan2(b.vy, b.vx);
        let diff = desired - cur;
        while (diff > Math.PI) diff -= Math.PI * 2;
        while (diff < -Math.PI) diff += Math.PI * 2;
        const nextAng = cur + diff * 0.14;
        const spd = Math.hypot(b.vx, b.vy) || 6;
        b.vx = Math.cos(nextAng) * spd;
        b.vy = Math.sin(nextAng) * spd;
      }

      b.x += b.vx;
      b.y += b.vy;

      if (b.kind === 'bomb_shot') {
        b.life--;
        if (b.life <= 0) {
          spawnExplosion(b.x, b.y, '#ff9900', 14);
          for (const e of enemies) {
            if (Math.hypot(e.x - b.x, e.y - b.y) <= b.blastRadius) {
              e.hp -= b.dmg;
            }
          }
          bullets.splice(i, 1);
          continue;
        }
      }

      if (b.y < -30 || b.y > canvas.height + 30 || b.x < -30 || b.x > canvas.width + 30) {
        bullets.splice(i, 1);
      }
    }

    // 敵更新＆当たり判定
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      e.timer++;

      if (e.type === 'mid_boss' || e.type === 'final_boss') {
        e.x += e.vx;
        if (e.x < e.w / 2 + 12 || e.x > canvas.width - e.w / 2 - 12) {
          e.vx *= -1;
        }
        const interval = e.type === 'final_boss' ? 42 : 65;
        if (e.timer % interval === 0) {
          const ways = e.type === 'final_boss' ? 7 : 4;
          for (let k = 0; k < ways; k++) {
            const ang = Math.PI / 2 + (k - (ways - 1) / 2) * 0.25;
            enemyBullets.push({
              x: e.x,
              y: e.y + e.h / 2,
              vx: Math.cos(ang) * 2.8,
              vy: Math.sin(ang) * 2.8,
              r: 4.5
            });
          }
        }
      } else {
        if (e.type === 'weave') {
          e.x += Math.sin(e.timer * 0.08) * 2.2;
        } else if (e.type === 'zigzag') {
          e.x += (Math.floor(e.timer / 30) % 2 === 0 ? 1 : -1) * 2.0;
        } else if (e.type === 'erratic' && e.timer % 45 === 0) {
          e.vx = (Math.random() - 0.5) * 4.2;
        }
        e.x += e.vx * 0.5;
        e.y += e.vy;
        if (e.x < 16 || e.x > canvas.width - 16) e.vx *= -1;
        if (e.timer % 110 === 0 && e.y > 20 && e.y < canvas.height - 140) {
          const ang = Math.atan2(player.y - e.y, player.x - e.x);
          enemyBullets.push({
            x: e.x,
            y: e.y,
            vx: Math.cos(ang) * 2.4,
            vy: Math.sin(ang) * 2.4,
            r: 4
          });
        }
      }

      // 弾との衝突
      for (let j = bullets.length - 1; j >= 0; j--) {
        const b = bullets[j];
        if (Math.abs(b.x - e.x) < (e.w / 2 + b.r) && Math.abs(b.y - e.y) < (e.h / 2 + b.r)) {
          if (b.kind === 'laser') {
            if (!b.hitIds.has(e)) {
              b.hitIds.add(e);
              e.hp -= b.dmg;
            }
          } else {
            e.hp -= b.dmg;
            bullets.splice(j, 1);
          }
        }
      }

      // 自機との衝突
      if (Math.abs(player.x - e.x) < (e.w / 2 + player.w / 2 - 4) &&
          Math.abs(player.y - e.y) < (e.h / 2 + player.h / 2 - 4)) {
        damagePlayer();
      }

      if (e.hp <= 0) {
        addScore(e.points);
        spawnExplosion(e.x, e.y, '#ffaa00', e.type.includes('boss') ? 32 : 12);
        maybeDropItem(e.x, e.y);
        enemies.splice(i, 1);
      } else if (e.y > canvas.height + 50) {
        enemies.splice(i, 1);
      }
    }

    // 敵弾更新
    for (let i = enemyBullets.length - 1; i >= 0; i--) {
      const eb = enemyBullets[i];
      eb.x += eb.vx;
      eb.y += eb.vy;
      if (Math.hypot(eb.x - player.x, eb.y - player.y) < eb.r + player.w / 2 - 4) {
        enemyBullets.splice(i, 1);
        damagePlayer();
        continue;
      }
      if (eb.y > canvas.height + 20 || eb.y < -20 || eb.x < -20 || eb.x > canvas.width + 20) {
        enemyBullets.splice(i, 1);
      }
    }

    // アイテム更新
    for (let i = items.length - 1; i >= 0; i--) {
      const it = items[i];
      it.y += it.vy;
      if (Math.hypot(it.x - player.x, it.y - player.y) < it.r + player.w / 2 + 4) {
        if (it.kind === 'heart') {
          player.hp = Math.min(player.maxHp, player.hp + 1);
          showToast('リペアハート！HP +1');
        } else if (it.kind === 'barrier') {
          player.barriers = Math.min(MAX_BARRIERS, player.barriers + 1);
          showToast('エナジーバリア入手！');
        } else {
          player.bombs = Math.min(MAX_BOMBS, player.bombs + 1);
          showToast('メガボム入手！');
        }
        items.splice(i, 1);
        continue;
      }
      if (it.y > canvas.height + 30) items.splice(i, 1);
    }

    // パーティクル＆フローティングテキスト
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life--;
      if (p.life <= 0) particles.splice(i, 1);
    }
    for (let i = floatingTexts.length - 1; i >= 0; i--) {
      const ft = floatingTexts[i];
      ft.y -= 0.8;
      ft.life--;
      if (ft.life <= 0) floatingTexts.splice(i, 1);
    }

    // ウェーブ進行
    waveTimer++;
    if (enemies.length === 0 || waveTimer > 1400) {
      if (wave >= MAX_WAVE) {
        gameState = 'CLEAR';
        syncBgmState();
      } else {
        wave += 1;
        waveTimer = 0;
        enemyBullets = [];
        spawnWaveEnemies(wave);
        openCardSelect();
      }
    }
  }

  // 描画処理（画像未読込でも必ず図形描画へフォールバック）
  function drawSpriteOrFallback(spriteObj, x, y, w, h, fallbackColor, isPlayer = false) {
    if (spriteObj && spriteObj.ready) {
      try {
        ctx.drawImage(spriteObj.img, x - w / 2, y - h / 2, w, h);
        return;
      } catch (_) {}
    }
    ctx.fillStyle = fallbackColor;
    if (isPlayer) {
      ctx.beginPath();
      ctx.moveTo(x, y - h / 2);
      ctx.lineTo(x + w / 2, y + h / 2);
      ctx.lineTo(x, y + h / 4);
      ctx.lineTo(x - w / 2, y + h / 2);
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.fillRect(x - w / 2, y - h / 2, w, h);
    }
  }

  function render() {
    ctx.save();
    if (screenShake > 0) {
      ctx.translate((Math.random() - 0.5) * screenShake, (Math.random() - 0.5) * screenShake);
    }

    ctx.fillStyle = '#05050a';
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // 星空
    ctx.fillStyle = '#ffffff';
    for (const st of stars) {
      ctx.globalAlpha = 0.35 + (st.s / 2.5) * 0.65;
      ctx.fillRect(st.x, st.y, st.s, st.s);
    }
    ctx.globalAlpha = 1;

    if (gameState === 'TITLE') {
      ctx.fillStyle = '#00ffcc';
      ctx.font = 'bold 22px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('ROGUELIKE SHOOTER', canvas.width / 2, 130);

      ctx.fillStyle = '#fff';
      ctx.font = '14px sans-serif';
      ctx.fillText('HIGH SCORE: ' + highScore, canvas.width / 2, 165);

      ctx.fillStyle = '#00ffcc';
      ctx.fillRect(canvas.width / 2 - 90, 230, 180, 44);
      ctx.fillStyle = '#05050a';
      ctx.font = 'bold 16px sans-serif';
      ctx.fillText('GAME START', canvas.width / 2, 258);

      ctx.strokeStyle = '#66aaff';
      ctx.lineWidth = 2;
      ctx.strokeRect(canvas.width / 2 - 90, 290, 180, 38);
      ctx.fillStyle = '#66aaff';
      ctx.font = '14px sans-serif';
      ctx.fillText('図鑑を見る', canvas.width / 2, 314);

      ctx.fillStyle = '#888';
      ctx.font = '11px sans-serif';
      ctx.fillText('※画面左上タップでデバッグ切替', canvas.width / 2, 370);
      ctx.restore();
      return;
    }

    if (gameState === 'ENCYCLOPEDIA') {
      ctx.fillStyle = '#66aaff';
      ctx.font = 'bold 18px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('敵＆アイテム図鑑', canvas.width / 2, 50);

      const list = [
        ['自機', sprites.player, '#00ffcc'],
        ['通常敵', sprites.enemy_normal, '#ff5555'],
        ['突進敵', sprites.enemy_dash, '#ffaa00'],
        ['蛇行敵', sprites.enemy_weave, '#aa66ff'],
        ['変則敵', sprites.enemy_erratic, '#ff66aa'],
        ['重装敵', sprites.enemy_tank, '#66ccff'],
        ['ジグザグ敵', sprites.enemy_zigzag, '#cc66ff']
      ];
      list.forEach(([label, sp, col], idx) => {
        const y = 95 + idx * 58;
        drawSpriteOrFallback(sp, 70, y, 28, 28, col, idx === 0);
        ctx.fillStyle = '#fff';
        ctx.font = '14px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(label, 105, y + 5);
      });

      ctx.fillStyle = '#00ffcc';
      ctx.textAlign = 'center';
      ctx.font = 'bold 14px sans-serif';
      ctx.fillText('タップしてタイトルへ戻る', canvas.width / 2, canvas.height - 32);
      ctx.restore();
      return;
    }

    // プレイ中・カード選択・ポーズ・結果画面の背景エンティティ描画
    for (const it of items) {
      ctx.fillStyle = it.kind === 'heart' ? '#ff4477' : (it.kind === 'barrier' ? '#33ccff' : '#ffaa00');
      ctx.beginPath();
      ctx.arc(it.x, it.y, it.r, 0, Math.PI * 2);
      ctx.fill();
    }

    for (const b of bullets) {
      ctx.fillStyle = b.color || '#00ffcc';
      ctx.beginPath();
      ctx.arc(b.x, b.y, b.r, 0, Math.PI * 2);
      ctx.fill();
    }

    for (const e of enemies) {
      const spMap = {
        normal: sprites.enemy_normal,
        dash: sprites.enemy_dash,
        weave: sprites.enemy_weave,
        erratic: sprites.enemy_erratic,
        tank: sprites.enemy_tank,
        zigzag: sprites.enemy_zigzag
      };
      const colMap = {
        mid_boss: '#ff55aa',
        final_boss: '#ff2244',
        tank: '#5588ff',
        dash: '#ffaa00'
      };
      drawSpriteOrFallback(spMap[e.type], e.x, e.y, e.w, e.h, colMap[e.type] || '#ff5555', false);

      if (e.maxHp > 3) {
        const bw = Math.min(80, e.w);
        const ratio = Math.max(0, e.hp / e.maxHp);
        ctx.fillStyle = '#333';
        ctx.fillRect(e.x - bw / 2, e.y - e.h / 2 - 8, bw, 4);
        ctx.fillStyle = '#ff4466';
        ctx.fillRect(e.x - bw / 2, e.y - e.h / 2 - 8, bw * ratio, 4);
      }
    }

    for (const eb of enemyBullets) {
      ctx.fillStyle = '#ff4466';
      ctx.beginPath();
      ctx.arc(eb.x, eb.y, eb.r, 0, Math.PI * 2);
      ctx.fill();
    }

    // 自機＆ペット＆バリア
    if (gameState !== 'GAMEOVER') {
      if (player.invincible % 6 < 4) {
        drawSpriteOrFallback(sprites.player, player.x, player.y, player.w, player.h, '#00ffcc', true);
      }
      if (player.barrierTimer > 0) {
        ctx.strokeStyle = '#33eeff';
        ctx.lineWidth = 2;
        ctx.beginPath();
        ctx.arc(player.x, player.y, 24, 0, Math.PI * 2);
        ctx.stroke();
      }
      for (let p = 0; p < player.pets; p++) {
        const pAng = frameCount * 0.05 + (Math.PI * 2 * p) / player.pets;
        const px = player.x + Math.cos(pAng) * 34;
        const py = player.y + Math.sin(pAng) * 34;
        ctx.fillStyle = '#88eeff';
        ctx.beginPath();
        ctx.arc(px, py, 5, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    for (const pt of particles) {
      ctx.fillStyle = pt.color;
      ctx.fillRect(pt.x - pt.r / 2, pt.y - pt.r / 2, pt.r, pt.r);
    }

    for (const ft of floatingTexts) {
      ctx.fillStyle = ft.color;
      ctx.font = 'bold 12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(ft.text, ft.x, ft.y);
    }

    // HUD
    ctx.fillStyle = '#fff';
    ctx.font = 'bold 12px sans-serif';
    ctx.textAlign = 'left';
    ctx.fillText(`WAVE ${wave}/${MAX_WAVE}  SCORE ${score}`, 10, 18);
    ctx.textAlign = 'right';
    ctx.fillText(`HP ${player.hp}/${player.maxHp}  BOMB ${player.bombs}  BAR ${player.barriers}`, canvas.width - 10, 18);

    if (toastTimer > 0 && toastText) {
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(canvas.width / 2 - 110, 34, 220, 24);
      ctx.fillStyle = '#00ffcc';
      ctx.font = 'bold 12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(toastText, canvas.width / 2, 50);
    }

    // カード選択オーバーレイ
    if (gameState === 'CARD_SELECT') {
      ctx.fillStyle = 'rgba(0,0,0,0.78)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#00ffcc';
      ctx.font = 'bold 18px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('強化カードを選択', canvas.width / 2, 110);

      cardChoices.forEach((c, idx) => {
        const y = 150 + idx * 105;
        ctx.fillStyle = '#141824';
        ctx.fillRect(32, y, canvas.width - 64, 86);
        ctx.strokeStyle = c.star === 3 ? '#ffaa00' : (c.star === 2 ? '#66aaff' : '#00ffcc');
        ctx.lineWidth = 2;
        ctx.strokeRect(32, y, canvas.width - 64, 86);

        ctx.fillStyle = '#fff';
        ctx.font = 'bold 14px sans-serif';
        ctx.textAlign = 'left';
        ctx.fillText(`${'★'.repeat(c.star)} ${c.name}`, 46, y + 28);
        ctx.fillStyle = '#ccc';
        ctx.font = '12px sans-serif';
        ctx.fillText(c.desc, 46, y + 54);
      });
    }

    // デバッグオーバーレイ
    if (debugMode) {
      ctx.fillStyle = 'rgba(10, 20, 30, 0.88)';
      ctx.fillRect(14, canvas.height - 150, canvas.width - 28, 136);
      ctx.strokeStyle = '#ffaa00';
      ctx.strokeRect(14, canvas.height - 150, canvas.width - 28, 136);
      ctx.fillStyle = '#ffaa00';
      ctx.font = 'bold 12px sans-serif';
      ctx.textAlign = 'left';
      ctx.fillText(`DEBUG MODE | [1-9,0]:WAVE [C]:カード [G]:全開`, 24, canvas.height - 128);
      ctx.fillStyle = '#fff';
      ctx.fillText(`現在WAVE: ${wave} | 選択カード: ${ALL_CARDS[debugCardSelectIndex].name}`, 24, canvas.height - 106);
      ctx.fillText(`Gキーで全武装・HP最大・ボム/バリアMAX付与`, 24, canvas.height - 84);
    }

    if (gameState === 'PAUSE') {
      ctx.fillStyle = 'rgba(0,0,0,0.7)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#fff';
      ctx.font = 'bold 22px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('PAUSE', canvas.width / 2, canvas.height / 2 - 10);
      ctx.font = '13px sans-serif';
      ctx.fillText('Pキー または 画面タップで再開', canvas.width / 2, canvas.height / 2 + 20);
    }

    if (gameState === 'GAMEOVER' || gameState === 'CLEAR') {
      ctx.fillStyle = 'rgba(0,0,0,0.8)';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = gameState === 'CLEAR' ? '#00ffcc' : '#ff5566';
      ctx.font = 'bold 24px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText(gameState === 'CLEAR' ? 'GAME CLEAR!' : 'GAME OVER', canvas.width / 2, 220);

      ctx.fillStyle = '#fff';
      ctx.font = '15px sans-serif';
      ctx.fillText(`SCORE: ${score}  (BEST: ${highScore})`, canvas.width / 2, 260);

      ctx.fillStyle = '#00ffcc';
      ctx.fillRect(canvas.width / 2 - 85, 300, 170, 42);
      ctx.fillStyle = '#05050a';
      ctx.font = 'bold 15px sans-serif';
      ctx.fillText('RETRY', canvas.width / 2, 327);
    }

    ctx.restore();
  }

  // 入力処理（キーボード＆タッチ）
  const keys = {};
  window.addEventListener('keydown', (e) => {
    keys[e.code] = true;

    if (e.code === 'KeyP' && (gameState === 'PLAYING' || gameState === 'PAUSE')) {
      gameState = gameState === 'PLAYING' ? 'PAUSE' : 'PLAYING';
      syncBgmState();
      return;
    }
    if (e.code === 'Space') {
      e.preventDefault();
      useBomb();
    }
    if (e.code === 'KeyV') {
      useBarrier();
    }
    if (e.code === 'Backquote' || e.code === 'F2') {
      debugMode = !debugMode;
      showToast(debugMode ? 'デバッグモード ON' : 'デバッグモード OFF');
    }
    if (debugMode) {
      if (e.code >= 'Digit1' && e.code <= 'Digit9') {
        const w = parseInt(e.code.replace('Digit', ''), 10);
        resetGame(w);
      } else if (e.code === 'Digit0') {
        resetGame(10);
      } else if (e.code === 'KeyC') {
        applyCard(ALL_CARDS[debugCardSelectIndex]);
        debugCardSelectIndex = (debugCardSelectIndex + 1) % ALL_CARDS.length;
      } else if (e.code === 'KeyG') {
        player.maxHp = 10;
        player.hp = 10;
        player.bombs = MAX_BOMBS;
        player.barriers = MAX_BARRIERS;
        player.pets = MAX_PETS;
        player.sideShotLevel = 2;
        player.bombShotLevel = 2;
        player.laserLevel = 2;
        player.homingLevel = 2;
        player.spreadLevel = 2;
        player.damage += 3;
        showToast('デバッグ全強化付与！');
      }
    }
  });

  window.addEventListener('keyup', (e) => {
    keys[e.code] = false;
  });

  function getCanvasPos(touchOrEvent) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / (rect.width || 1);
    const scaleY = canvas.height / (rect.height || 1);
    return {
      x: (touchOrEvent.clientX - rect.left) * scaleX,
      y: (touchOrEvent.clientY - rect.top) * scaleY
    };
  }

  let lastTouchPos = null;

  canvas.addEventListener('touchstart', (e) => {
    e.preventDefault();
    syncBgmState();
    const t = e.touches[0];
    if (!t) return;
    const pos = getCanvasPos(t);
    lastTouchPos = pos;

    // 左上タップでデバッグモード切替
    if (pos.x < 48 && pos.y < 36) {
      debugMode = !debugMode;
      showToast(debugMode ? 'デバッグモード ON' : 'デバッグモード OFF');
      return;
    }

    if (gameState === 'TITLE') {
      if (pos.y > 282 && pos.y < 336) {
        gameState = 'ENCYCLOPEDIA';
        syncBgmState();
      } else {
        resetGame(1);
      }
      return;
    }

    if (gameState === 'ENCYCLOPEDIA') {
      gameState = 'TITLE';
      syncBgmState();
      return;
    }

    if (gameState === 'PAUSE') {
      gameState = 'PLAYING';
      syncBgmState();
      return;
    }

    if (gameState === 'CARD_SELECT') {
      cardChoices.forEach((c, idx) => {
        const y = 150 + idx * 105;
        if (pos.y >= y && pos.y <= y + 86) {
          applyCard(c);
          gameState = 'PLAYING';
          syncBgmState();
        }
      });
      return;
    }

    if (gameState === 'GAMEOVER' || gameState === 'CLEAR') {
      resetGame(1);
    }
  }, { passive: false });

  canvas.addEventListener('touchmove', (e) => {
    e.preventDefault();
    if (gameState !== 'PLAYING' || !lastTouchPos) return;
    const t = e.touches[0];
    if (!t) return;
    const pos = getCanvasPos(t);
    const dx = pos.x - lastTouchPos.x;
    const dy = pos.y - lastTouchPos.y;
    player.x += dx;
    player.y += dy;
    player.x = Math.max(player.w / 2 + 4, Math.min(canvas.width - player.w / 2 - 4, player.x));
    player.y = Math.max(player.h / 2 + 24, Math.min(canvas.height - player.h / 2 - 8, player.y));
    lastTouchPos = pos;
  }, { passive: false });

  canvas.addEventListener('touchend', () => {
    lastTouchPos = null;
  });

  // メインループ
  function loop() {
    try {
      update();
      render();
    } catch (err) {
      ctx.fillStyle = '#05050a';
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = '#ff5566';
      ctx.font = '12px sans-serif';
      ctx.textAlign = 'center';
      ctx.fillText('描画エラーを回避して継続中', canvas.width / 2, canvas.height / 2);
    }
    requestAnimationFrame(loop);
  }

  syncBgmState();
  requestAnimationFrame(loop);
})();
</script>
</body>
