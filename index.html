<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<style>
  body { background: #05050a; color: white; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
  canvas { border: 2px solid #00ffcc; }
</style>
</head>
<body>
<canvas id="canvas" width="360" height="540"></canvas>
<script>
  const canvas = document.getElementById('canvas');
  const ctx = canvas.getContext('2d');
  ctx.fillStyle = '#05050a';
  ctx.fillRect(0, 0, canvas.width, canvas.height);
  ctx.fillStyle = '#00ffcc';
  ctx.font = '24px sans-serif';
  ctx.textAlign = 'center';
  ctx.fillText('テスト表示', canvas.width/2, canvas.height/2);
</script>
</body>
</html>
