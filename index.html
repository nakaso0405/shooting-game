<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>スマホ・シューティング</title>
<style>
  body {
    background-color: #111;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    overflow: hidden;
    touch-action: none;
    font-family: sans-serif;
  }
  canvas {
    background-color: #000;
    border: 2px solid #00ffcc;
    max-width: 95vw;
    max-height: 80vh;
  }
  p {
    margin-top: 10px;
    font-size: 14px;
    color: #aaa;
  }
</style>
</head>
<body>

  <canvas id="gameCanvas" width="360" height="540"></canvas>
  <p>指で左右に移動 ／ 緑の「P」を取ると3方向ショット！</p>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  let score = 0;
  let isGameOver = false;
  let frameCount = 0;
  let powerUpTimer = 0; // 3方向ショットの残り時間

  const player = {
    x: canvas.width / 2 - 20,
    y: canvas.height - 60,
    width: 40,
    height: 40,
    color: "#00ffcc"
  };

  let bullets = [];
  let enemies = [];
  let items = []; // アイテムのリスト

  function movePlayer(clientX) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const touchX = (clientX - rect.left) * scaleX;
    player.x = touchX - player.width / 2;

    if (player.x < 0) player.x = 0;
    if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
  }

  canvas.addEventListener("touchmove", (e) => {
    e.preventDefault();
    if (!isGameOver && e.touches.length > 0) {
      movePlayer(e.touches[0].clientX);
    }
  }, { passive: false });

  canvas.addEventListener("touchstart", (e) => {
    e.preventDefault();
    if (isGameOver) {
      resetGame();
    } else if (e.touches.length > 0) {
      movePlayer(e.touches[0].clientX);
    }
  }, { passive: false });

  canvas.addEventListener("mousemove", (e) => {
    if (!isGameOver) movePlayer(e.clientX);
  });
  canvas.addEventListener("click", () => {
    if (isGameOver) resetGame();
  });

  function resetGame() {
    score = 0;
    isGameOver = false;
    frameCount = 0;
    powerUpTimer = 0;
    player.x = canvas.width / 2 - 20;
    bullets = [];
    enemies = [];
    items = [];
    loop();
  }

  function spawnEnemy() {
    if (Math.random() < 0.035) {
      enemies.push({
        x: Math.random() * (canvas.width - 35),
        y: -35,
        width: 35,
        height: 35,
        speed: 2.5 + Math.random() * 2.5
      });
    }
  }

  // パワーアップアイテムをときどき発生させる
  function spawnItem() {
    if (Math.random() < 0.004) { // 敵よりレアな出現率
      items.push({
        x: Math.random() * (canvas.width - 30),
        y: -30,
        width: 30,
        height: 30,
        speed: 2.5
      });
    }
  }

  function isColliding(a, b) {
    return a.x < b.x + b.width &&
           a.x + a.width > b.x &&
           a.y < b.y + b.height &&
           a.y + a.height > b.y;
  }

  function loop() {
    if (isGameOver) {
      ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ff4444";
      ctx.font = "bold 32px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);
      ctx.fillStyle = "white";
      ctx.font = "20px sans-serif";
      ctx.fillText("Score: " + score, canvas.width / 2, canvas.height / 2 + 20);
      ctx.font = "16px sans-serif";
      ctx.fillText("画面をタップして再挑戦", canvas.width / 2, canvas.height / 2 + 60);
      return;
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    frameCount++;

    // パワーアップの残り時間を減らす
    if (powerUpTimer > 0) {
      powerUpTimer--;
    }

    // 弾の発射処理（15フレームごと）
    if (frameCount % 15 === 0) {
      const centerX = player.x + player.width / 2 - 3;
      // 真ん中の弾（通常時もパワーアップ時も発射）
      bullets.push({
        x: centerX,
        y: player.y,
        width: 6,
        height: 15,
        vx: 0, // 横方向の速度
        vy: 9  // 縦方向の速度
      });

      // パワーアップ中は左右斜めにも追加発射！
      if (powerUpTimer > 0) {
        bullets.push({
          x: centerX,
          y: player.y,
          width: 6,
          height: 15,
          vx: -2.2, // 左斜めへ
          vy: 8.7
        });
        bullets.push({
          x: centerX,
          y: player.y,
          width: 6,
          height: 15,
          vx: 2.2, // 右斜めへ
          vy: 8.7
        });
      }
    }

    // プレイヤー描画（パワーアップ中は機体が金色に光る！）
    ctx.fillStyle = powerUpTimer > 0 ? "#ffd700" : player.color;
    ctx.beginPath();
    ctx.moveTo(player.x + player.width / 2, player.y);
    ctx.lineTo(player.x, player.y + player.height);
    ctx.lineTo(player.x + player.width, player.y + player.height);
    ctx.closePath();
    ctx.fill();

    // 弾の更新と描画
    ctx.fillStyle = powerUpTimer > 0 ? "#00ffff" : "#ffff00";
    for (let i = bullets.length - 1; i >= 0; i--) {
      let b = bullets[i];
      b.x += b.vx;
      b.y -= b.vy;
      ctx.fillRect(b.x, b.y, b.width, b.height);
      if (b.y < 0 || b.x < 0 || b.x > canvas.width) {
        bullets.splice(i, 1);
      }
    }

    // アイテムの生成・移動・描画・取得判定
    spawnItem();
    for (let i = items.length - 1; i >= 0; i--) {
      let item = items[i];
      item.y += item.speed;

      // 緑の丸いカプセルと「P」の文字を描画
      ctx.fillStyle = "#00ff66";
      ctx.beginPath();
      ctx.arc(item.x + item.width / 2, item.y + item.height / 2, item.width / 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#000";
      ctx.font = "bold 18px sans-serif";
      ctx.textAlign = "center";
      ctx.textBaseline = "middle";
      ctx.fillText("P", item.x + item.width / 2, item.y + item.height / 2 + 1);

      // 自機がアイテムに触れたらパワーアップ！
      if (isColliding(player, item)) {
        powerUpTimer = 600; // 約10秒間（60フレーム×10秒）
        score += 300;       // ボーナス点
        items.splice(i, 1);
        continue;
      }

      if (item.y > canvas.height) items.splice(i, 1);
    }

    // 敵の更新と描画
    spawnEnemy();
    ctx.fillStyle = "#ff4466";
    for (let i = enemies.length - 1; i >= 0; i--) {
      let e = enemies[i];
      e.y += e.speed;
      ctx.fillRect(e.x, e.y, e.width, e.height);

      if (isColliding(player, e)) {
        isGameOver = true;
      }

      for (let j = bullets.length - 1; j >= 0; j--) {
        if (isColliding(bullets[j], e)) {
          enemies.splice(i, 1);
          bullets.splice(j, 1);
          score += 100;
          break;
        }
      }

      if (e && e.y > canvas.height) enemies.splice(i, 1);
    }

    // スコアとパワーアップ残り時間表示
    ctx.fillStyle = "white";
    ctx.font = "20px sans-serif";
    ctx.textAlign = "left";
    ctx.textBaseline = "alphabetic";
    ctx.fillText("SCORE: " + score, 15, 30);

    if (powerUpTimer > 0) {
      ctx.fillStyle = "#00ff66";
      ctx.font = "bold 16px sans-serif";
      ctx.fillText("3-WAY: " + Math.ceil(powerUpTimer / 60) + "s", 15, 55);
    }

    requestAnimationFrame(loop);
  }

  loop();
</script>
</body>
</html>
