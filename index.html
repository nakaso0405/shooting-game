<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ローグライク・シューティング</title>
<style>
  body {
    background-color: #111;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    overflow: hidden;
    touch-action: none;
    font-family: sans-serif;
  }
  canvas {
    background-color: #05050a;
    border: 2px solid #00ffcc;
    max-width: 95vw;
    max-height: 82vh;
  }
  p {
    margin-top: 8px;
    font-size: 13px;
    color: #aaa;
  }
</style>
</head>
<body>

  <canvas id="gameCanvas" width="360" height="540"></canvas>
  <p>WAVE 5で中ボス、WAVE 10のラスボス（HP 1500）を倒してクリアを目指せ！</p>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  const HIGH_SCORE_KEY = "roguelike_shooting_highscore_v1";

  function loadHighScore() {
    try {
      const saved = localStorage.getItem(HIGH_SCORE_KEY);
      const parsed = saved ? parseInt(saved, 10) : 0;
      return Number.isFinite(parsed) && parsed > 0 ? parsed : 0;
    } catch (e) {
      return 0;
    }
  }

  function saveHighScoreIfNeeded() {
    if (score > highScore) {
      highScore = score;
      try {
        localStorage.setItem(HIGH_SCORE_KEY, String(highScore));
      } catch (e) {
        // 保存領域が使えない環境でもゲーム自体は続行
      }
    }
  }

  // ゲーム状態: "menu", "playing", "choosing", "gameover", "victory"
  let gameState = "menu";
  let score = 0;
  let highScore = loadHighScore();
  let wave = 1;
  let killsInWave = 0;
  let killsToNextWave = 10;
  let frameCount = 0;

  const player = {
    x: canvas.width / 2 - 20,
    y: canvas.height - 65,
    width: 40,
    height: 40,
    hp: 3,
    maxHp: 3,
    invincibleTimer: 0,
    fireInterval: 16,
    bulletCount: 1,
    bulletSpeed: 9,
    bulletDamage: 1,
    color: "#00ffcc"
  };

  let bullets = [];
  let enemies = [];
  let enemyBullets = [];
  let choices = [];
  let boss = null;

  const upgradePool = [
    { id: "multi", title: "拡散ショット", desc: "弾の同時発射数を +2", apply: () => { player.bulletCount = Math.min(7, player.bulletCount + 2); } },
    { id: "rapid", title: "超連射エンジン", desc: "弾の発射間隔を短縮", apply: () => { player.fireInterval = Math.max(5, Math.floor(player.fireInterval * 0.78)); } },
    { id: "power", title: "高威力プラズマ", desc: "弾の攻撃力 +1", apply: () => { player.bulletDamage += 1; } },
    { id: "heal", title: "ナノリペア", desc: "最大HP +1 ＆ 全回復", apply: () => { player.maxHp += 1; player.hp = player.maxHp; } },
    { id: "speed", title: "高速弾丸", desc: "弾のスピードUP", apply: () => { player.bulletSpeed += 2.5; } }
  ];

  function generateChoices() {
    const shuffled = [...upgradePool].sort(() => Math.random() - 0.5);
    choices = shuffled.slice(0, 3);
  }

  function getCardRects() {
    const cardW = 300;
    const cardH = 85;
    const startX = (canvas.width - cardW) / 2;
    const startY = 125;
    const gap = 18;
    return choices.map((c, idx) => ({
      x: startX,
      y: startY + idx * (cardH + gap),
      width: cardW,
      height: cardH,
      choice: c
    }));
  }

  function getStartButtonRect() {
    return {
      x: (canvas.width - 220) / 2,
      y: 315,
      width: 220,
      height: 54
    };
  }

  function getBackToMenuButtonRect() {
    return {
      x: (canvas.width - 210) / 2,
      y: canvas.height / 2 + 78,
      width: 210,
      height: 46
    };
  }

  function isPointInRect(x, y, rect) {
    return x >= rect.x && x <= rect.x + rect.width &&
           y >= rect.y && y <= rect.y + rect.height;
  }

  function spawnMidBoss() {
    boss = {
      type: "mid",
      name: "Δ-GUARDIAN",
      x: canvas.width / 2 - 42,
      y: 80,
      width: 84,
      height: 54,
      hp: 65,
      maxHp: 65,
      vx: 2.6,
      shootTimer: 0,
      patternCount: 0
    };
  }

  function spawnFinalBoss() {
    boss = {
      type: "final",
      name: "Ω-OVERLORD",
      x: canvas.width / 2 - 58,
      y: 85,
      width: 116,
      height: 74,
      hp: 1500,
      maxHp: 1500,
      vx: 3.1,
      shootTimer: 0,
      patternCount: 0
    };
  }

  function resetGameStats() {
    score = 0;
    wave = 1;
    killsInWave = 0;
    killsToNextWave = 10;
    frameCount = 0;
    boss = null;
    player.hp = 3;
    player.maxHp = 3;
    player.invincibleTimer = 0;
    player.fireInterval = 16;
    player.bulletCount = 1;
    player.bulletSpeed = 9;
    player.bulletDamage = 1;
    player.x = canvas.width / 2 - 20;
    bullets = [];
    enemies = [];
    enemyBullets = [];
  }

  function startNewGame() {
    resetGameStats();
    gameState = "playing";
  }

  function returnToMenu() {
    resetGameStats();
    highScore = loadHighScore();
    gameState = "menu";
  }

  function triggerGameOver() {
    saveHighScoreIfNeeded();
    gameState = "gameover";
  }

  function triggerVictory() {
    saveHighScoreIfNeeded();
    gameState = "victory";
  }

  function movePlayer(clientX) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const touchX = (clientX - rect.left) * scaleX;
    player.x = touchX - player.width / 2;
    if (player.x < 0) player.x = 0;
    if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
  }

  function handleTap(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const x = (clientX - rect.left) * (canvas.width / rect.width);
    const y = (clientY - rect.top) * (canvas.height / rect.height);

    if (gameState === "menu") {
      if (isPointInRect(x, y, getStartButtonRect())) {
        startNewGame();
      }
      return;
    }

    if (gameState === "gameover" || gameState === "victory") {
      if (isPointInRect(x, y, getBackToMenuButtonRect())) {
        returnToMenu();
      }
      return;
    }

    if (gameState === "choosing") {
      const cardRects = getCardRects();
      for (const r of cardRects) {
        if (isPointInRect(x, y, r)) {
          r.choice.apply();
          wave++;
          killsInWave = 0;
          killsToNextWave = 10 + (wave - 1) * 5;
          bullets = [];
          enemies = [];
          enemyBullets = [];
          boss = null;
          player.invincibleTimer = 60;
          gameState = "playing";

          if (wave === 5) {
            spawnMidBoss();
          } else if (wave === 10) {
            spawnFinalBoss();
          }
          break;
        }
      }
    }
  }

  canvas.addEventListener("touchmove", (e) => {
    e.preventDefault();
    if (gameState === "playing" && e.touches.length > 0) {
      movePlayer(e.touches[0].clientX);
    }
  }, { passive: false });

  canvas.addEventListener("touchstart", (e) => {
    e.preventDefault();
    if (e.touches.length > 0) {
      const t = e.touches[0];
      if (gameState === "playing") {
        movePlayer(t.clientX);
      } else {
        handleTap(t.clientX, t.clientY);
      }
    }
  }, { passive: false });

  canvas.addEventListener("mousemove", (e) => {
    if (gameState === "playing") movePlayer(e.clientX);
  });

  canvas.addEventListener("click", (e) => {
    if (gameState !== "playing") {
      handleTap(e.clientX, e.clientY);
    }
  });

  function spawnEnemy() {
    const spawnChance = Math.min(0.085, 0.035 + wave * 0.006);
    if (Math.random() >= spawnChance) return;

    const availableTypes = ["normal"];
    if (wave >= 2) {
      availableTypes.push("zigzag", "tank");
    }
    if (wave >= 3) {
      availableTypes.push("dash");
    }

    const type = availableTypes[Math.floor(Math.random() * availableTypes.length)];
    const waveBonusHp = Math.floor((wave - 1) / 2);

    if (type === "zigzag") {
      const startX = 40 + Math.random() * (canvas.width - 80);
      enemies.push({
        type: "zigzag",
        x: startX,
        baseX: startX,
        y: -34,
        width: 34,
        height: 34,
        hp: 1 + waveBonusHp,
        speed: 2.3 + wave * 0.18,
        phase: Math.random() * Math.PI * 2,
        scoreValue: 150,
        color: "#bb55ff"
      });
    } else if (type === "dash") {
      enemies.push({
        type: "dash",
        x: Math.random() * (canvas.width - 28),
        y: -32,
        width: 28,
        height: 32,
        hp: 1,
        speed: 5.2 + wave * 0.35,
        scoreValue: 200,
        color: "#ffdd22"
      });
    } else if (type === "tank") {
      enemies.push({
        type: "tank",
        x: Math.random() * (canvas.width - 48),
        y: -48,
        width: 48,
        height: 48,
        hp: 3 + waveBonusHp * 2,
        speed: 1.5 + wave * 0.12,
        scoreValue: 250,
        color: "#ff8800"
      });
    } else {
      enemies.push({
        type: "normal",
        x: Math.random() * (canvas.width - 36),
        y: -36,
        width: 36,
        height: 36,
        hp: 1 + waveBonusHp,
        speed: 2.4 + Math.random() * 1.5 + wave * 0.22,
        scoreValue: 100,
        color: "#ff4466"
      });
    }
  }

  function updateAndDrawEnemy(e) {
    e.y += e.speed;

    if (e.type === "zigzag") {
      e.phase += 0.08;
      e.x = e.baseX + Math.sin(e.phase) * 45;
      if (e.x < 0) e.x = 0;
      if (e.x > canvas.width - e.width) e.x = canvas.width - e.width;

      ctx.fillStyle = e.color;
      ctx.beginPath();
      ctx.moveTo(e.x + e.width / 2, e.y);
      ctx.lineTo(e.x + e.width, e.y + e.height / 2);
      ctx.lineTo(e.x + e.width / 2, e.y + e.height);
      ctx.lineTo(e.x, e.y + e.height / 2);
      ctx.closePath();
      ctx.fill();
    } else if (e.type === "dash") {
      ctx.fillStyle = e.color;
      ctx.beginPath();
      ctx.moveTo(e.x + e.width / 2, e.y + e.height);
      ctx.lineTo(e.x, e.y);
      ctx.lineTo(e.x + e.width, e.y);
      ctx.closePath();
      ctx.fill();
    } else {
      ctx.fillStyle = e.color;
      ctx.fillRect(e.x, e.y, e.width, e.height);
    }
  }

  function isColliding(a, b) {
    return a.x < b.x + b.width &&
           a.x + a.width > b.x &&
           a.y < b.y + b.height &&
           a.y + a.height > b.y;
  }

  function shootBullets() {
    const centerX = player.x + player.width / 2 - 3;
    const count = player.bulletCount;
    const spreadStep = 0.22;

    for (let i = 0; i < count; i++) {
      const offsetIndex = i - (count - 1) / 2;
      const vx = offsetIndex * spreadStep * player.bulletSpeed * 0.35;
      bullets.push({
        x: centerX,
        y: player.y,
        width: 6,
        height: 14,
        vx: vx,
        vy: player.bulletSpeed,
        damage: player.bulletDamage
      });
    }
  }

  function updateAndDrawBoss() {
    if (!boss) return;

    boss.x += boss.vx;
    if (boss.x <= 10 || boss.x + boss.width >= canvas.width - 10) {
      boss.vx *= -1;
    }

    boss.shootTimer++;
    if (boss.type === "mid") {
      if (boss.shootTimer >= 65) {
        boss.shootTimer = 0;
        const originX = boss.x + boss.width / 2 - 4;
        const originY = boss.y + boss.height;
        const speeds = [
          { vx: -1.1, vy: 4.2 },
          { vx: 1.1, vy: 4.2 }
        ];
        for (const s of speeds) {
          enemyBullets.push({
            x: originX,
            y: originY,
            width: 9,
            height: 9,
            vx: s.vx,
            vy: s.vy
          });
        }
      }

      ctx.fillStyle = "#5a189a";
      ctx.fillRect(boss.x, boss.y, boss.width, boss.height);
      ctx.strokeStyle = "#c77dff";
      ctx.lineWidth = 3;
      ctx.strokeRect(boss.x, boss.y, boss.width, boss.height);

      ctx.fillStyle = "#00ffcc";
      ctx.fillRect(boss.x + boss.width / 2 - 12, boss.y + 18, 24, 14);

      const barWidth = 140;
      const barX = (canvas.width - barWidth) / 2;
      ctx.fillStyle = "#333";
      ctx.fillRect(barX, boss.y - 16, barWidth, 8);
      ctx.fillStyle = "#c77dff";
      ctx.fillRect(barX, boss.y - 16, barWidth * Math.max(0, boss.hp / boss.maxHp), 8);

      ctx.fillStyle = "#e0aaff";
      ctx.font = "bold 12px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(boss.name + "  HP: " + Math.max(0, boss.hp) + " / " + boss.maxHp, canvas.width / 2, boss.y - 22);
    } else {
      if (boss.shootTimer >= 42) {
        boss.shootTimer = 0;
        boss.patternCount++;
        const originX = boss.x + boss.width / 2 - 5;
        const originY = boss.y + boss.height;
        const speeds = (boss.patternCount % 3 === 0)
          ? [
              { vx: -3.2, vy: 4.5 },
              { vx: -1.6, vy: 5.2 },
              { vx: 0, vy: 5.8 },
              { vx: 1.6, vy: 5.2 },
              { vx: 3.2, vy: 4.5 }
            ]
          : [
              { vx: -2.0, vy: 5.0 },
              { vx: 0, vy: 5.6 },
              { vx: 2.0, vy: 5.0 }
            ];
        for (const s of speeds) {
          enemyBullets.push({
            x: originX,
            y: originY,
            width: 10,
            height: 10,
            vx: s.vx,
            vy: s.vy
          });
        }
      }

      ctx.fillStyle = "#9e0022";
      ctx.fillRect(boss.x, boss.y, boss.width, boss.height);
      ctx.strokeStyle = "#ff4466";
      ctx.lineWidth = 3;
      ctx.strokeRect(boss.x, boss.y, boss.width, boss.height);

      ctx.fillStyle = "#ffcc00";
      ctx.fillRect(boss.x + 24, boss.y + 24, 18, 14);
      ctx.fillRect(boss.x + boss.width - 42, boss.y + 24, 18, 14);

      const barWidth = 170;
      const barX = (canvas.width - barWidth) / 2;
      ctx.fillStyle = "#333";
      ctx.fillRect(barX, boss.y - 16, barWidth, 8);
      ctx.fillStyle = "#ff4466";
      ctx.fillRect(barX, boss.y - 16, barWidth * Math.max(0, boss.hp / boss.maxHp), 8);

      ctx.fillStyle = "#ff7799";
      ctx.font = "bold 12px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(boss.name + "  HP: " + Math.max(0, boss.hp) + " / " + boss.maxHp, canvas.width / 2, boss.y - 22);
    }

    for (let j = bullets.length - 1; j >= 0; j--) {
      if (isColliding(bullets[j], boss)) {
        boss.hp -= bullets[j].damage;
        bullets.splice(j, 1);

        if (boss.type === "mid") {
          score += 30;
          if (boss.hp <= 0) {
            score += 1000;
            boss = null;
            enemyBullets = [];
            generateChoices();
            gameState = "choosing";
            return;
          }
        } else if (boss.type === "final") {
          score += 50;
          if (boss.hp <= 0) {
            score += 3000;
            boss = null;
            enemyBullets = [];
            triggerVictory();
            return;
          }
        }
      }
    }

    if (boss && player.invincibleTimer === 0 && isColliding(player, boss)) {
      player.hp -= 1;
      player.invincibleTimer = 60;
      if (player.hp <= 0) {
        triggerGameOver();
      }
    }
  }

  function drawMenuScreen() {
    ctx.fillStyle = "#05050a";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    // タイトルロゴ
    ctx.fillStyle = "#00ffcc";
    ctx.font = "bold 24px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("ROGUELIKE", canvas.width / 2, 115);

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 28px sans-serif";
    ctx.fillText("SHOOTING", canvas.width / 2, 150);

    // ハイスコア枠
    ctx.fillStyle = "#111927";
    ctx.strokeStyle = "#ffd700";
    ctx.lineWidth = 2;
    ctx.fillRect(55, 195, canvas.width - 110, 76);
    ctx.strokeRect(55, 195, canvas.width - 110, 76);

    ctx.fillStyle = "#ffd700";
    ctx.font = "bold 14px sans-serif";
    ctx.fillText("HIGH SCORE", canvas.width / 2, 222);

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 24px sans-serif";
    ctx.fillText(String(highScore), canvas.width / 2, 254);

    // ゲームスタートボタン
    const startBtn = getStartButtonRect();
    ctx.fillStyle = "#00ffcc";
    ctx.fillRect(startBtn.x, startBtn.y, startBtn.width, startBtn.height);

    ctx.fillStyle = "#05050a";
    ctx.font = "bold 20px sans-serif";
    ctx.fillText("ゲームスタート", canvas.width / 2, startBtn.y + 34);

    ctx.fillStyle = "#8899aa";
    ctx.font = "13px sans-serif";
    ctx.fillText("WAVE 10 ラスボス撃破でクリア", canvas.width / 2, 415);
  }

  function drawBackToMenuButton(borderColor, textColor) {
    const btn = getBackToMenuButtonRect();
    ctx.fillStyle = "#162032";
    ctx.strokeStyle = borderColor;
    ctx.lineWidth = 2;
    ctx.fillRect(btn.x, btn.y, btn.width, btn.height);
    ctx.strokeRect(btn.x, btn.y, btn.width, btn.height);

    ctx.fillStyle = textColor;
    ctx.font = "bold 17px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("メニューに戻る", canvas.width / 2, btn.y + 29);
  }

  function drawChoosingScreen() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#00ffcc";
    ctx.font = "bold 22px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("WAVE " + wave + " クリア！", canvas.width / 2, 65);

    ctx.fillStyle = "#fff";
    ctx.font = "15px sans-serif";
    ctx.fillText("強化カードを1つ選んでください", canvas.width / 2, 95);

    const cardRects = getCardRects();
    for (const r of cardRects) {
      ctx.fillStyle = "#1a2234";
      ctx.strokeStyle = "#00ffcc";
      ctx.lineWidth = 2;
      ctx.fillRect(r.x, r.y, r.width, r.height);
      ctx.strokeRect(r.x, r.y, r.width, r.height);

      ctx.fillStyle = "#ffd700";
      ctx.font = "bold 18px sans-serif";
      ctx.textAlign = "left";
      ctx.fillText(r.choice.title, r.x + 16, r.y + 32);

      ctx.fillStyle = "#e0e0e0";
      ctx.font = "14px sans-serif";
      ctx.fillText(r.choice.desc, r.x + 16, r.y + 60);
    }
  }

  function drawGameOverScreen() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.82)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#ff4444";
    ctx.font = "bold 32px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 58);

    ctx.fillStyle = "white";
    ctx.font = "18px sans-serif";
    ctx.fillText("到達 WAVE: " + wave, canvas.width / 2, canvas.height / 2 - 12);
    ctx.fillText("SCORE: " + score, canvas.width / 2, canvas.height / 2 + 18);

    ctx.fillStyle = "#ffd700";
    ctx.font = "bold 16px sans-serif";
    ctx.fillText("HIGH SCORE: " + highScore, canvas.width / 2, canvas.height / 2 + 50);

    drawBackToMenuButton("#00ffcc", "#00ffcc");
  }

  function drawVictoryScreen() {
    ctx.fillStyle = "rgba(0, 10, 20, 0.88)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#ffd700";
    ctx.font = "bold 30px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("GAME CLEAR!", canvas.width / 2, canvas.height / 2 - 68);

    ctx.fillStyle = "#00ffcc";
    ctx.font = "bold 16px sans-serif";
    ctx.fillText("Ω-OVERLORD 撃破おめでとう！", canvas.width / 2, canvas.height / 2 - 32);

    ctx.fillStyle = "white";
    ctx.font = "18px sans-serif";
    ctx.fillText("FINAL SCORE: " + score, canvas.width / 2, canvas.height / 2 + 6);

    ctx.fillStyle = "#ffd700";
    ctx.font = "bold 16px sans-serif";
    ctx.fillText("HIGH SCORE: " + highScore, canvas.width / 2, canvas.height / 2 + 38);

    drawBackToMenuButton("#ffd700", "#ffd700");
  }

  function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (gameState === "menu") {
      drawMenuScreen();
    } else if (gameState === "playing") {
      frameCount++;
      if (player.invincibleTimer > 0) player.invincibleTimer--;

      if (frameCount % player.fireInterval === 0) {
        shootBullets();
      }

      if (player.invincibleTimer === 0 || Math.floor(player.invincibleTimer / 4) % 2 === 0) {
        ctx.fillStyle = player.color;
        ctx.beginPath();
        ctx.moveTo(player.x + player.width / 2, player.y);
        ctx.lineTo(player.x, player.y + player.height);
        ctx.lineTo(player.x + player.width, player.y + player.height);
        ctx.closePath();
        ctx.fill();
      }

      ctx.fillStyle = "#ffff00";
      for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.x += b.vx;
        b.y -= b.vy;
        ctx.fillRect(b.x, b.y, b.width, b.height);
        if (b.y < -20 || b.x < -20 || b.x > canvas.width + 20) {
          bullets.splice(i, 1);
        }
      }

      if (wave === 5 || wave === 10) {
        updateAndDrawBoss();
      } else {
        spawnEnemy();
        for (let i = enemies.length - 1; i >= 0; i--) {
          let e = enemies[i];
          updateAndDrawEnemy(e);

          if (player.invincibleTimer === 0 && isColliding(player, e)) {
            player.hp -= 1;
            player.invincibleTimer = 60;
            enemies.splice(i, 1);
            if (player.hp <= 0) {
              triggerGameOver();
              break;
            }
            continue;
          }

          let destroyed = false;
          for (let j = bullets.length - 1; j >= 0; j--) {
            if (isColliding(bullets[j], e)) {
              e.hp -= bullets[j].damage;
              bullets.splice(j, 1);
              if (e.hp <= 0) {
                enemies.splice(i, 1);
                score += e.scoreValue;
                killsInWave++;
                destroyed = true;
              }
              break;
            }
          }
          if (destroyed) {
            if (killsInWave >= killsToNextWave) {
              generateChoices();
              gameState = "choosing";
              break;
            }
            continue;
          }

          if (e.y > canvas.height) {
            enemies.splice(i, 1);
          }
        }
      }

      ctx.fillStyle = "#ff55aa";
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        let eb = enemyBullets[i];
        eb.x += eb.vx;
        eb.y += eb.vy;
        ctx.fillRect(eb.x, eb.y, eb.width, eb.height);

        if (player.invincibleTimer === 0 && isColliding(player, eb)) {
          player.hp -= 1;
          player.invincibleTimer = 60;
          enemyBullets.splice(i, 1);
          if (player.hp <= 0) {
            triggerGameOver();
            break;
          }
          continue;
        }

        if (eb.y > canvas.height + 20 || eb.x < -20 || eb.x > canvas.width + 20) {
          enemyBullets.splice(i, 1);
        }
      }

      ctx.fillStyle = "white";
      ctx.font = "bold 15px sans-serif";
      ctx.textAlign = "left";
      if (wave === 5) {
        ctx.fillStyle = "#c77dff";
        ctx.fillText("WAVE 5 - MID-BOSS", 12, 24);
        ctx.fillStyle = "white";
      } else if (wave === 10) {
        ctx.fillStyle = "#ff5577";
        ctx.fillText("WAVE 10 - FINAL BOSS", 12, 24);
        ctx.fillStyle = "white";
      } else {
        ctx.fillText("WAVE " + wave + " (" + killsInWave + "/" + killsToNextWave + ")", 12, 24);
      }
      ctx.fillText("SCORE: " + score, 12, 44);

      ctx.textAlign = "right";
      ctx.fillStyle = "#ff6688";
      ctx.fillText("HP: " + "♥".repeat(player.hp) + "♡".repeat(Math.max(0, player.maxHp - player.hp)), canvas.width - 12, 24);
    } else if (gameState === "choosing") {
      drawChoosingScreen();
    } else if (gameState === "gameover") {
      drawGameOverScreen();
    } else if (gameState === "victory") {
      drawVictoryScreen();
    }

    requestAnimationFrame(loop);
  }

  loop();
</script>
</body>
</html>
