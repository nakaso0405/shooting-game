<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>スマホ・シューティング</title>
<style>
  body {
    background-color: #111;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    overflow: hidden; /* 画面のスクロールを防止 */
    touch-action: none; /* スマホの引っ張り更新などを防止 */
    font-family: sans-serif;
  }
  canvas {
    background-color: #000;
    border: 2px solid #00ffcc;
    max-width: 95vw;
    max-height: 80vh;
  }
  p {
    margin-top: 10px;
    font-size: 14px;
    color: #aaa;
  }
</style>
</head>
<body>

  <canvas id="gameCanvas" width="360" height="540"></canvas>
  <p>画面を指で左右に動かして操作（弾は自動発射）</p>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  let score = 0;
  let isGameOver = false;
  let frameCount = 0;

  const player = {
    x: canvas.width / 2 - 20,
    y: canvas.height - 60,
    width: 40,
    height: 40,
    color: "#00ffcc"
  };

  let bullets = [];
  let enemies = [];

  // スマホのタッチ操作（指の位置に合わせて自機を移動）
  function movePlayer(clientX) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const touchX = (clientX - rect.left) * scaleX;
    player.x = touchX - player.width / 2;

    // 画面の外に出ないように制限
    if (player.x < 0) player.x = 0;
    if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
  }

  canvas.addEventListener("touchmove", (e) => {
    e.preventDefault();
    if (!isGameOver && e.touches.length > 0) {
      movePlayer(e.touches[0].clientX);
    }
  }, { passive: false });

  canvas.addEventListener("touchstart", (e) => {
    e.preventDefault();
    if (isGameOver) {
      resetGame();
    } else if (e.touches.length > 0) {
      movePlayer(e.touches[0].clientX);
    }
  }, { passive: false });

  // パソコンのマウスでもテストできるように対応
  canvas.addEventListener("mousemove", (e) => {
    if (!isGameOver) movePlayer(e.clientX);
  });
  canvas.addEventListener("click", () => {
    if (isGameOver) resetGame();
  });

  function resetGame() {
    score = 0;
    isGameOver = false;
    frameCount = 0;
    player.x = canvas.width / 2 - 20;
    bullets = [];
    enemies = [];
    loop();
  }

  function spawnEnemy() {
    if (Math.random() < 0.035) {
      enemies.push({
        x: Math.random() * (canvas.width - 35),
        y: -35,
        width: 35,
        height: 35,
        speed: 2.5 + Math.random() * 2.5
      });
    }
  }

  function isColliding(a, b) {
    return a.x < b.x + b.width &&
           a.x + a.width > b.x &&
           a.y < b.y + b.height &&
           a.y + a.height > b.y;
  }

  function loop() {
    if (isGameOver) {
      ctx.fillStyle = "rgba(0, 0, 0, 0.75)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ff4444";
      ctx.font = "bold 32px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);
      ctx.fillStyle = "white";
      ctx.font = "20px sans-serif";
      ctx.fillText("Score: " + score, canvas.width / 2, canvas.height / 2 + 20);
      ctx.font = "16px sans-serif";
      ctx.fillText("画面をタップして再挑戦", canvas.width / 2, canvas.height / 2 + 60);
      return;
    }

    ctx.clearRect(0, 0, canvas.width, canvas.height);
    frameCount++;

    // 15フレームごとに自動で弾を発射
    if (frameCount % 15 === 0) {
      bullets.push({
        x: player.x + player.width / 2 - 3,
        y: player.y,
        width: 6,
        height: 15,
        speed: 9
      });
    }

    // プレイヤー描画
    ctx.fillStyle = player.color;
    ctx.beginPath();
    ctx.moveTo(player.x + player.width / 2, player.y);
    ctx.lineTo(player.x, player.y + player.height);
    ctx.lineTo(player.x + player.width, player.y + player.height);
    ctx.closePath();
    ctx.fill();

    // 弾の更新と描画
    ctx.fillStyle = "#ffff00";
    for (let i = bullets.length - 1; i >= 0; i--) {
      let b = bullets[i];
      b.y -= b.speed;
      ctx.fillRect(b.x, b.y, b.width, b.height);
      if (b.y < 0) bullets.splice(i, 1);
    }

    // 敵の更新と描画
    spawnEnemy();
    ctx.fillStyle = "#ff4466";
    for (let i = enemies.length - 1; i >= 0; i--) {
      let e = enemies[i];
      e.y += e.speed;
      ctx.fillRect(e.x, e.y, e.width, e.height);

      if (isColliding(player, e)) {
        isGameOver = true;
      }

      for (let j = bullets.length - 1; j >= 0; j--) {
        if (isColliding(bullets[j], e)) {
          enemies.splice(i, 1);
          bullets.splice(j, 1);
          score += 100;
          break;
        }
      }

      if (e && e.y > canvas.height) enemies.splice(i, 1);
    }

    // スコア表示
    ctx.fillStyle = "white";
    ctx.font = "20px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("SCORE: " + score, 15, 30);

    requestAnimationFrame(loop);
  }

  loop();
</script>
</body>
</html>
