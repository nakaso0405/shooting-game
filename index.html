<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ローグライク・シューティング</title>
<style>
  body {
    background-color: #111;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    overflow: hidden;
    touch-action: none;
    font-family: sans-serif;
  }
  canvas {
    background-color: #05050a;
    border: 2px solid #00ffcc;
    max-width: 95vw;
    max-height: 82vh;
  }
  p {
    margin-top: 8px;
    font-size: 13px;
    color: #aaa;
  }
</style>
</head>
<body>

  <canvas id="gameCanvas" width="360" height="540"></canvas>
  <p>画面をタッチ＆スライドして上下左右に移動！</p>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  const HIGH_SCORE_KEY = "roguelike_shooting_highscore_v1";
  const PLAYER_INVINCIBLE_DURATION = 90; // 約1.5秒（60fps換算）
  const BASE_PLAYER_SPEED = 2.2;
  const MAX_WAVE = 10;

  // BGM設定（メニュー用とプレイ用で別々の曲を設定できます）
  const menuBgm = new Audio("./menu_bgm.mp3");
  menuBgm.loop = true;
  menuBgm.volume = 0.45;

  const gameBgm = new Audio("./bgm.mp3");
  gameBgm.loop = true;
  gameBgm.volume = 0.45;

  let isMuted = false;

  // 制作者向けデバッグモード状態
  let isDebugMode = false;
  let isGodMode = false;
  let secretTapCount = 0;
  let lastSecretTapTime = 0;

  function getTargetBgm() {
    return gameState === "menu" ? menuBgm : gameBgm;
  }

  function syncBgmPlayback() {
    const target = getTargetBgm();
    const other = target === menuBgm ? gameBgm : menuBgm;

    if (!other.paused) {
      other.pause();
    }

    if (isMuted) {
      target.muted = true;
      return;
    }

    target.muted = false;
    if (target.paused) {
      target.play().catch(() => {});
    }
  }

  function ensureBgmPlaying() {
    syncBgmPlayback();
  }

  function toggleMute() {
    isMuted = !isMuted;
    menuBgm.muted = isMuted;
    gameBgm.muted = isMuted;
    syncBgmPlayback();
  }

  // 外部画像（ドット絵PNG）の読み込み設定
  const playerSprite = new Image();
  playerSprite.src = "./player.png";

  const enemySprites = {
    normal: new Image(),
    zigzag: new Image(),
    dash: new Image(),
    tank: new Image(),
    weave: new Image(),
    erratic: new Image(),
    midBoss: new Image(),
    finalBoss: new Image()
  };

  enemySprites.normal.src = "./enemy_normal.png";
  enemySprites.zigzag.src = "./enemy_zigzag.png";
  enemySprites.dash.src = "./enemy_dash.png";
  enemySprites.tank.src = "./enemy_tank.png";
  enemySprites.weave.src = "./enemy_weave.png";
  enemySprites.erratic.src = "./enemy_erratic.png";
  enemySprites.midBoss.src = "./boss_mid.png";
  enemySprites.finalBoss.src = "./boss_final.png";

  function drawSpriteIfReady(img, x, y, width, height) {
    if (img && img.complete && img.naturalWidth > 0) {
      ctx.save();
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(img, x, y, width, height);
      ctx.restore();
      return true;
    }
    return false;
  }

  function loadHighScore() {
    try {
      const saved = localStorage.getItem(HIGH_SCORE_KEY);
      const parsed = saved ? parseInt(saved, 10) : 0;
      return Number.isFinite(parsed) && parsed > 0 ? parsed : 0;
    } catch (e) {
      return 0;
    }
  }

  function saveHighScoreIfNeeded() {
    if (isDebugMode) return;
    if (score > highScore) {
      highScore = score;
      try {
        localStorage.setItem(HIGH_SCORE_KEY, String(highScore));
      } catch (e) {}
    }
  }

  function resetHighScore() {
    highScore = 0;
    try {
      localStorage.removeItem(HIGH_SCORE_KEY);
    } catch (e) {}
    confirmReset = false;
  }

  // ゲーム状態: "menu", "playing", "paused", "choosing", "waveSelect", "gameover", "victory"
  let gameState = "menu";
  let confirmReset = false;
  let score = 0;
  let highScore = loadHighScore();
  let wave = 1;
  let killsInWave = 0;
  let killsToNextWave = 10;
  let frameCount = 0;

  // 流れる星空の背景（遠景・中景・近景の3層パララックス）
  const STAR_COLORS = ["#ffffff", "#cceeff", "#aaddff", "#fff5cc", "#80ffea"];
  const stars = [];

  function initStarfield() {
    stars.length = 0;
    const layers = [
      { count: 34, minSize: 1.0, maxSize: 1.4, minSpeed: 0.45, maxSpeed: 0.85, minAlpha: 0.28, maxAlpha: 0.52 },
      { count: 20, minSize: 1.6, maxSize: 2.2, minSpeed: 1.25, maxSpeed: 1.95, minAlpha: 0.50, maxAlpha: 0.78 },
      { count: 11, minSize: 2.4, maxSize: 3.1, minSpeed: 2.40, maxSpeed: 3.50, minAlpha: 0.75, maxAlpha: 1.00 }
    ];

    for (const layer of layers) {
      for (let i = 0; i < layer.count; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: layer.minSize + Math.random() * (layer.maxSize - layer.minSize),
          speed: layer.minSpeed + Math.random() * (layer.maxSpeed - layer.minSpeed),
          alpha: layer.minAlpha + Math.random() * (layer.maxAlpha - layer.minAlpha),
          color: STAR_COLORS[Math.floor(Math.random() * STAR_COLORS.length)],
          twinklePhase: Math.random() * Math.PI * 2
        });
      }
    }
  }

  function updateAndDrawStarfield(updatePhysics = true, speedMultiplier = 1.0) {
    ctx.fillStyle = "#05050a";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      if (updatePhysics) {
        s.y += s.speed * speedMultiplier;
        s.twinklePhase += 0.04;
        if (s.y > canvas.height + 4) {
          s.y = -4;
          s.x = Math.random() * canvas.width;
        }
      }

      const twinkle = 0.85 + Math.sin(s.twinklePhase) * 0.15;
      ctx.save();
      ctx.globalAlpha = Math.min(1, s.alpha * twinkle);
      ctx.fillStyle = s.color;
      ctx.fillRect(Math.floor(s.x), Math.floor(s.y), Math.ceil(s.size), Math.ceil(s.size));
      ctx.restore();
    }
  }

  initStarfield();

  // 撃破エフェクト（火花パーティクル・衝撃波リング・画面揺れ）
  let particles = [];
  let shockwaves = [];
  let screenShake = 0;

  function getExplosionPalette(type) {
    if (type === "zigzag") return ["#e040fb", "#ea80fc", "#00ffcc", "#ffffff"];
    if (type === "dash") return ["#ff6d00", "#ffab00", "#fff59d", "#ffffff"];
    if (type === "tank") return ["#78909c", "#90a4ae", "#cfd8dc", "#ffffff"];
    if (type === "weave") return ["#00e676", "#00c853", "#69f0ae", "#ffffff"];
    if (type === "erratic") return ["#00b0ff", "#40c4ff", "#18ffff", "#ffffff"];
    if (type === "mid") return ["#e040fb", "#00ffcc", "#ffd740", "#ffffff"];
    if (type === "final") return ["#ff1744", "#ff9100", "#ffd600", "#00ffcc", "#ffffff"];
    return ["#ff5252", "#ffab40", "#fff59d", "#ffffff"];
  }

  function spawnExplosion(x, y, type = "normal", scale = 1) {
    const palette = getExplosionPalette(type);
    const particleCount = Math.round(14 * scale);

    for (let i = 0; i < particleCount; i++) {
      const angle = (Math.PI * 2 * i) / particleCount + (Math.random() - 0.5) * 0.45;
      const speed = (1.6 + Math.random() * 3.4) * Math.sqrt(scale);
      const maxLife = Math.round((16 + Math.random() * 12) * Math.min(1.8, scale));
      particles.push({
        x: x,
        y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        size: (2.2 + Math.random() * 2.8) * Math.min(1.6, scale),
        color: palette[Math.floor(Math.random() * palette.length)],
        life: maxLife,
        maxLife: maxLife
      });
    }

    shockwaves.push({
      x: x,
      y: y,
      radius: 4 * scale,
      maxRadius: 28 * scale,
      color: palette[0],
      life: Math.round(14 * Math.min(1.6, scale)),
      maxLife: Math.round(14 * Math.min(1.6, scale))
    });

    if (scale >= 2.0) {
      shockwaves.push({
        x: x,
        y: y,
        radius: 2,
        maxRadius: 42 * scale,
        color: "#ffffff",
        life: 22,
        maxLife: 22
      });
    }

    screenShake = Math.max(screenShake, Math.min(8, Math.round(2.5 * scale)));
  }

  function updateAndDrawEffects(updatePhysics = true) {
    for (let i = shockwaves.length - 1; i >= 0; i--) {
      const sw = shockwaves[i];
      if (updatePhysics) {
        sw.life--;
        const progress = 1 - Math.max(0, sw.life / sw.maxLife);
        sw.radius = 4 + (sw.maxRadius - 4) * (1 - Math.pow(1 - progress, 2));
      }
      if (sw.life <= 0) {
        shockwaves.splice(i, 1);
        continue;
      }
      ctx.save();
      ctx.globalAlpha = Math.max(0, sw.life / sw.maxLife) * 0.85;
      ctx.strokeStyle = sw.color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      if (updatePhysics) {
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.92;
        p.vy *= 0.92;
        p.life--;
      }
      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }
      const alpha = Math.max(0, p.life / p.maxLife);
      const drawSize = p.size * (0.4 + 0.6 * alpha);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - drawSize / 2, p.y - drawSize / 2, drawSize, drawSize);
      ctx.restore();
    }
  }

  const player = {
    x: canvas.width / 2 - 20,
    y: canvas.height - 75,
    width: 40,
    height: 40,
    speed: BASE_PLAYER_SPEED,
    hp: 3,
    maxHp: 3,
    invincibleTimer: 0,
    fireInterval: 16,
    bulletCount: 1,
    bulletSpeed: 9,
    bulletDamage: 1,
    bulletWidth: 6,
    bulletHeight: 14,
    color: "#00ffcc"
  };

  // イラストの中心胴体（コア）に合わせた少し小さめの当たり判定
  function getPlayerHitbox() {
    const hitW = Math.round(player.width * 0.6);
    const hitH = Math.round(player.height * 0.65);
    return {
      x: player.x + (player.width - hitW) / 2,
      y: player.y + (player.height - hitH) / 2 + 2,
      width: hitW,
      height: hitH
    };
  }

  function damagePlayer(amount = 1) {
    if (isGodMode) return false;
    if (player.invincibleTimer > 0) return false;
    player.hp -= amount;
    player.invincibleTimer = PLAYER_INVINCIBLE_DURATION;
    spawnExplosion(player.x + player.width / 2, player.y + player.height / 2, "dash", 0.9);
    if (player.hp <= 0) {
      player.hp = 0;
      triggerGameOver();
    }
    return true;
  }

  function drawPlayerIllustration() {
    const isInvincible = player.invincibleTimer > 0 || isGodMode;
    if (!isGodMode && player.invincibleTimer > 0 && Math.floor(player.invincibleTimer / 3) % 2 !== 0) {
      return;
    }

    ctx.save();
    if (isInvincible) {
      ctx.globalAlpha = isGodMode ? 0.92 : 0.72;
    }

    if (!drawSpriteIfReady(playerSprite, player.x, player.y, player.width, player.height)) {
      const cx = player.x + player.width / 2;
      const flameFlicker = (frameCount % 4) * 2;

      // 推進ノズルの噴射炎
      ctx.fillStyle = "#ff9100";
      ctx.beginPath();
      ctx.moveTo(cx - 7, player.y + player.height - 2);
      ctx.lineTo(cx, player.y + player.height + 9 + flameFlicker);
      ctx.lineTo(cx + 7, player.y + player.height - 2);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#fff59d";
      ctx.beginPath();
      ctx.moveTo(cx - 3.5, player.y + player.height - 2);
      ctx.lineTo(cx, player.y + player.height + 4 + Math.floor(flameFlicker / 2));
      ctx.lineTo(cx + 3.5, player.y + player.height - 2);
      ctx.closePath();
      ctx.fill();

      // 主翼・機体シルエット
      ctx.fillStyle = "#00897b";
      ctx.beginPath();
      ctx.moveTo(cx, player.y + 8);
      ctx.lineTo(player.x + player.width + 2, player.y + player.height - 4);
      ctx.lineTo(cx + 9, player.y + player.height - 7);
      ctx.lineTo(cx - 9, player.y + player.height - 7);
      ctx.lineTo(player.x - 2, player.y + player.height - 4);
      ctx.closePath();
      ctx.fill();

      // メインボディ
      ctx.fillStyle = player.color;
      ctx.beginPath();
      ctx.moveTo(cx, player.y);
      ctx.lineTo(cx + 11, player.y + player.height - 6);
      ctx.lineTo(cx, player.y + player.height - 10);
      ctx.lineTo(cx - 11, player.y + player.height - 6);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = "#b2fff2";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // コックピット（キャノピー）
      ctx.fillStyle = "#1a237e";
      ctx.beginPath();
      ctx.ellipse(cx, player.y + 18, 4.2, 7.5, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#80d8ff";
      ctx.beginPath();
      ctx.ellipse(cx - 1, player.y + 15.5, 1.8, 3.2, -0.2, 0, Math.PI * 2);
      ctx.fill();
    }

    // 無敵時間中・GodMode中のバリアリング表示
    if (isInvincible) {
      const cx = player.x + player.width / 2;
      const cy = player.y + player.height / 2;
      ctx.strokeStyle = isGodMode ? "#ffd700" : "#80ffff";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(cx, cy, 23, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.restore();
  }

  // 指を止めた瞬間にピタッと止まる「相対スライド追従」操作処理
  const dragInput = {
    active: false,
    touchId: null,
    lastX: 0,
    lastY: 0,
    pendingDx: 0,
    pendingDy: 0
  };

  function clearStickInput() {
    dragInput.active = false;
    dragInput.touchId = null;
    dragInput.pendingDx = 0;
    dragInput.pendingDy = 0;
  }

  function getCanvasCoords(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (clientX - rect.left) * (canvas.width / rect.width),
      y: (clientY - rect.top) * (canvas.height / rect.height)
    };
  }

  function beginStickInput(clientX, clientY, touchId = null) {
    const pos = getCanvasCoords(clientX, clientY);
    dragInput.active = true;
    dragInput.touchId = touchId;
    dragInput.lastX = pos.x;
    dragInput.lastY = pos.y;
    dragInput.pendingDx = 0;
    dragInput.pendingDy = 0;
  }

  function moveStickInput(clientX, clientY) {
    if (!dragInput.active) return;
    const pos = getCanvasCoords(clientX, clientY);
    const diffX = pos.x - dragInput.lastX;
    const diffY = pos.y - dragInput.lastY;
    dragInput.lastX = pos.x;
    dragInput.lastY = pos.y;

    // 1.0px未満のわずかな指の震えは無視してピタッと止まりやすくする
    if (Math.hypot(diffX, diffY) < 1.0) return;

    dragInput.pendingDx += diffX;
    dragInput.pendingDy += diffY;
  }

  function updatePlayerMovement() {
    if (!dragInput.active) return;
    if (dragInput.pendingDx === 0 && dragInput.pendingDy === 0) return;

    // 落ち着いて狙いやすい控えめな追従感度と1フレーム上限
    const sensitivity = 0.55 * (player.speed / BASE_PLAYER_SPEED);
    const maxStep = player.speed * 1.65;

    const moveX = Math.max(-maxStep, Math.min(maxStep, dragInput.pendingDx * sensitivity));
    const moveY = Math.max(-maxStep, Math.min(maxStep, dragInput.pendingDy * sensitivity));

    player.x += moveX;
    player.y += moveY;

    // 使い切った移動量をリセット（次のフレームで指が止まっていれば即停止）
    dragInput.pendingDx = 0;
    dragInput.pendingDy = 0;

    if (player.x < 0) player.x = 0;
    if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
    if (player.y < 56) player.y = 56;
    if (player.y > canvas.height - player.height) player.y = canvas.height - player.height;
  }

  let bullets = [];
  let enemies = [];
  let enemyBullets = [];
  let choices = [];
  let boss = null;

  const upgradePool = [
    { id: "multi", minWave: 5, rarity: "normal", title: "拡散ショット", desc: "弾の同時発射数を +2", apply: () => { player.bulletCount = Math.min(7, player.bulletCount + 2); } },
    { id: "rapid", rarity: "normal", title: "超連射エンジン", desc: "弾の発射間隔を短縮", apply: () => { player.fireInterval = Math.max(5, Math.floor(player.fireInterval * 0.78)); } },
    { id: "power", rarity: "normal", title: "高威力プラズマ", desc: "弾の攻撃力 +1", apply: () => { player.bulletDamage += 1; } },
    { id: "heal", rarity: "normal", title: "ナノリペア", desc: "最大HP +1 ＆ 全回復", apply: () => { player.maxHp += 1; player.hp = player.maxHp; } },
    { id: "speed", rarity: "normal", title: "高速弾丸", desc: "弾のスピードUP", apply: () => { player.bulletSpeed += 2.5; } },
    { id: "moveSpeed", rarity: "normal", title: "ブースターアクセル", desc: "自機の移動速度UP (+1.0)", apply: () => { player.speed = Math.min(7.5, Number((player.speed + 1.0).toFixed(1))); } },
    { id: "bulletSize", rarity: "normal", title: "ビッグバレット", desc: "弾のサイズUP", apply: () => {
      player.bulletWidth = Math.min(24, player.bulletWidth + 3);
      player.bulletHeight = Math.min(34, player.bulletHeight + 4);
    } },
    {
      id: "hyperBlitz",
      minWave: 3,
      rarity: "rare",
      title: "★ ハイパーブリッツ",
      desc: "移動速度UP＆巨大弾化",
      apply: () => {
        player.speed = Math.min(8.0, Number((player.speed + 1.3).toFixed(1)));
        player.bulletWidth = Math.min(24, player.bulletWidth + 5);
        player.bulletHeight = Math.min(34, player.bulletHeight + 6);
      }
    }
  ];

  function pickWeightedCard(pool) {
    const totalWeight = pool.reduce((sum, item) => sum + (item.rarity === "rare" ? 1 : 4), 0);
    let roll = Math.random() * totalWeight;
    for (const item of pool) {
      roll -= (item.rarity === "rare" ? 1 : 4);
      if (roll <= 0) return item;
    }
    return pool[pool.length - 1];
  }

  function generateChoices() {
    const eligiblePool = upgradePool.filter((u) => !u.minWave || wave >= u.minWave);
    const remaining = [...eligiblePool];
    choices = [];

    while (choices.length < 3 && remaining.length > 0) {
      const picked = pickWeightedCard(remaining);
      choices.push(picked);
      const idx = remaining.indexOf(picked);
      remaining.splice(idx, 1);
    }
  }

  function getCardRects() {
    const cardW = 300;
    const cardH = 85;
    const startX = (canvas.width - cardW) / 2;
    const startY = 125;
    const gap = 18;
    return choices.map((c, idx) => ({
      x: startX,
      y: startY + idx * (cardH + gap),
      width: cardW,
      height: cardH,
      choice: c
    }));
  }

  function getStartButtonRect() {
    return {
      x: (canvas.width - 220) / 2,
      y: 274,
      width: 220,
      height: 46
    };
  }

  function getMuteButtonRect() {
    return {
      x: (canvas.width - 190) / 2,
      y: 330,
      width: 190,
      height: 36
    };
  }

  function getResetButtonRect() {
    return {
      x: (canvas.width - 190) / 2,
      y: 376,
      width: 190,
      height: 36
    };
  }

  function getMenuRetryButtonRect() {
    return {
      x: (canvas.width - 190) / 2,
      y: 422,
      width: 190,
      height: 36
    };
  }

  function getConfirmYesButtonRect() {
    return {
      x: 42,
      y: 386,
      width: 130,
      height: 40
    };
  }

  function getConfirmNoButtonRect() {
    return {
      x: 188,
      y: 386,
      width: 130,
      height: 40
    };
  }

  function getPauseButtonRect() {
    return {
      x: canvas.width - 84,
      y: 32,
      width: 72,
      height: 24
    };
  }

  function getResumeButtonRect() {
    return {
      x: (canvas.width - 210) / 2,
      y: 220,
      width: 210,
      height: 44
    };
  }

  function getPauseMuteButtonRect() {
    return {
      x: (canvas.width - 210) / 2,
      y: 278,
      width: 210,
      height: 44
    };
  }

  function getPauseMenuButtonRect() {
    return {
      x: (canvas.width - 210) / 2,
      y: 336,
      width: 210,
      height: 44
    };
  }

  function getGameOverRetryButtonRect() {
    return {
      x: (canvas.width - 210) / 2,
      y: canvas.height / 2 + 72,
      width: 210,
      height: 44
    };
  }

  function getBackToMenuButtonRect() {
    return {
      x: (canvas.width - 210) / 2,
      y: canvas.height / 2 + 124,
      width: 210,
      height: 44
    };
  }

  function getDebugButtonRects() {
    const btnW = 82;
    const btnH = 26;
    const y = canvas.height - 32;
    const gap = 6;
    const startX = (canvas.width - (btnW * 4 + gap * 3)) / 2;
    return [
      { id: "god", label: isGodMode ? "無敵:ON" : "無敵:OFF", x: startX, y, width: btnW, height: btnH },
      { id: "waveSelect", label: "WAVE選択", x: startX + (btnW + gap), y, width: btnW, height: btnH },
      { id: "boss", label: wave < 5 ? "中ボスへ" : "ラスボスへ", x: startX + (btnW + gap) * 2, y, width: btnW, height: btnH },
      { id: "card", label: "カード選択", x: startX + (btnW + gap) * 3, y, width: btnW, height: btnH }
    ];
  }

  function getWaveSelectRects() {
    const cols = 2;
    const btnW = 136;
    const btnH = 42;
    const gapX = 16;
    const gapY = 12;
    const startX = (canvas.width - (btnW * cols + gapX)) / 2;
    const startY = 112;
    const rects = [];

    for (let w = 1; w <= MAX_WAVE; w++) {
      const idx = w - 1;
      const col = idx % cols;
      const row = Math.floor(idx / cols);
      let suffix = "";
      if (w === 5) suffix = " [MID]";
      if (w === 10) suffix = " [FINAL]";
      rects.push({
        wave: w,
        label: "WAVE " + w + suffix,
        x: startX + col * (btnW + gapX),
        y: startY + row * (btnH + gapY),
        width: btnW,
        height: btnH
      });
    }
    return rects;
  }

  function isPointInRect(x, y, rect) {
    return x >= rect.x && x <= rect.x + rect.width &&
           y >= rect.y && y <= rect.y + rect.height;
  }

  function spawnMidBoss() {
    boss = {
      type: "mid",
      name: "Δ-GUARDIAN",
      x: canvas.width / 2 - 46,
      y: 80,
      width: 92,
      height: 60,
      hp: 75,
      maxHp: 75,
      vx: 2.8,
      shootTimer: 0,
      patternCount: 0,
      subPatternTimer: 0
    };
  }

  function spawnFinalBoss() {
    boss = {
      type: "final",
      name: "Ω-OVERLORD",
      x: canvas.width / 2 - 64,
      y: 85,
      width: 128,
      height: 82,
      hp: 1100,
      maxHp: 1100,
      vx: 3.9,
      shootTimer: 0,
      patternCount: 0,
      subPatternTimer: 0,
      winderAngle: 0
    };
  }

  function enterWave(targetWave) {
    wave = Math.max(1, Math.min(MAX_WAVE, targetWave));
    killsInWave = 0;
    killsToNextWave = 10 + (wave - 1) * 5;
    bullets = [];
    enemies = [];
    enemyBullets = [];
    particles = [];
    shockwaves = [];
    screenShake = 0;
    boss = null;
    clearStickInput();
    player.invincibleTimer = PLAYER_INVINCIBLE_DURATION;
    gameState = "playing";

    if (wave === 5) {
      spawnMidBoss();
    } else if (wave === 10) {
      spawnFinalBoss();
    }
  }

  function handleDebugAction(actionId) {
    if (!isDebugMode) return;

    if (actionId === "god") {
      isGodMode = !isGodMode;
      if (isGodMode && player.hp <= 0) {
        player.hp = player.maxHp;
      }
    } else if (actionId === "waveSelect") {
      clearStickInput();
      gameState = "waveSelect";
    } else if (actionId === "boss") {
      if (wave < 5) {
        enterWave(5);
      } else {
        enterWave(10);
      }
    } else if (actionId === "card") {
      clearStickInput();
      generateChoices();
      gameState = "choosing";
    }
  }

  function resetGameStats() {
    clearStickInput();
    score = 0;
    wave = 1;
    killsInWave = 0;
    killsToNextWave = 10;
    frameCount = 0;
    boss = null;
    particles = [];
    shockwaves = [];
    screenShake = 0;
    isGodMode = isDebugMode ? true : false;
    player.hp = 3;
    player.maxHp = 3;
    player.speed = BASE_PLAYER_SPEED;
    player.invincibleTimer = 0;
    player.fireInterval = 16;
    player.bulletCount = 1;
    player.bulletSpeed = 9;
    player.bulletDamage = 1;
    player.bulletWidth = 6;
    player.bulletHeight = 14;
    player.x = canvas.width / 2 - 20;
    player.y = canvas.height - 75;
    bullets = [];
    enemies = [];
    enemyBullets = [];
  }

  function startNewGame() {
    confirmReset = false;
    resetGameStats();
    gameState = "playing";
    syncBgmPlayback();
  }

  function pauseGame() {
    clearStickInput();
    gameState = "paused";
  }

  function resumeGame() {
    clearStickInput();
    gameState = "playing";
    syncBgmPlayback();
  }

  function returnToMenu() {
    confirmReset = false;
    resetGameStats();
    highScore = loadHighScore();
    gameState = "menu";
    syncBgmPlayback();
  }

  function triggerGameOver() {
    clearStickInput();
    saveHighScoreIfNeeded();
    gameState = "gameover";
  }

  function triggerVictory() {
    clearStickInput();
    saveHighScoreIfNeeded();
    gameState = "victory";
  }

  function handleTap(clientX, clientY) {
    const { x, y } = getCanvasCoords(clientX, clientY);

    if (gameState === "menu") {
      // 隠しボタン：メニュー画面左上（0〜55, 0〜55）を3回連続タップでデバッグモード切替
      if (x >= 0 && x <= 55 && y >= 0 && y <= 55) {
        const now = Date.now();
        if (now - lastSecretTapTime < 800) {
          secretTapCount++;
        } else {
          secretTapCount = 1;
        }
        lastSecretTapTime = now;

        if (secretTapCount >= 3) {
          isDebugMode = !isDebugMode;
          isGodMode = isDebugMode;
          secretTapCount = 0;
        }
        return;
      }

      if (confirmReset) {
        if (isPointInRect(x, y, getConfirmYesButtonRect())) {
          resetHighScore();
        } else if (isPointInRect(x, y, getConfirmNoButtonRect())) {
          confirmReset = false;
        }
        return;
      }

      if (isPointInRect(x, y, getStartButtonRect())) {
        startNewGame();
      } else if (isPointInRect(x, y, getMuteButtonRect())) {
        toggleMute();
      } else if (isPointInRect(x, y, getResetButtonRect())) {
        ensureBgmPlaying();
        confirmReset = true;
      } else if (isPointInRect(x, y, getMenuRetryButtonRect())) {
        startNewGame();
      } else {
        ensureBgmPlaying();
      }
      return;
    }

    if (gameState === "paused") {
      if (isPointInRect(x, y, getResumeButtonRect())) {
        resumeGame();
      } else if (isPointInRect(x, y, getPauseMuteButtonRect())) {
        toggleMute();
      } else if (isPointInRect(x, y, getPauseMenuButtonRect())) {
        returnToMenu();
      }
      return;
    }

    if (gameState === "waveSelect") {
      if (!isDebugMode) {
        gameState = "playing";
        return;
      }
      const waveRects = getWaveSelectRects();
      for (const r of waveRects) {
        if (isPointInRect(x, y, r)) {
          enterWave(r.wave);
          break;
        }
      }
      return;
    }

    if (gameState === "gameover") {
      if (isPointInRect(x, y, getGameOverRetryButtonRect())) {
        startNewGame();
      } else if (isPointInRect(x, y, getBackToMenuButtonRect())) {
        returnToMenu();
      }
      return;
    }

    if (gameState === "victory") {
      if (isPointInRect(x, y, getBackToMenuButtonRect())) {
        returnToMenu();
      }
      return;
    }

    if (gameState === "choosing") {
      const cardRects = getCardRects();
      for (const r of cardRects) {
        if (isPointInRect(x, y, r)) {
          r.choice.apply();
          enterWave(wave + 1);
          break;
        }
      }
    }
  }

  canvas.addEventListener("touchstart", (e) => {
    e.preventDefault();
    if (e.touches.length === 0) return;

    if (gameState === "playing") {
      ensureBgmPlaying();
      const t = e.changedTouches[0];
      const pos = getCanvasCoords(t.clientX, t.clientY);

      if (isDebugMode) {
        const debugBtns = getDebugButtonRects();
        for (const btn of debugBtns) {
          if (isPointInRect(pos.x, pos.y, btn)) {
            handleDebugAction(btn.id);
            return;
          }
        }
      }

      if (isPointInRect(pos.x, pos.y, getPauseButtonRect())) {
        pauseGame();
        return;
      }
      if (!dragInput.active) {
        beginStickInput(t.clientX, t.clientY, t.identifier);
      }
    } else {
      const t = e.changedTouches[0];
      handleTap(t.clientX, t.clientY);
    }
  }, { passive: false });

  canvas.addEventListener("touchmove", (e) => {
    e.preventDefault();
    if (gameState !== "playing" || !dragInput.active) return;
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      if (t.identifier === dragInput.touchId) {
        moveStickInput(t.clientX, t.clientY);
        break;
      }
    }
  }, { passive: false });

  function handleTouchEndOrCancel(e) {
    e.preventDefault();
    if (!dragInput.active) return;
    for (let i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === dragInput.touchId) {
        clearStickInput();
        break;
      }
    }
  }

  canvas.addEventListener("touchend", handleTouchEndOrCancel, { passive: false });
  canvas.addEventListener("touchcancel", handleTouchEndOrCancel, { passive: false });

  let isMouseDown = false;
  canvas.addEventListener("mousedown", (e) => {
    if (gameState === "playing") {
      ensureBgmPlaying();
      const pos = getCanvasCoords(e.clientX, e.clientY);

      if (isDebugMode) {
        const debugBtns = getDebugButtonRects();
        for (const btn of debugBtns) {
          if (isPointInRect(pos.x, pos.y, btn)) {
            handleDebugAction(btn.id);
            return;
          }
        }
      }

      if (isPointInRect(pos.x, pos.y, getPauseButtonRect())) {
        pauseGame();
        return;
      }
      isMouseDown = true;
      beginStickInput(e.clientX, e.clientY, "mouse");
    } else {
      handleTap(e.clientX, e.clientY);
    }
  });

  window.addEventListener("mousemove", (e) => {
    if (isMouseDown && gameState === "playing") {
      moveStickInput(e.clientX, e.clientY);
    }
  });

  window.addEventListener("mouseup", () => {
    if (isMouseDown) {
      isMouseDown = false;
      clearStickInput();
    }
  });

  // PCテスト用のショートカットキー（I: 無敵切替, W: WAVE選択, B: ボスへ, C: カード選択）
  window.addEventListener("keydown", (e) => {
    if (!isDebugMode) return;
    if (gameState !== "playing" && gameState !== "choosing" && gameState !== "waveSelect") return;
    if (e.key === "i" || e.key === "I") {
      handleDebugAction("god");
    } else if (e.key === "w" || e.key === "W") {
      handleDebugAction("waveSelect");
    } else if (e.key === "b" || e.key === "B") {
      handleDebugAction("boss");
    } else if (e.key === "c" || e.key === "C") {
      handleDebugAction("card");
    }
  });

  function spawnEnemy() {
    const spawnChance = Math.min(0.085, 0.035 + wave * 0.006);
    if (Math.random() >= spawnChance) return;

    const availableTypes = ["normal"];
    if (wave >= 2) {
      availableTypes.push("tank");
    }
    if (wave >= 3) {
      availableTypes.push("dash");
    }
    if (wave >= 4) {
      availableTypes.push("zigzag");
    }
    if (wave >= 5) {
      availableTypes.push("weave");
    }
    if (wave >= 7) {
      availableTypes.push("erratic");
    }

    const type = availableTypes[Math.floor(Math.random() * availableTypes.length)];
    const waveBonusHp = Math.floor((wave - 1) / 2);

    if (type === "zigzag") {
      const startX = 40 + Math.random() * (canvas.width - 80);
      enemies.push({
        type: "zigzag",
        x: startX,
        baseX: startX,
        y: -38,
        width: 38,
        height: 38,
        hp: 1 + waveBonusHp,
        speed: 2.3 + wave * 0.18,
        phase: Math.random() * Math.PI * 2,
        scoreValue: 150
      });
    } else if (type === "dash") {
      enemies.push({
        type: "dash",
        x: Math.random() * (canvas.width - 32),
        y: -38,
        width: 32,
        height: 38,
        hp: 1,
        speed: 5.2 + wave * 0.35,
        scoreValue: 200
      });
    } else if (type === "tank") {
      enemies.push({
        type: "tank",
        x: Math.random() * (canvas.width - 52),
        y: -52,
        width: 52,
        height: 52,
        hp: 3 + waveBonusHp * 2,
        speed: 1.5 + wave * 0.12,
        scoreValue: 250
      });
    } else if (type === "weave") {
      const width = 40;
      const startFromLeft = Math.random() < 0.5;
      enemies.push({
        type: "weave",
        x: startFromLeft ? 4 : canvas.width - width - 4,
        y: -40,
        width: width,
        height: 38,
        hp: 2 + waveBonusHp,
        speed: 1.8 + wave * 0.14,
        vx: (startFromLeft ? 1 : -1) * (3.1 + wave * 0.18),
        scoreValue: 220
      });
    } else if (type === "erratic") {
      const width = 38;
      const initialDir = Math.random() < 0.5 ? -1 : 1;
      enemies.push({
        type: "erratic",
        x: 30 + Math.random() * (canvas.width - width - 60),
        y: -40,
        width: width,
        height: 38,
        hp: 2 + waveBonusHp,
        speed: 1.7 + wave * 0.14,
        vx: initialDir * (1.8 + Math.random() * 2.4),
        shiftTimer: 16 + Math.floor(Math.random() * 14),
        scoreValue: 280
      });
    } else {
      enemies.push({
        type: "normal",
        x: Math.random() * (canvas.width - 38),
        y: -38,
        width: 38,
        height: 38,
        hp: 1 + waveBonusHp,
        speed: 2.4 + Math.random() * 1.5 + wave * 0.22,
        scoreValue: 100
      });
    }
  }

  function drawEnemyIllustration(e) {
    if (drawSpriteIfReady(enemySprites[e.type], e.x, e.y, e.width, e.height)) {
      return;
    }

    const cx = e.x + e.width / 2;
    const cy = e.y + e.height / 2;

    if (e.type === "zigzag") {
      ctx.fillStyle = "#6a1b9a";
      ctx.beginPath();
      ctx.ellipse(cx, cy + 4, e.width * 0.48, e.height * 0.28, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#e040fb";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = "#ea80fc";
      ctx.beginPath();
      ctx.arc(cx, cy - 3, e.width * 0.24, Math.PI, 0);
      ctx.fill();

      ctx.fillStyle = "#00ffcc";
      ctx.fillRect(cx - 10, cy + 3, 4, 4);
      ctx.fillRect(cx - 2, cy + 5, 4, 4);
      ctx.fillRect(cx + 6, cy + 3, 4, 4);
    } else if (e.type === "dash") {
      ctx.fillStyle = "#ff5500";
      ctx.beginPath();
      ctx.moveTo(cx - 5, e.y + 4);
      ctx.lineTo(cx, e.y - 6 - (frameCount % 4));
      ctx.lineTo(cx + 5, e.y + 4);
      ctx.fill();

      ctx.fillStyle = "#ffaa00";
      ctx.beginPath();
      ctx.moveTo(cx, e.y + e.height);
      ctx.lineTo(e.x, e.y + 6);
      ctx.lineTo(cx, e.y + 14);
      ctx.lineTo(e.x + e.width, e.y + 6);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#fff59d";
      ctx.beginPath();
      ctx.moveTo(cx, e.y + e.height - 4);
      ctx.lineTo(cx - 5, e.y + 12);
      ctx.lineTo(cx + 5, e.y + 12);
      ctx.closePath();
      ctx.fill();
    } else if (e.type === "tank") {
      // 隕石（岩塊）フォールバック描画
      ctx.fillStyle = "#607d8b";
      ctx.beginPath();
      ctx.moveTo(cx - 4, e.y + 3);
      ctx.lineTo(e.x + e.width - 7, e.y + 8);
      ctx.lineTo(e.x + e.width - 3, e.y + e.height * 0.56);
      ctx.lineTo(e.x + e.width - 11, e.y + e.height - 4);
      ctx.lineTo(cx - 2, e.y + e.height - 2);
      ctx.lineTo(e.x + 6, e.y + e.height - 8);
      ctx.lineTo(e.x + 3, e.y + e.height * 0.45);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "#b0bec5";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = "#455a64";
      ctx.beginPath();
      ctx.arc(cx - 7, cy - 4, 6, 0, Math.PI * 2);
      ctx.arc(cx + 8, cy + 6, 5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#90a4ae";
      ctx.beginPath();
      ctx.arc(cx - 3, cy + 9, 3.5, 0, Math.PI * 2);
      ctx.fill();
    } else if (e.type === "weave") {
      // 画面端から端をジグザグに折り返す高速グライダー型
      ctx.fillStyle = "#00695c";
      ctx.beginPath();
      ctx.moveTo(cx, e.y + e.height);
      ctx.lineTo(e.x + e.width, e.y + 12);
      ctx.lineTo(cx + 8, e.y + 4);
      ctx.lineTo(cx - 8, e.y + 4);
      ctx.lineTo(e.x, e.y + 12);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = "#00e5ff";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = "#1de9b6";
      ctx.beginPath();
      ctx.moveTo(cx, e.y + 8);
      ctx.lineTo(cx + 9, e.y + 22);
      ctx.lineTo(cx, e.y + 28);
      ctx.lineTo(cx - 9, e.y + 22);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#e0f7fa";
      ctx.fillRect(cx - 2, e.y + 14, 4, 6);
    } else if (e.type === "erratic") {
      // 不規則に動きを変えるアノマリーコア型フォールバック描画
      ctx.fillStyle = "#4a148c";
      ctx.beginPath();
      ctx.moveTo(cx, e.y + 2);
      ctx.lineTo(e.x + e.width - 2, cy);
      ctx.lineTo(cx, e.y + e.height - 2);
      ctx.lineTo(e.x + 2, cy);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "#ff4081";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = "#ffea00";
      ctx.beginPath();
      ctx.arc(cx, cy, 6, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = "#c62828";
      ctx.beginPath();
      ctx.moveTo(cx, e.y + e.height);
      ctx.lineTo(e.x, e.y + 10);
      ctx.lineTo(e.x + 8, e.y + 4);
      ctx.lineTo(e.x + e.width - 8, e.y + 4);
      ctx.lineTo(e.x + e.width, e.y + 10);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = "#ff8a80";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.fillStyle = "#ffeb3b";
      ctx.beginPath();
      ctx.ellipse(cx, cy + 2, 5, 8, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function updateAndDrawEnemy(e) {
    e.y += e.speed;

    if (e.type === "zigzag") {
      e.phase += 0.08;
      e.x = e.baseX + Math.sin(e.phase) * 45;
      if (e.x < 0) e.x = 0;
      if (e.x > canvas.width - e.width) e.x = canvas.width - e.width;
    } else if (e.type === "weave") {
      e.x += e.vx;
      if (e.x <= 2) {
        e.x = 2;
        e.vx = Math.abs(e.vx);
      } else if (e.x >= canvas.width - e.width - 2) {
        e.x = canvas.width - e.width - 2;
        e.vx = -Math.abs(e.vx);
      }
    } else if (e.type === "erratic") {
      e.shiftTimer--;
      if (e.shiftTimer <= 0) {
        e.shiftTimer = 20 + Math.floor(Math.random() * 20);
        const roll = Math.random();
        if (roll < 0.22) {
          e.vx = 0;
        } else {
          const dir = Math.random() < 0.5 ? -1 : 1;
          e.vx = dir * (1.5 + Math.random() * 3.3);
        }
      }
      e.x += e.vx;
      if (e.x <= 2) {
        e.x = 2;
        e.vx = Math.abs(e.vx || 2.5);
      } else if (e.x >= canvas.width - e.width - 2) {
        e.x = canvas.width - e.width - 2;
        e.vx = -Math.abs(e.vx || 2.5);
      }
    }

    drawEnemyIllustration(e);
  }

  function isColliding(a, b) {
    return a.x < b.x + b.width &&
           a.x + a.width > b.x &&
           a.y < b.y + b.height &&
           a.y + a.height > b.y;
  }

  function shootBullets() {
    const centerX = player.x + player.width / 2 - player.bulletWidth / 2;
    const count = player.bulletCount;
    const spreadStep = 0.22;

    for (let i = 0; i < count; i++) {
      const offsetIndex = i - (count - 1) / 2;
      const vx = offsetIndex * spreadStep * player.bulletSpeed * 0.35;
      bullets.push({
        x: centerX,
        y: player.y,
        width: player.bulletWidth,
        height: player.bulletHeight,
        vx: vx,
        vy: player.bulletSpeed,
        damage: player.bulletDamage
      });
    }
  }

  function updateAndDrawBoss() {
    if (!boss) return;

    boss.x += boss.vx;
    if (boss.x <= 10 || boss.x + boss.width >= canvas.width - 10) {
      boss.vx *= -1;
    }

    const cx = boss.x + boss.width / 2;
    const cy = boss.y + boss.height / 2;

    boss.shootTimer++;
    boss.subPatternTimer++;

    if (boss.type === "mid") {
      if (boss.subPatternTimer >= 360) {
        boss.subPatternTimer = 0;
      }

      const isSpreadMode = (boss.subPatternTimer >= 180 && boss.subPatternTimer < 240);

      if (isSpreadMode) {
        if (boss.shootTimer >= 10) {
          boss.shootTimer = 0;
          const bulletCount = 16;
          const speed = 3.2;
          for (let i = 0; i < bulletCount; i++) {
            const angle = (Math.PI * 2 * i) / bulletCount + (boss.subPatternTimer * 0.05);
            enemyBullets.push({
              x: cx - 6,
              y: cy - 6,
              width: 12,
              height: 12,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed,
              damage: 1,
              color: "#00ffff"
            });
          }
        }
      } else {
        if (boss.shootTimer >= 42) {
          boss.shootTimer = 0;
          boss.patternCount++;
          const originX = cx - 4.5;
          const originY = boss.y + boss.height;
          const speeds = (boss.patternCount % 3 === 0)
            ? [
                { vx: -3.2, vy: 4.5 },
                { vx: -1.6, vy: 5.2 },
                { vx: 0, vy: 5.8 },
                { vx: 1.6, vy: 5.2 },
                { vx: 3.2, vy: 4.5 }
              ]
            : [
                { vx: -2.0, vy: 5.0 },
                { vx: 0, vy: 5.6 },
                { vx: 2.0, vy: 5.0 }
              ];
          for (const s of speeds) {
            enemyBullets.push({
              x: originX,
              y: originY,
              width: 9,
              height: 9,
              vx: s.vx,
              vy: s.vy,
              damage: 1,
              color: "#ff55aa"
            });
          }
        }
      }

      if (!drawSpriteIfReady(enemySprites.midBoss, boss.x, boss.y, boss.width, boss.height)) {
        ctx.fillStyle = "#4a148c";
        ctx.beginPath();
        ctx.moveTo(boss.x, boss.y + 12);
        ctx.lineTo(boss.x + boss.width, boss.y + 12);
        ctx.lineTo(boss.x + boss.width - 14, boss.y + boss.height - 6);
        ctx.lineTo(cx, boss.y + boss.height + 6);
        ctx.lineTo(boss.x + 14, boss.y + boss.height - 6);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = "#e040fb";
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.fillStyle = "#7b1fa2";
        ctx.fillRect(boss.x + 8, boss.y + 20, 12, 34);
        ctx.fillRect(boss.x + boss.width - 20, boss.y + 20, 12, 34);

        ctx.fillStyle = isSpreadMode ? "#00ffff" : "#00ffcc";
        ctx.beginPath();
        ctx.arc(cx, boss.y + 28, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(cx - 3, boss.y + 25, 4, 0, Math.PI * 2);
        ctx.fill();
      }

      const barWidth = 140;
      const barX = (canvas.width - barWidth) / 2;
      ctx.fillStyle = "#333";
      ctx.fillRect(barX, boss.y - 16, barWidth, 8);
      ctx.fillStyle = isSpreadMode ? "#00ffff" : "#c77dff";
      ctx.fillRect(barX, boss.y - 16, barWidth * Math.max(0, boss.hp / boss.maxHp), 8);

      ctx.fillStyle = isSpreadMode ? "#00ffff" : "#e0aaff";
      ctx.font = "bold 12px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(boss.name + (isSpreadMode ? " [RADIAL BURST]" : "") + "  HP: " + Math.max(0, boss.hp) + " / " + boss.maxHp, canvas.width / 2, boss.y - 22);
    } else {
      boss.winderAngle += 0.045;

      if (boss.subPatternTimer >= 480) {
        boss.subPatternTimer = 0;
      }

      const mode = Math.floor(boss.subPatternTimer / 120);

      if (mode === 0) {
        if (boss.shootTimer >= 26) {
          boss.shootTimer = 0;
          boss.patternCount++;
          const originX = cx - 6;
          const originY = boss.y + boss.height;
          const speeds = (boss.patternCount % 3 === 0)
            ? [{ vx: -4.2, vy: 6.2 }, { vx: -2.2, vy: 7.0 }, { vx: 0, vy: 7.8 }, { vx: 2.2, vy: 7.0 }, { vx: 4.2, vy: 6.2 }]
            : [{ vx: -2.8, vy: 6.8 }, { vx: 0, vy: 7.5 }, { vx: 2.8, vy: 6.8 }];
          for (const s of speeds) {
            enemyBullets.push({ x: originX, y: originY, width: 12, height: 12, vx: s.vx, vy: s.vy, damage: 2, color: "#ff2a55" });
          }
        }
      } else if (mode === 1) {
        if (boss.shootTimer >= 6) {
          boss.shootTimer = 0;
          const speed = 5.5;
          for (let i = 0; i < 2; i++) {
            const angle = boss.winderAngle + i * Math.PI;
            enemyBullets.push({
              x: cx - 6, y: cy - 6, width: 10, height: 10,
              vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed + 1.2,
              damage: 2, color: i === 0 ? "#ff1744" : "#00e5ff"
            });
          }
        }
      } else if (mode === 2) {
        if (boss.shootTimer >= 18) {
          boss.shootTimer = 0;
          const targetX = player.x + player.width / 2;
          const targetY = player.y + player.height / 2;
          const angle = Math.atan2(targetY - cy, targetX - cx);
          const speed = 8.5;
          enemyBullets.push({
            x: cx - 6, y: cy - 6, width: 14, height: 14,
            vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
            damage: 2, color: "#ffff00"
          });
        }
      } else if (mode === 3) {
        if (boss.shootTimer % 40 === 0 && boss.shootTimer < 160) {
          for (let side = -1; side <= 1; side += 2) {
            enemyBullets.push({
              x: cx + side * 40, y: cy, width: 12, height: 12,
              vx: side * 3.0, vy: -5.0,
              damage: 2, color: "#9c27b0",
              isHoming: true
            });
          }
        }
      }

      for (const eb of enemyBullets) {
        if (eb.isHoming) {
          const targetX = player.x + player.width / 2;
          const targetY = player.y + player.height / 2;
          const angle = Math.atan2(targetY - eb.y, targetX - eb.x);
          const homingSpeed = 5.8;
          eb.vx = Math.cos(angle) * homingSpeed;
          eb.vy = Math.sin(angle) * homingSpeed;
        }
      }

      if (!drawSpriteIfReady(enemySprites.finalBoss, boss.x, boss.y, boss.width, boss.height)) {
        ctx.fillStyle = "#ff6f00";
        ctx.beginPath();
        ctx.moveTo(boss.x + 18, boss.y + 14);
        ctx.lineTo(boss.x + 2, boss.y - 12);
        ctx.lineTo(boss.x + 34, boss.y + 14);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(boss.x + boss.width - 18, boss.y + 14);
        ctx.lineTo(boss.x + boss.width - 2, boss.y - 12);
        ctx.lineTo(boss.x + boss.width - 34, boss.y + 14);
        ctx.fill();

        ctx.fillStyle = "#880e4f";
        ctx.beginPath();
        ctx.moveTo(boss.x + 12, boss.y + 10);
        ctx.lineTo(boss.x + boss.width - 12, boss.y + 10);
        ctx.lineTo(boss.x + boss.width, boss.y + 38);
        ctx.lineTo(boss.x + boss.width - 22, boss.y + boss.height);
        ctx.lineTo(boss.x + 22, boss.y + boss.height);
        ctx.lineTo(boss.x, boss.y + 38);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = "#ff1744";
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.fillStyle = "#ffd600";
        ctx.beginPath();
        ctx.moveTo(cx - 34, boss.y + 28);
        ctx.lineTo(cx - 10, boss.y + 36);
        ctx.lineTo(cx - 30, boss.y + 42);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(cx + 34, boss.y + 28);
        ctx.lineTo(cx + 10, boss.y + 36);
        ctx.lineTo(cx + 30, boss.y + 42);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "#eceff1";
        for (let k = -2; k <= 2; k++) {
          ctx.beginPath();
          ctx.moveTo(cx + k * 14 - 4, boss.y + boss.height - 8);
          ctx.lineTo(cx + k * 14, boss.y + boss.height + 5);
          ctx.lineTo(cx + k * 14 + 4, boss.y + boss.height - 8);
          ctx.fill();
        }
      }

      const barWidth = 170;
      const barX = (canvas.width - barWidth) / 2;
      ctx.fillStyle = "#333";
      ctx.fillRect(barX, boss.y - 24, barWidth, 8);
      ctx.fillStyle = "#ff4466";
      ctx.fillRect(barX, boss.y - 24, barWidth * Math.max(0, boss.hp / boss.maxHp), 8);

      const modeNames = ["NORMAL BARRAGE", "DOUBLE WINDER", "SNIPER RUSH", "HOMING SWARM"];
      ctx.fillStyle = "#ff7799";
      ctx.font = "bold 12px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(boss.name + " [" + modeNames[mode] + "]  HP: " + Math.max(0, boss.hp) + " / " + boss.maxHp, canvas.width / 2, boss.y - 30);
    }

    for (let j = bullets.length - 1; j >= 0; j--) {
      if (isColliding(bullets[j], boss)) {
        boss.hp -= bullets[j].damage;
        bullets.splice(j, 1);

        if (boss.type === "mid") {
          score += 30;
          if (boss.hp <= 0) {
            spawnExplosion(boss.x + boss.width / 2, boss.y + boss.height / 2, "mid", 2.1);
            score += 1000;
            boss = null;
            enemyBullets = [];
            clearStickInput();
            generateChoices();
            gameState = "choosing";
            return;
          }
        } else if (boss.type === "final") {
          score += 50;
          if (boss.hp <= 0) {
            spawnExplosion(boss.x + boss.width / 2, boss.y + boss.height / 2, "final", 2.8);
            score += 3000;
            boss = null;
            enemyBullets = [];
            triggerVictory();
            return;
          }
        }
      }
    }

    const playerHitbox = getPlayerHitbox();
    if (boss && player.invincibleTimer === 0 && isColliding(playerHitbox, boss)) {
      damagePlayer(boss.type === "final" ? 2 : 1);
    }
  }

    ctx.save();

    ctx.fillRect(canvas.width / 2 - 52, 4, 104, 16);

    ctx.restore();
  }

    ctx.fillStyle = "#00ffcc";
    ctx.font = "bold 16px sans-serif";
    ctx.fillText("Ω-OVERLORD 撃破おめでとう！", canvas.width / 2, canvas.height / 2 - 32);

    ctx.fillStyle = "white";
    ctx.font = "18px sans-serif";
    ctx.fillText("FINAL SCORE: " + score, canvas.width / 2, canvas.height / 2 + 6);

    ctx.fillStyle = "#ffd700";
    ctx.font = "bold 16px sans-serif";
    ctx.fillText("HIGH SCORE: " + highScore, canvas.width / 2, canvas.height / 2 + 38);

    drawBackToMenuButton("#ffd700", "#ffd700");
    drawDebugOverlay();
  }

  function drawPlayingScene() {
    updateAndDrawStarfield(false);
    drawPlayerIllustration();

    ctx.fillStyle = "#ffff00";
    for (let i = 0; i < bullets.length; i++) {
      const b = bullets[i];
      ctx.fillRect(b.x, b.y, b.width, b.height);
    }

    if (wave === 5 || wave === 10) {
      if (boss) {
        drawEnemyIllustration(boss);
      }
    } else {
      for (let i = 0; i < enemies.length; i++) {
        drawEnemyIllustration(enemies[i]);
      }
    }

    for (let i = 0; i < enemyBullets.length; i++) {
      const eb = enemyBullets[i];
      ctx.fillStyle = eb.color || "#ff55aa";
      ctx.fillRect(eb.x, eb.y, eb.width, eb.height);
    }

    updateAndDrawEffects(false);
    drawHudAndPauseButton();
  }

  function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (gameState === "menu") {
      drawMenuScreen();
    } else if (gameState === "paused") {
      drawPlayingScene();
      drawPausedScreen();
    } else if (gameState === "waveSelect") {
      drawWaveSelectScreen();
    } else if (gameState === "playing") {
      frameCount++;
      if (player.invincibleTimer > 0) player.invincibleTimer--;

      updateAndDrawStarfield(true, 1.0);

      ctx.save();
      if (screenShake > 0) {
        const shakeX = (Math.random() - 0.5) * screenShake * 1.4;
        const shakeY = (Math.random() - 0.5) * screenShake * 1.4;
        ctx.translate(shakeX, shakeY);
        screenShake = Math.max(0, screenShake - 0.5);
      }

      updatePlayerMovement();

      if (frameCount % player.fireInterval === 0) {
        shootBullets();
      }

      drawPlayerIllustration();

      ctx.fillStyle = "#ffff00";
      for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.x += b.vx;
        b.y -= b.vy;
        ctx.fillRect(b.x, b.y, b.width, b.height);
        if (b.y < -20 || b.x < -20 || b.x > canvas.width + 20) {
          bullets.splice(i, 1);
        }
      }

      if (wave === 5 || wave === 10) {
        updateAndDrawBoss();
      } else {
        spawnEnemy();
        const playerHitbox = getPlayerHitbox();
        for (let i = enemies.length - 1; i >= 0; i--) {
          let e = enemies[i];
          updateAndDrawEnemy(e);

          if (!isGodMode && player.invincibleTimer === 0 && isColliding(playerHitbox, e)) {
            spawnExplosion(e.x + e.width / 2, e.y + e.height / 2, e.type, e.type === "tank" ? 1.3 : 1.0);
            enemies.splice(i, 1);
            if (damagePlayer(1)) {
              break;
            }
            continue;
          }

          let destroyed = false;
          for (let j = bullets.length - 1; j >= 0; j--) {
            if (isColliding(bullets[j], e)) {
              e.hp -= bullets[j].damage;
              bullets.splice(j, 1);
              if (e.hp <= 0) {
                spawnExplosion(e.x + e.width / 2, e.y + e.height / 2, e.type, e.type === "tank" ? 1.35 : 1.0);
                enemies.splice(i, 1);
                score += e.scoreValue;
                killsInWave++;
                destroyed = true;
              }
              break;
            }
          }
          if (destroyed) {
            if (killsInWave >= killsToNextWave) {
              clearStickInput();
              generateChoices();
              gameState = "choosing";
              break;
            }
            continue;
          }

          if (e.y > canvas.height) {
            enemies.splice(i, 1);
          }
        }
      }

      const playerHitboxForBullets = getPlayerHitbox();
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        let eb = enemyBullets[i];
        eb.x += eb.vx;
        eb.y += eb.vy;
        ctx.fillStyle = eb.color || "#ff55aa";
        ctx.fillRect(eb.x, eb.y, eb.width, eb.height);

        if (!isGodMode && player.invincibleTimer === 0 && isColliding(playerHitboxForBullets, eb)) {
          const hitDamage = eb.damage || 1;
          enemyBullets.splice(i, 1);
          if (damagePlayer(hitDamage)) {
            break;
          }
          continue;
        }

        if (eb.y > canvas.height + 20 || eb.x < -20 || eb.x > canvas.width + 20) {
          enemyBullets.splice(i, 1);
        }
      }

      updateAndDrawEffects(true);
      ctx.restore();
      drawHudAndPauseButton();
    } else if (gameState === "choosing") {
      drawChoosingScreen();
    } else if (gameState === "gameover") {
      drawGameOverScreen();
    } else if (gameState === "victory") {
      drawVictoryScreen();
    }

    requestAnimationFrame(loop);
  }

  loop();
</script>
</body>
</html>
