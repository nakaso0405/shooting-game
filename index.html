<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ローグライク・シューティング</title>
<style>
  body {
    background-color: #0d0d12;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    overflow: hidden;
    touch-action: none;
    font-family: sans-serif;
  }
  canvas {
    background-color: #05050a;
    border: 2px solid #00ffcc;
    max-width: 95vw;
    max-height: 82vh;
    box-shadow: 0 0 20px rgba(0, 255, 204, 0.2);
  }
  .desc {
    margin-top: 10px;
    font-size: 14px;
    color: #8899aa;
    text-align: center;
  }
</style>
</head>
<body>

  <canvas id="gameCanvas" width="360" height="540"></canvas>
  <div class="desc">タッチ＆スライド / 矢印キー・WASD 移動<br>Space:ボム / V:バリア / P:一時停止</div>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  // ゲーム定数
  const HIGH_SCORE_KEY = "roguelike_shooting_highscore_v2";
  const PLAYER_INVINCIBLE_DURATION = 90;
  const BARRIER_ITEM_DURATION = 300;
  const BASE_PLAYER_SPEED = 3.0;
  const MAX_WAVE = 10;
  const MAX_BOMBS = 3;
  const MAX_BARRIERS = 3;

  // ゲーム状態管理
  let gameState = "menu"; // "menu", "playing", "paused", "choosing", "gameover", "victory"
  let score = 0;
  let highScore = 0;
  let wave = 1;
  let killsInWave = 0;
  let killsToNextWave = 10;
  let frameCount = 0;
  let screenShake = 0;

  // ハイスコア読み込み
  try {
    const saved = localStorage.getItem(HIGH_SCORE_KEY);
    highScore = saved ? parseInt(saved, 10) : 0;
  } catch (e) {
    highScore = 0;
  }

  function saveHighScore() {
    if (score > highScore) {
      highScore = score;
      try {
        localStorage.setItem(HIGH_SCORE_KEY, String(highScore));
      } catch (e) {}
    }
  }

  // プレイヤーデータ
  const player = {
    x: canvas.width / 2 - 20,
    y: canvas.height - 80,
    width: 40,
    height: 40,
    speed: BASE_PLAYER_SPEED,
    hp: 3,
    maxHp: 3,
    invincibleTimer: 0,
    barrierTimer: 0,
    barriers: 1,
    bombs: 1,
    fireInterval: 14,
    bulletCount: 1,
    bulletSpeed: 8,
    bulletDamage: 1,
    petLevel: 0
  };

  function getPlayerHitbox() {
    return {
      x: player.x + 12,
      y: player.y + 12,
      width: 16,
      height: 16
    };
  }

  // エンティティ配列
  let bullets = [];
  let enemies = [];
  let enemyBullets = [];
  let items = [];
  let choices = [];
  let boss = null;
  let particles = [];
  let shockwaves = [];

  // 安全な画像読み込み関数（失敗してもエラーで止まらない）
  function safeLoadImage(src) {
    const img = new Image();
    img.src = src;
    return img;
  }

  const spritePlayer = safeLoadImage("./player.png");
  const spriteEnemyNormal = safeLoadImage("./enemy_normal.png");
  const spriteEnemyBoss = safeLoadImage("./boss_final.png");

  function drawSpriteSafe(img, x, y, w, h, fallbackDraw) {
    if (img && img.complete && img.naturalWidth > 0) {
      try {
        ctx.drawImage(img, x, y, w, h);
        return;
      } catch (e) {}
    }
    fallbackDraw();
  }

  // パーティクル・エフェクト生成
  function spawnExplosion(x, y, color = "#ffaa00", count = 15) {
    for (let i = 0; i < count; i++) {
      const angle = Math.random() * Math.PI * 2;
      const speed = 1 + Math.random() * 4;
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        size: 2 + Math.random() * 3,
        color,
        life: 20 + Math.random() * 15,
        maxLife: 35
      });
    }
    shockwaves.push({ x, y, r: 5, maxR: 30, color, life: 15 });
  }

  // 当たり判定
  function isColliding(a, b) {
    return a.x < b.x + b.width &&
           a.x + a.width > b.x &&
           a.y < b.y + b.height &&
           a.y + a.height > b.y;
  }

  // プレイヤーの描画（フォールバック付き）
  function drawPlayer() {
    if (player.invincibleTimer > 0 && Math.floor(player.invincibleTimer / 4) % 2 === 0) {
      return; // 点滅処理
    }

    ctx.save();
    if (player.barrierTimer > 0) {
      ctx.strokeStyle = "#00ffff";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(player.x + player.width/2, player.y + player.height/2, 28, 0, Math.PI * 2);
      ctx.stroke();
    }

    drawSpriteSafe(spritePlayer, player.x, player.y, player.width, player.height, () => {
      // 三角形の自機を描画
      ctx.fillStyle = "#00ffcc";
      ctx.beginPath();
      ctx.moveTo(player.x + player.width/2, player.y);
      ctx.lineTo(player.x + player.width, player.y + player.height);
      ctx.lineTo(player.x, player.y + player.height);
      ctx.closePath();
      ctx.fill();

      // コア
      ctx.fillStyle = "#ff0055";
      ctx.fillRect(player.x + player.width/2 - 4, player.y + 20, 8, 8);
    });
    ctx.restore();
  }

  // 敵の描画
  function drawEnemy(e) {
    ctx.save();
    if (e.type === "boss") {
      drawSpriteSafe(spriteEnemyBoss, e.x, e.y, e.width, e.height, () => {
        ctx.fillStyle = "#ff2244";
        ctx.fillRect(e.x, e.y, e.width, e.height);
        ctx.fillStyle = "#ffff00";
        ctx.fillRect(e.x + 10, e.y + 10, e.width - 20, e.height - 20);
      });
    } else {
      drawSpriteSafe(spriteEnemyNormal, e.x, e.y, e.width, e.height, () => {
        ctx.fillStyle = e.type === "fast" ? "#ff8800" : "#ff3300";
        ctx.beginPath();
        ctx.arc(e.x + e.width/2, e.y + e.height/2, e.width/2, 0, Math.PI * 2);
        ctx.fill();
      });
    }
    ctx.restore();
  }

  // ゲーム内要素の更新と描画
  function updateGameLogic() {
    frameCount++;

    // タイマー減少
    if (player.invincibleTimer > 0) player.invincibleTimer--;
    if (player.barrierTimer > 0) player.barrierTimer--;

    // プレイヤー移動（キーボードとマウス/タッチの統合）
    player.x += moveVector.x * player.speed;
    player.y += moveVector.y * player.speed;

    // 画面外制限
    player.x = Math.max(0, Math.min(canvas.width - player.width, player.x));
    player.y = Math.max(50, Math.min(canvas.height - player.height, player.y));

    // 自弾発射
    if (frameCount % player.fireInterval === 0) {
      const cx = player.x + player.width / 2;
      for (let i = 0; i < player.bulletCount; i++) {
        const offset = (i - (player.bulletCount - 1) / 2) * 10;
        bullets.push({
          x: cx - 3 + offset,
          y: player.y,
          width: 6,
          height: 14,
          vy: -player.bulletSpeed,
          damage: player.bulletDamage
        });
      }
    }

    // 自球の更新
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      b.y += b.vy;
      if (b.y < -20) {
        bullets.splice(i, 1);
      }
    }

    // 敵の生成
    if (wave < 10 && enemies.length < 5 && Math.random() < 0.05) {
      const isFast = Math.random() < 0.3;
      enemies.push({
        x: Math.random() * (canvas.width - 32),
        y: -40,
        width: 32,
        height: 32,
        hp: isFast ? 1 : 3,
        speed: isFast ? 4 : 1.5,
        type: isFast ? "fast" : "normal",
        scoreValue: isFast ? 200 : 100
      });
    } else if (wave === 10 && !boss) {
      boss = {
        x: canvas.width / 2 - 64,
        y: 60,
        width: 128,
        height: 128,
        hp: 150,
        maxHp: 150,
        speed: 2,
        dir: 1,
        type: "boss"
      };
    }

    // ボスの更新
    if (boss) {
      boss.x += boss.speed * boss.dir;
      if (boss.x < 10 || boss.x > canvas.width - boss.width - 10) boss.dir *= -1;

      if (Math.random() < 0.08) {
        const cx = boss.x + boss.width/2;
        enemyBullets.push({ x: cx - 4, y: boss.y + boss.height, width: 8, height: 8, vx: (Math.random()-0.5)*4, vy: 3 });
      }
    }

    // 敵の更新
    const playerHitbox = getPlayerHitbox();
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      e.y += e.speed;

      // プレイヤーとの衝突判定
      if (player.barrierTimer <= 0 && player.invincibleTimer <= 0) {
        if (isColliding(playerHitbox, e)) {
          spawnExplosion(player.x + player.width/2, player.y + player.height/2, "#ff0000", 20);
          player.hp--;
          player.invincibleTimer = PLAYER_INVINCIBLE_DURATION;
          enemies.splice(i, 1);
          if (player.hp <= 0) {
            gameState = "gameover";
            saveHighScore();
          }
          continue;
        }
      }

      // 弾との衝突判定
      for (let j = bullets.length - 1; j >= 0; j--) {
        const b = bullets[j];
        if (isColliding(b, e)) {
          spawnExplosion(b.x, b.y, "#ffff00", 8);
          e.hp -= b.damage;
          bullets.splice(j, 1);
          if (e.hp <= 0) {
            score += e.scoreValue;
            killsInWave++;
            spawnExplosion(e.x + e.width/2, e.y + e.height/2, "#ffaa00", 25);
            enemies.splice(i, 1);

            // アイテムドロップ判定
            if (Math.random() < 0.2) {
              items.push({
                x: e.x + e.width/2 - 12,
                y: e.y + e.height/2 - 12,
                width: 24,
                height: 24,
                type: Math.random() < 0.5 ? "heal" : "barrier"
              });
            }
            break;
          }
        }
      }

      if (e.y > canvas.height) {
        enemies.splice(i, 1);
      }
    }

    // ウェーブ進行チェック
    if (wave < 10 && killsInWave >= killsToNextWave) {
      gameState = "choosing";
      generateChoices();
    } else if (wave === 10 && boss && boss.hp <= 0) {
      gameState = "victory";
      saveHighScore();
    }

    // 敵弾の更新
    for (let i = enemyBullets.length - 1; i >= 0; i--) {
      const eb = enemyBullets[i];
      eb.x += eb.vx;
      eb.y += eb.vy;

      if (player.barrierTimer <= 0 && player.invincibleTimer <= 0) {
        if (isColliding(playerHitbox, eb)) {
          spawnExplosion(player.x + player.width/2, player.y + player.height/2, "#ff0000", 15);
          player.hp--;
          player.invincibleTimer = PLAYER_INVINCIBLE_DURATION;
          enemyBullets.splice(i, 1);
          if (player.hp <= 0) {
            gameState = "gameover";
            saveHighScore();
          }
          continue;
        }
      }

      if (eb.y > canvas.height + 20) enemyBullets.splice(i, 1);
    }

    // アイテムの更新
    for (let i = items.length - 1; i >= 0; i--) {
      const item = items[i];
      item.y += 1.5;
      if (isColliding(playerHitbox, item)) {
        if (item.type === "heal") player.hp = Math.min(player.maxHp, player.hp + 1);
        if (item.type === "barrier") player.barrierTimer = BARRIER_ITEM_DURATION;
        items.splice(i, 1);
        continue;
      }
      if (item.y > canvas.height) items.splice(i, 1);
    }

    // パーティクルの更新
    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      p.life++;
      if (p.life >= p.maxLife) particles.splice(i, 1);
    }
  }

  // 描画処理
  function draw() {
    ctx.fillStyle = "#05050a";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    if (gameState === "menu") {
      ctx.fillStyle = "#00ffcc";
      ctx.font = "bold 30px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("ROGUELIKE SHOOTING", canvas.width/2, 200);

      ctx.fillStyle = "#ffffff";
      ctx.font = "20px sans-serif";
      ctx.fillText("Tap to Start", canvas.width/2, 320);
      ctx.fillText("High Score: " + highScore, canvas.width/2, 360);

    } else if (gameState === "playing" || gameState === "paused") {
      drawPlayer();

      // 弾の描画
      ctx.fillStyle = "#ffff00";
      for (const b of bullets) ctx.fillRect(b.x, b.y, b.width, b.height);

      // 敵の描画
      for (const e of enemies) drawEnemy(e);
      if (boss) drawEnemy(boss);

      // 敵弾の描画
      ctx.fillStyle = "#ff0055";
      for (const eb of enemyBullets) ctx.fillRect(eb.x, eb.y, eb.width, eb.height);

      // アイテムの描画
      for (const it of items) {
        ctx.fillStyle = it.type === "heal" ? "#ff00ff" : "#00ffff";
        ctx.fillRect(it.x, it.y, it.width, it.height);
      }

      // パーティクル描画
      for (const p of particles) {
        ctx.fillStyle = p.color;
        ctx.fillRect(p.x, p.y, p.size, p.size);
      }

      // UI描画
      ctx.fillStyle = "#ffffff";
      ctx.font = "16px sans-serif";
      ctx.textAlign = "left";
      ctx.fillText("Score: " + score, 10, 30);
      ctx.fillText("HP: " + "♥".repeat(player.hp), 10, 52);
      ctx.fillText("Wave: " + wave, canvas.width - 100, 30);

      if (player.barrierTimer > 0) {
        ctx.fillStyle = "#00ffff";
        ctx.fillText("BARRIER ACTIVE", 10, 80);
      }

      if (gameState === "paused") {
        ctx.fillStyle = "rgba(0,0,0,0.5)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#ffffff";
        ctx.font = "30px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText("PAUSED", canvas.width/2, canvas.height/2);
      }

    } else if (gameState === "choosing") {
      ctx.fillStyle = "rgba(0,0,0,0.8)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = "#00ffcc";
      ctx.font = "24px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("WAVE CLEAR!", canvas.width/2, 100);

      for (let i = 0; i < choices.length; i++) {
        const c = choices[i];
        const y = 200 + i * 80;
        ctx.fillStyle = "#112233";
        ctx.fillRect(50, y, canvas.width - 100, 60);
        ctx.fillStyle = "#ffffff";
        ctx.font = "18px sans-serif";
        ctx.fillText(c.title, canvas.width/2, y + 25);
        ctx.font = "14px sans-serif";
        ctx.fillStyle = "#aaaaaa";
        ctx.fillText(c.desc, canvas.width/2, y + 45);
      }
    } else if (gameState === "gameover" || gameState === "victory") {
      ctx.fillStyle = "rgba(0,0,0,0.85)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = gameState === "victory" ? "#00ffcc" : "#ff3333";
      ctx.font = "bold 36px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(gameState === "victory" ? "VICTORY!" : "GAME OVER", canvas.width/2, 220);

      ctx.fillStyle = "#ffffff";
      ctx.font = "20px sans-serif";
      ctx.fillText("Final Score: " + score, canvas.width/2, 280);

      ctx.fillStyle = "#aaaaaa";
      ctx.font = "16px sans-serif";
      ctx.fillText("Tap to Restart", canvas.width/2, 360);
    }
  }

  // 強化選択肢の生成
  function generateChoices() {
    choices = [
      { title: "パワーアップ", desc: "弾の攻撃力がアップ", apply: () => { player.bulletDamage++; } },
      { title: "連射強化", desc: "攻撃速度がアップ", apply: () => { player.fireInterval = Math.max(6, player.fireInterval - 2); } },
      { title: "スピードアップ", desc: "移動速度がアップ", apply: () => { player.speed += 0.5; } }
    ];
  }

  // メインループ
  function loop() {
    if (gameState === "playing") {
      updateGameLogic();
    }
    draw();
    requestAnimationFrame(loop);
  }

  // 入力処理（キーボード）
  const moveVector = { x: 0, y: 0 };
  const keys = {};

  window.addEventListener("keydown", (e) => {
    keys[e.key] = true;
    updateMoveVector();

    if (e.key === "p" || e.key === "P") {
      if (gameState === "playing") gameState = "paused";
      else if (gameState === "paused") gameState = "playing";
    }
  });

  window.addEventListener("keyup", (e) => {
    keys[e.key] = false;
    updateMoveVector();
  });

  function updateMoveVector() {
    moveVector.x = (keys["ArrowRight"] || keys["d"] || keys["D"]) - (keys["ArrowLeft"] || keys["a"] || keys["A"]);
    moveVector.y = (keys["ArrowDown"] || keys["s"] || keys["S"]) - (keys["ArrowUp"] || keys["w"] || keys["W"]);
    if (moveVector.x !== 0 && moveVector.y !== 0) {
      moveVector.x *= 0.7071;
      moveVector.y *= 0.7071;
    }
  }

  // 入力処理（タッチ＆マウス）
  let isDragging = false;
  let lastX = 0;
  let lastY = 0;

  function handlePointerDown(e) {
    const clientX = e.clientX || (e.touches && e.touches[0].clientX);
    const clientY = e.clientY || (e.touches && e.touches[0].clientY);
    if (!clientX) return;

    if (gameState === "menu" || gameState === "gameover" || gameState === "victory") {
      resetGame();
      gameState = "playing";
    } else if (gameState === "playing") {
      isDragging = true;
      lastX = clientX;
      lastY = clientY;
    } else if (gameState === "choosing") {
      const rect = canvas.getBoundingClientRect();
      const clickY = clientY - rect.top;
      const choiceIndex = Math.floor((clickY - 200) / 80);
      if (choiceIndex >= 0 && choiceIndex < choices.length) {
        choices[choiceIndex].apply();
        wave++;
        killsInWave = 0;
        killsToNextWave += 5;
        gameState = "playing";
      }
    }
  }

  function handlePointerMove(e) {
    if (!isDragging || gameState !== "playing") return;
    const clientX = e.clientX || (e.touches && e.touches[0].clientX);
    const clientY = e.clientY || (e.touches && e.touches[0].clientY);
    if (!clientX) return;

    const dx = clientX - lastX;
    const dy = clientY - lastY;
    lastX = clientX;
    lastY = clientY;

    // マウス/タッチ移動量をプレイヤーの移動ベクトルに変換
    moveVector.x = dx * 0.2;
    moveVector.y = dy * 0.2;

    // 少し遅れて慣性で止まるようにリセットをかける（毎フレーム移動量が加算されるのを防ぐ）
    setTimeout(() => {
      if (moveVector.x === dx * 0.2) moveVector.x = 0;
      if (moveVector.y === dy * 0.2) moveVector.y = 0;
    }, 50);
  }

  function handlePointerUp() {
    isDragging = false;
    moveVector.x = 0;
    moveVector.y = 0;
  }

  canvas.addEventListener("mousedown", handlePointerDown);
  window.addEventListener("mousemove", handlePointerMove);
  window.addEventListener("mouseup", handlePointerUp);

  canvas.addEventListener("touchstart", (e) => { e.preventDefault(); handlePointerDown(e); }, { passive: false });
  window.addEventListener("touchmove", (e) => { handlePointerMove(e); }, { passive: false });
  window.addEventListener("mouseup", handlePointerUp);
  window.addEventListener("touchend", handlePointerUp);

  function resetGame() {
    score = 0;
    wave = 1;
    killsInWave = 0;
    killsToNextWave = 10;
    player.hp = player.maxHp;
    player.x = canvas.width / 2 - 20;
    player.y = canvas.height - 80;
    player.bulletDamage = 1;
    player.fireInterval = 14;
    player.speed = BASE_PLAYER_SPEED;
    enemies = [];
    bullets = [];
    enemyBullets = [];
    items = [];
    boss = null;
    particles = [];
  }

  // 初回実行
  loop();
</script>
</body>
</html>
