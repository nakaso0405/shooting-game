<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ローグライク・シューティング</title>
<style>
  body {
    background-color: #111;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    overflow: hidden;
    touch-action: none;
    font-family: sans-serif;
  }
  canvas {
    background-color: #05050a;
    border: 2px solid #00ffcc;
    max-width: 95vw;
    max-height: 82vh;
    box-shadow: 0 0 18px rgba(0, 255, 204, 0.22);
  }
  p {
    margin-top: 8px;
    font-size: 13px;
    color: #aaa;
    text-align: center;
  }
</style>
</head>
<body>

  <canvas id="gameCanvas" width="360" height="540"></canvas>
  <p>タッチ＆スライド / 矢印キー・WASD 移動（Space:ボム / V:バリア / P:一時停止）</p>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  const HIGH_SCORE_KEY = "roguelike_shooting_highscore_v1";
  const PLAYER_INVINCIBLE_DURATION = 90;
  const BARRIER_ITEM_DURATION = 300;
  const BASE_PLAYER_SPEED = 2.2;
  const MAX_WAVE = 10;
  const MAX_BOMBS = 3;
  const MAX_BARRIERS = 3;

  // BGM設定（ファイルがなくてもエラーにならない安全設計）
  function createSafeAudio(src) {
    try {
      const audio = new Audio(src);
      audio.loop = true;
      audio.volume = 0.45;
      audio.addEventListener("error", () => {});
      return audio;
    } catch (e) {
      return null;
    }
  }

  const menuBgm = createSafeAudio("./menu_bgm.mp3");
  const gameBgm = createSafeAudio("./bgm.mp3");
  let isMuted = false;

  // 制作者向けデバッグモード
  let isDebugMode = false;
  let isGodMode = false;
  let secretTapCount = 0;
  let lastSecretTapTime = 0;

  function getTargetBgm() {
    return (gameState === "menu" || gameState === "encyclopedia") ? menuBgm : gameBgm;
  }

  function syncBgmPlayback() {
    const target = getTargetBgm();
    const other = target === menuBgm ? gameBgm : menuBgm;

    if (other && !other.paused) {
      try { other.pause(); } catch (e) {}
    }
    if (!target) return;

    target.muted = isMuted;
    if (!isMuted && target.paused) {
      try {
        const p = target.play();
        if (p && typeof p.catch === "function") p.catch(() => {});
      } catch (e) {}
    }
  }

  function toggleMute() {
    isMuted = !isMuted;
    if (menuBgm) menuBgm.muted = isMuted;
    if (gameBgm) gameBgm.muted = isMuted;
    syncBgmPlayback();
  }

  // 画像の安全読み込み（読み込み前・失敗時は自動でイラスト図形にフォールバック）
  function createSafeImage(src) {
    const img = new Image();
    img.hasError = false;
    img.onerror = () => { img.hasError = true; };
    img.src = src;
    return img;
  }

  const playerSprite = createSafeImage("./player.png");
  const enemySprites = {
    normal: createSafeImage("./enemy_normal.png"),
    zigzag: createSafeImage("./enemy_zigzag.png"),
    dash: createSafeImage("./enemy_dash.png"),
    tank: createSafeImage("./enemy_tank.png"),
    weave: createSafeImage("./enemy_weave.png"),
    erratic: createSafeImage("./enemy_erratic.png"),
    midBoss: createSafeImage("./boss_mid.png"),
    finalBoss: createSafeImage("./boss_final.png")
  };

  function drawSpriteIfReady(img, x, y, width, height) {
    if (img && !img.hasError && img.complete && img.naturalWidth > 0) {
      try {
        ctx.save();
        ctx.imageSmoothingEnabled = false;
        ctx.drawImage(img, x, y, width, height);
        ctx.restore();
        return true;
      } catch (e) {
        return false;
      }
    }
    return false;
  }

  function loadHighScore() {
    try {
      const saved = localStorage.getItem(HIGH_SCORE_KEY);
      const parsed = saved ? parseInt(saved, 10) : 0;
      return Number.isFinite(parsed) && parsed > 0 ? parsed : 0;
    } catch (e) {
      return 0;
    }
  }

  function saveHighScoreIfNeeded() {
    if (isDebugMode) return;
    if (score > highScore) {
      highScore = score;
      try {
        localStorage.setItem(HIGH_SCORE_KEY, String(highScore));
      } catch (e) {}
    }
  }

  function resetHighScore() {
    highScore = 0;
    try {
      localStorage.removeItem(HIGH_SCORE_KEY);
    } catch (e) {}
    confirmReset = false;
  }

  // ゲーム状態: "menu", "encyclopedia", "playing", "paused", "choosing", "waveSelect", "gameover", "victory"
  let gameState = "menu";
  let confirmReset = false;
  let encyclopediaTab = "enemies";
  let encyclopediaPage = 0;
  let score = 0;
  let highScore = loadHighScore();
  let wave = 1;
  let killsInWave = 0;
  let killsToNextWave = 10;
  let frameCount = 0;
  let shotSequenceCount = 0;
  let bombFlashTimer = 0;

  // 図鑑データ
  const ENCYCLOPEDIA_ENEMIES = [
    { type: "normal", name: "ノーマル機", waveText: "WAVE 1〜", moveText: "まっすぐ下へ降下してくる基本の敵。" },
    { type: "tank", name: "タンク・アステロイド", waveText: "WAVE 2〜", moveText: "動きはゆっくりだが耐久力が高い大型機。" },
    { type: "dash", name: "ダッシュ機", waveText: "WAVE 3〜", moveText: "猛スピードで一気に突進してくる高速機。" },
    { type: "zigzag", name: "ジグザグUFO", waveText: "WAVE 4〜", moveText: "左右にゆらゆら蛇行しながら降下する。" },
    { type: "weave", name: "ウィーブ機", waveText: "WAVE 5〜", moveText: "画面の左右の壁で反射しながら斜めに進む。" },
    { type: "erratic", name: "エラティック機", waveText: "WAVE 7〜", moveText: "急停止や急な方向転換をくり返すトリッキー機。" },
    { type: "midBoss", name: "中ボス：Δ-GUARDIAN", waveText: "WAVE 5", moveText: "左右移動から扇状弾と全方位弾を切り替える。" },
    { type: "finalBoss", name: "ラスボス：Ω-OVERLORD", waveText: "WAVE 10", moveText: "弾幕・回転ワインダー・高速狙撃の3形態攻撃。" }
  ];

  const ENCYCLOPEDIA_ITEMS = [
    { type: "heart", name: "リペアハート", usageText: "取得時：即時発動", descText: "拾った瞬間にHPを1回復。最大時はスコア+300。" },
    { type: "barrier", name: "エナジーバリア", usageText: "取得時：ストック（最大3個）", descText: "左下ボタン（Vキー）で約5秒間無敵シールド展開。" },
    { type: "bomb", name: "メガボム", usageText: "取得時：ストック（最大3個）", descText: "右下ボタン（Space）で敵弾消去＆全体攻撃。" }
  ];

  // 星空背景（3層パララックス）
  const STAR_COLORS = ["#ffffff", "#cceeff", "#aaddff", "#fff5cc", "#80ffea"];
  const stars = [];

  function initStarfield() {
    stars.length = 0;
    const layers = [
      { count: 34, minSize: 1.0, maxSize: 1.4, minSpeed: 0.45, maxSpeed: 0.85, minAlpha: 0.28, maxAlpha: 0.52 },
      { count: 20, minSize: 1.6, maxSize: 2.2, minSpeed: 1.25, maxSpeed: 1.95, minAlpha: 0.50, maxAlpha: 0.78 },
      { count: 11, minSize: 2.4, maxSize: 3.1, minSpeed: 2.40, maxSpeed: 3.50, minAlpha: 0.75, maxAlpha: 1.00 }
    ];
    for (const layer of layers) {
      for (let i = 0; i < layer.count; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: layer.minSize + Math.random() * (layer.maxSize - layer.minSize),
          speed: layer.minSpeed + Math.random() * (layer.maxSpeed - layer.minSpeed),
          alpha: layer.minAlpha + Math.random() * (layer.maxAlpha - layer.minAlpha),
          color: STAR_COLORS[Math.floor(Math.random() * STAR_COLORS.length)],
          twinklePhase: Math.random() * Math.PI * 2
        });
      }
    }
  }

  function updateAndDrawStarfield(updatePhysics = true, speedMultiplier = 1.0) {
    ctx.fillStyle = "#05050a";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      if (updatePhysics) {
        s.y += s.speed * speedMultiplier;
        s.twinklePhase += 0.04;
        if (s.y > canvas.height + 4) {
          s.y = -4;
          s.x = Math.random() * canvas.width;
        }
      }
      const twinkle = 0.85 + Math.sin(s.twinklePhase) * 0.15;
      ctx.save();
      ctx.globalAlpha = Math.min(1, s.alpha * twinkle);
      ctx.fillStyle = s.color;
      ctx.fillRect(Math.floor(s.x), Math.floor(s.y), Math.ceil(s.size), Math.ceil(s.size));
      ctx.restore();
    }
  }

  initStarfield();

  // エフェクト管理
  let particles = [];
  let shockwaves = [];
  let screenShake = 0;

  function getExplosionPalette(type) {
    if (type === "zigzag") return ["#e040fb", "#ea80fc", "#00ffcc", "#ffffff"];
    if (type === "dash") return ["#ff6d00", "#ffab00", "#fff59d", "#ffffff"];
    if (type === "tank") return ["#78909c", "#90a4ae", "#cfd8dc", "#ffffff"];
    if (type === "weave") return ["#00e676", "#00c853", "#69f0ae", "#ffffff"];
    if (type === "erratic") return ["#00b0ff", "#40c4ff", "#18ffff", "#ffffff"];
    if (type === "mid") return ["#e040fb", "#00ffcc", "#ffd740", "#ffffff"];
    if (type === "final") return ["#ff1744", "#ff9100", "#ffd600", "#00ffcc", "#ffffff"];
    if (type === "item_heart") return ["#ff4081", "#ff80ab", "#ffffff"];
    if (type === "item_barrier") return ["#00e5ff", "#84ffff", "#ffffff"];
    if (type === "item_bomb") return ["#ff9100", "#ffd740", "#ffffff"];
    return ["#ff5252", "#ffab40", "#fff59d", "#ffffff"];
  }

  function spawnExplosion(x, y, type = "normal", scale = 1) {
    const palette = getExplosionPalette(type);
    const particleCount = Math.round(14 * scale);

    for (let i = 0; i < particleCount; i++) {
      const angle = (Math.PI * 2 * i) / particleCount + (Math.random() - 0.5) * 0.45;
      const speed = (1.6 + Math.random() * 3.4) * Math.sqrt(scale);
      const maxLife = Math.round((16 + Math.random() * 12) * Math.min(1.8, scale));
      particles.push({
        x, y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        size: (2.2 + Math.random() * 2.8) * Math.min(1.6, scale),
        color: palette[Math.floor(Math.random() * palette.length)],
        life: maxLife,
        maxLife: maxLife
      });
    }

    shockwaves.push({
      x, y,
      radius: 4 * scale,
      maxRadius: 28 * scale,
      color: palette[0],
      life: Math.round(14 * Math.min(1.6, scale)),
      maxLife: Math.round(14 * Math.min(1.6, scale))
    });

    if (scale >= 2.0) {
      shockwaves.push({
        x, y,
        radius: 2,
        maxRadius: 42 * scale,
        color: "#ffffff",
        life: 22,
        maxLife: 22
      });
    }

    screenShake = Math.max(screenShake, Math.min(8, Math.round(2.5 * scale)));
  }

  function updateAndDrawEffects(updatePhysics = true) {
    for (let i = shockwaves.length - 1; i >= 0; i--) {
      const sw = shockwaves[i];
      if (updatePhysics) {
        sw.life--;
        const progress = 1 - Math.max(0, sw.life / sw.maxLife);
        sw.radius = 4 + (sw.maxRadius - 4) * (1 - Math.pow(1 - progress, 2));
      }
      if (sw.life <= 0) {
        shockwaves.splice(i, 1);
        continue;
      }
      ctx.save();
      ctx.globalAlpha = Math.max(0, sw.life / sw.maxLife) * 0.85;
      ctx.strokeStyle = sw.color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      if (updatePhysics) {
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.92;
        p.vy *= 0.92;
        p.life--;
      }
      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }
      const alpha = Math.max(0, p.life / p.maxLife);
      const drawSize = p.size * (0.4 + 0.6 * alpha);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - drawSize / 2, p.y - drawSize / 2, drawSize, drawSize);
      ctx.restore();
    }
  }

  // 自機ステータス
  const player = {
    x: canvas.width / 2 - 20,
    y: canvas.height - 75,
    width: 40,
    height: 40,
    speed: BASE_PLAYER_SPEED,
    hp: 3,
    maxHp: 3,
    invincibleTimer: 0,
    barrierTimer: 0,
    barriers: 0,
    bombs: 0,
    homingLevel: 0,
    petLevel: 0,
    fireInterval: 16,
    bulletCount: 1,
    bulletSpeed: 9,
    bulletDamage: 1,
    bulletWidth: 6,
    bulletHeight: 14,
    color: "#00ffcc"
  };

  function getPlayerHitbox() {
    const hitW = Math.round(player.width * 0.6);
    const hitH = Math.round(player.height * 0.65);
    return {
      x: player.x + (player.width - hitW) / 2,
      y: player.y + (player.height - hitH) / 2 + 2,
      width: hitW,
      height: hitH
    };
  }

  function isPlayerProtected() {
    return isGodMode || player.invincibleTimer > 0 || player.barrierTimer > 0;
  }

  function damagePlayer(amount = 1) {
    if (isPlayerProtected()) return false;
    player.hp -= amount;
    player.invincibleTimer = PLAYER_INVINCIBLE_DURATION;
    spawnExplosion(player.x + player.width / 2, player.y + player.height / 2, "dash", 0.9);
    if (player.hp <= 0) {
      player.hp = 0;
      triggerGameOver();
    }
    return true;
  }

  function useBarrier() {
    if (gameState !== "playing") return false;
    if (player.barriers <= 0 || player.barrierTimer > 0) return false;
    player.barriers--;
    player.barrierTimer = BARRIER_ITEM_DURATION;
    spawnExplosion(player.x + player.width / 2, player.y + player.height / 2, "item_barrier", 1.3);
    return true;
  }

  function useBomb() {
    if (gameState !== "playing") return false;
    if (player.bombs <= 0) return false;

    player.bombs--;
    bombFlashTimer = 18;
    player.invincibleTimer = Math.max(player.invincibleTimer, 60);
    screenShake = 8;

    spawnExplosion(player.x + player.width / 2, player.y + player.height / 2, "item_bomb", 2.8);
    enemyBullets = [];

    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      spawnExplosion(e.x + e.width / 2, e.y + e.height / 2, e.type, e.type === "tank" ? 1.35 : 1.0);
      score += e.scoreValue;
      enemies.splice(i, 1);
    }

    if (boss) {
      const bombDamage = boss.type === "mid" ? 28 : 95;
      boss.hp -= bombDamage;
      spawnExplosion(boss.x + boss.width / 2, boss.y + boss.height / 2, "item_bomb", 1.8);

      if (boss.type === "mid" && boss.hp <= 0) {
        spawnExplosion(boss.x + boss.width / 2, boss.y + boss.height / 2, "mid", 2.1);
        score += 1000;
        boss = null;
        clearStickInput();
        generateChoices();
        gameState = "choosing";
        return true;
      } else if (boss.type === "final" && boss.hp <= 0) {
        spawnExplosion(boss.x + boss.width / 2, boss.y + boss.height / 2, "final", 2.8);
        score += 3000;
        boss = null;
        triggerVictory();
        return true;
      }
    }
    return true;
  }

  // ペット（オプション機）
  function getPetPosition() {
    const cx = player.x + player.width / 2;
    const cy = player.y + player.height / 2;
    const angle = frameCount * 0.045;
    return {
      x: cx + Math.cos(angle) * 36,
      y: cy + 8 + Math.sin(angle) * 22
    };
  }

  function drawPet() {
    if (player.petLevel <= 0) return;
    const pos = getPetPosition();

    ctx.save();
    ctx.fillStyle = "rgba(128, 255, 234, 0.22)";
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, 11, 0, Math.PI * 2);
    ctx.fill();

    ctx.fillStyle = "#80ffea";
    ctx.beginPath();
    ctx.moveTo(pos.x, pos.y - 8);
    ctx.lineTo(pos.x + 8, pos.y);
    ctx.lineTo(pos.x, pos.y + 8);
    ctx.lineTo(pos.x - 8, pos.y);
    ctx.closePath();
    ctx.fill();

    ctx.strokeStyle = "#ffffff";
    ctx.lineWidth = 1.4;
    ctx.stroke();

    ctx.fillStyle = "#ff4081";
    ctx.beginPath();
    ctx.arc(pos.x, pos.y, 3, 0, Math.PI * 2);
    ctx.fill();
    ctx.restore();
  }

  function firePetBullets() {
    if (player.petLevel <= 0) return;
    const interval = Math.max(12, 26 - (player.petLevel - 1) * 4);
    if (frameCount % interval !== 0) return;

    const pos = getPetPosition();
    bullets.push({
      x: pos.x - 2.5,
      y: pos.y - 8,
      width: 5,
      height: 11,
      vx: 0,
      vy: player.bulletSpeed + 1.5,
      damage: player.petLevel,
      homing: false,
      fromPet: true
    });
  }

  function drawPlayerIllustration() {
    const hasBarrier = player.barrierTimer > 0;
    const isBlinking = !isGodMode && !hasBarrier && player.invincibleTimer > 0 && Math.floor(player.invincibleTimer / 3) % 2 !== 0;
    if (isBlinking) return;

    ctx.save();
    if (!hasBarrier && (player.invincibleTimer > 0 || isGodMode)) {
      ctx.globalAlpha = isGodMode ? 0.92 : 0.72;
    }

    if (!drawSpriteIfReady(playerSprite, player.x, player.y, player.width, player.height)) {
      const cx = player.x + player.width / 2;
      const flameFlicker = (frameCount % 4) * 2;

      ctx.fillStyle = "#ff9100";
      ctx.beginPath();
      ctx.moveTo(cx - 7, player.y + player.height - 2);
      ctx.lineTo(cx, player.y + player.height + 9 + flameFlicker);
      ctx.lineTo(cx + 7, player.y + player.height - 2);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#fff59d";
      ctx.beginPath();
      ctx.moveTo(cx - 3.5, player.y + player.height - 2);
      ctx.lineTo(cx, player.y + player.height + 4 + Math.floor(flameFlicker / 2));
      ctx.lineTo(cx + 3.5, player.y + player.height - 2);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#00897b";
      ctx.beginPath();
      ctx.moveTo(cx, player.y + 8);
      ctx.lineTo(player.x + player.width + 2, player.y + player.height - 4);
      ctx.lineTo(cx + 9, player.y + player.height - 7);
      ctx.lineTo(cx - 9, player.y + player.height - 7);
      ctx.lineTo(player.x - 2, player.y + player.height - 4);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = player.color;
      ctx.beginPath();
      ctx.moveTo(cx, player.y);
      ctx.lineTo(cx + 11, player.y + player.height - 6);
      ctx.lineTo(cx, player.y + player.height - 10);
      ctx.lineTo(cx - 11, player.y + player.height - 6);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = "#b2fff2";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.fillStyle = "#1a237e";
      ctx.beginPath();
      ctx.ellipse(cx, player.y + 18, 4.2, 7.5, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#80d8ff";
      ctx.beginPath();
      ctx.ellipse(cx - 1, player.y + 15.5, 1.8, 3.2, -0.2, 0, Math.PI * 2);
      ctx.fill();
    }

    if (hasBarrier) {
      const cx = player.x + player.width / 2;
      const cy = player.y + player.height / 2;
      const isExpiring = player.barrierTimer < 75 && Math.floor(player.barrierTimer / 4) % 2 === 0;
      if (!isExpiring) {
        ctx.fillStyle = "rgba(0, 229, 255, 0.16)";
        ctx.beginPath();
        ctx.arc(cx, cy, 26, 0, Math.PI * 2);
        ctx.fill();
        ctx.strokeStyle = "#00e5ff";
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(cx, cy, 26, 0, Math.PI * 2);
        ctx.stroke();
      }
    } else if (player.invincibleTimer > 0 || isGodMode) {
      const cx = player.x + player.width / 2;
      const cy = player.y + player.height / 2;
      ctx.strokeStyle = isGodMode ? "#ffd700" : "#80ffff";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(cx, cy, 23, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.restore();
  }

  // 操作入力（キーボード＆タッチ相対スライド）
  const keysPressed = { left: false, right: false, up: false, down: false };

  function clearKeyInput() {
    keysPressed.left = false;
    keysPressed.right = false;
    keysPressed.up = false;
    keysPressed.down = false;
  }

  const dragInput = {
    active: false,
    touchId: null,
    lastX: 0,
    lastY: 0,
    pendingDx: 0,
    pendingDy: 0
  };

  function clearStickInput() {
    dragInput.active = false;
    dragInput.touchId = null;
    dragInput.pendingDx = 0;
    dragInput.pendingDy = 0;
  }

  function getCanvasCoords(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const safeW = rect.width || canvas.width;
    const safeH = rect.height || canvas.height;
    return {
      x: (clientX - rect.left) * (canvas.width / safeW),
      y: (clientY - rect.top) * (canvas.height / safeH)
    };
  }

  function beginStickInput(clientX, clientY, touchId = null) {
    const pos = getCanvasCoords(clientX, clientY);
    dragInput.active = true;
    dragInput.touchId = touchId;
    dragInput.lastX = pos.x;
    dragInput.lastY = pos.y;
    dragInput.pendingDx = 0;
    dragInput.pendingDy = 0;
  }

  function moveStickInput(clientX, clientY) {
    if (!dragInput.active) return;
    const pos = getCanvasCoords(clientX, clientY);
    const diffX = pos.x - dragInput.lastX;
    const diffY = pos.y - dragInput.lastY;
    dragInput.lastX = pos.x;
    dragInput.lastY = pos.y;
    if (Math.hypot(diffX, diffY) < 1.0) return;
    dragInput.pendingDx += diffX;
    dragInput.pendingDy += diffY;
  }

  function clampPlayerPosition() {
    if (player.x < 0) player.x = 0;
    if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
    if (player.y < 56) player.y = 56;
    if (player.y > canvas.height - player.height) player.y = canvas.height - player.height;
  }

  function updatePlayerMovement() {
    let kx = 0;
    let ky = 0;
    if (keysPressed.left) kx -= 1;
    if (keysPressed.right) kx += 1;
    if (keysPressed.up) ky -= 1;
    if (keysPressed.down) ky += 1;

    if (kx !== 0 || ky !== 0) {
      const len = Math.hypot(kx, ky);
      const keyMoveSpeed = Math.max(3.6, player.speed * 1.45);
      player.x += (kx / len) * keyMoveSpeed;
      player.y += (ky / len) * keyMoveSpeed;
      clampPlayerPosition();
    }

    if (!dragInput.active) return;
    if (dragInput.pendingDx === 0 && dragInput.pendingDy === 0) return;

    const sensitivity = 0.55 * (player.speed / BASE_PLAYER_SPEED);
    const maxStep = player.speed * 1.65;
    player.x += Math.max(-maxStep, Math.min(maxStep, dragInput.pendingDx * sensitivity));
    player.y += Math.max(-maxStep, Math.min(maxStep, dragInput.pendingDy * sensitivity));

    dragInput.pendingDx = 0;
    dragInput.pendingDy = 0;
    clampPlayerPosition();
  }

    const cx = item.x + item.width / 2;

    } else if (item.type === "bomb") {

      spawnExplosion(cx, cy, "item_bomb", 1.0);

  function drawItemIconAt(type, cx, cy, r = 13) {
    ctx.save();
    if (type === "heart") {
      ctx.fillStyle = "rgba(255, 64, 129, 0.25)";
      ctx.beginPath();
      ctx.arc(cx, cy, r + 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#ff80ab";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.fillStyle = "#ff4081";
      ctx.beginPath();
      ctx.moveTo(cx, cy + 7);
      ctx.bezierCurveTo(cx - 10, cy, cx - 10, cy - 8, cx, cy - 3);
      ctx.bezierCurveTo(cx + 10, cy - 8, cx + 10, cy, cx, cy + 7);
      ctx.fill();
    } else if (type === "barrier") {
      ctx.fillStyle = "rgba(0, 229, 255, 0.24)";
      ctx.beginPath();
      ctx.arc(cx, cy, r + 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#00e5ff";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = "#84ffff";
      ctx.beginPath();
      ctx.moveTo(cx, cy - 8);
      ctx.lineTo(cx + 7, cy - 4);
      ctx.lineTo(cx + 6, cy + 3);
      ctx.lineTo(cx, cy + 8);
      ctx.lineTo(cx - 6, cy + 3);
      ctx.lineTo(cx - 7, cy - 4);
      ctx.closePath();
      ctx.fill();
    } else if (type === "bomb") {
      ctx.fillStyle = "rgba(255, 145, 0, 0.26)";
      ctx.beginPath();
      ctx.arc(cx, cy, r + 2, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#ffd740";
      ctx.lineWidth = 1.8;
      ctx.stroke();

      ctx.fillStyle = "#ff9100";
      ctx.beginPath();
      ctx.arc(cx, cy + 2, 7, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(cx + 3, cy - 4);
      ctx.lineTo(cx + 7, cy - 8);
      ctx.stroke();

      ctx.fillStyle = "#ffff00";
      ctx.fillRect(cx + 6, cy - 10, 3, 3);
    }
    ctx.restore();
  }

  function drawItem(item) {
    drawItemIconAt(item.type, item.x + item.width / 2, item.y + item.height / 2, item.width / 2);

  function updateAndDrawItems() {
    maybeSpawnSkyItem();
    const playerHitbox = getPlayerHitbox();

    for (let i = items.length - 1; i >= 0; i--) {
      const item = items[i];
      item.y += item.vy;
      item.wobblePhase += 0.08;
      item.x += Math.sin(item.wobblePhase) * 0.45;

      drawItem(item);

      if (isColliding(playerHitbox, item)) {
        collectItem(item);
        items.splice(i, 1);
        continue;
      }
      if (item.y > canvas.height + 30) items.splice(i, 1);
    }
  }

  function pickWeightedCard(pool) {
    const totalWeight = pool.reduce((sum, item) => sum + (item.rarity === "rare" ? 1 : 4), 0);
    let roll = Math.random() * totalWeight;
    for (const item of pool) {
      roll -= (item.rarity === "rare" ? 1 : 4);
      if (roll <= 0) return item;
    }
    return pool[pool.length - 1];
  }

  function generateChoices() {
    const eligiblePool = upgradePool.filter((u) => {
      if (u.minWave && wave < u.minWave) return false;
      if (u.id === "homing" && player.homingLevel >= 3) return false;
      if (u.id === "pet" && player.petLevel >= 3) return false;
      return true;
    });

    const remaining = [...eligiblePool];
    choices = [];
    while (choices.length < 3 && remaining.length > 0) {
      const picked = pickWeightedCard(remaining);
      choices.push(picked);
      remaining.splice(remaining.indexOf(picked), 1);
    }
  }

  // タップ・クリック操作
  function handleTap(clientX, clientY) {
    const { x, y } = getCanvasCoords(clientX, clientY);

    if (gameState === "menu") {
      if (x >= 0 && x <= 55 && y >= 0 && y <= 55) {
        const now = Date.now();
        secretTapCount = (now - lastSecretTapTime < 800) ? secretTapCount + 1 : 1;
        lastSecretTapTime = now;
        if (secretTapCount >= 3) {
          isDebugMode = !isDebugMode;
          isGodMode = isDebugMode;
          secretTapCount = 0;
        }
        return;
      }

      if (confirmReset) {
        if (isPointInRect(x, y, getConfirmYesButtonRect())) resetHighScore();
        else if (isPointInRect(x, y, getConfirmNoButtonRect())) confirmReset = false;
        return;
      }

      if (isPointInRect(x, y, getStartButtonRect())) {
        startNewGame();
      } else if (isPointInRect(x, y, getEncyclopediaButtonRect())) {
        syncBgmPlayback();
        encyclopediaTab = "enemies";
        encyclopediaPage = 0;
        gameState = "encyclopedia";
      } else if (isPointInRect(x, y, getMuteButtonRect())) {
        toggleMute();
      } else if (isPointInRect(x, y, getResetButtonRect())) {
        syncBgmPlayback();
        confirmReset = true;
      } else {
        syncBgmPlayback();
      }
      return;
    }

    if (gameState === "encyclopedia") {
      const tabs = getEncyclopediaTabRects();
      const nav = getEncyclopediaPageRects();

      if (isPointInRect(x, y, tabs.enemies)) {
        encyclopediaTab = "enemies";
        encyclopediaPage = 0;
        return;
      }
      if (isPointInRect(x, y, tabs.items)) {
        encyclopediaTab = "items";
        encyclopediaPage = 0;
        return;
      }
      if (encyclopediaTab === "enemies") {
        const totalPages = Math.ceil(ENCYCLOPEDIA_ENEMIES.length / 4);
        if (encyclopediaPage > 0 && isPointInRect(x, y, nav.prev)) { encyclopediaPage--; return; }
        if (encyclopediaPage < totalPages - 1 && isPointInRect(x, y, nav.next)) { encyclopediaPage++; return; }
      }
      if (isPointInRect(x, y, nav.back)) gameState = "menu";
      return;
    }

    if (gameState === "paused") {
      if (isPointInRect(x, y, getResumeButtonRect())) resumeGame();
      else if (isPointInRect(x, y, getPauseRetryButtonRect())) startNewGame();
      else if (isPointInRect(x, y, getPauseMuteButtonRect())) toggleMute();
      else if (isPointInRect(x, y, getPauseMenuButtonRect())) returnToMenu();
      return;
    }

    if (gameState === "waveSelect") {
      if (!isDebugMode) { gameState = "playing"; return; }
      for (const r of getWaveSelectRects()) {
        if (isPointInRect(x, y, r)) { enterWave(r.wave); break; }
      }
      return;
    }

    if (gameState === "gameover") {
      if (isPointInRect(x, y, getGameOverRetryButtonRect())) startNewGame();
      else if (isPointInRect(x, y, getBackToMenuButtonRect())) returnToMenu();
      return;
    }

    if (gameState === "victory") {
      if (isPointInRect(x, y, getBackToMenuButtonRect())) returnToMenu();
      return;
    }

    if (gameState === "choosing") {
      for (const r of getCardRects()) {
        if (isPointInRect(x, y, r)) {
          r.choice.apply();
          enterWave(wave + 1);
          break;
        }
      }
    }
  }

  canvas.addEventListener("touchstart", (e) => {
    e.preventDefault();
    if (e.touches.length === 0) return;

    if (gameState === "playing") {
      syncBgmPlayback();
      const t = e.changedTouches[0];
      const pos = getCanvasCoords(t.clientX, t.clientY);

      if (isDebugMode) {
        for (const btn of getDebugButtonRects()) {
          if (isPointInRect(pos.x, pos.y, btn)) { handleDebugAction(btn.id); return; }
        }
      }
      if (isPointInRect(pos.x, pos.y, getPauseButtonRect())) { pauseGame(); return; }
      if (isPointInRect(pos.x, pos.y, getBarrierButtonRect())) { useBarrier(); return; }
      if (isPointInRect(pos.x, pos.y, getBombButtonRect())) { useBomb(); return; }

      if (!dragInput.active) beginStickInput(t.clientX, t.clientY, t.identifier);
    } else {
      handleTap(e.changedTouches[0].clientX, e.changedTouches[0].clientY);
    }
  }, { passive: false });

  canvas.addEventListener("touchmove", (e) => {
    e.preventDefault();
    if (gameState !== "playing" || !dragInput.active) return;
    for (let i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === dragInput.touchId) {
        moveStickInput(e.changedTouches[i].clientX, e.changedTouches[i].clientY);
        break;
      }
    }
  }, { passive: false });

  function handleTouchEndOrCancel(e) {
    e.preventDefault();
    if (!dragInput.active) return;
    for (let i = 0; i < e.changedTouches.length; i++) {
      if (e.changedTouches[i].identifier === dragInput.touchId) {
        clearStickInput();
        break;
      }
    }
  }

  canvas.addEventListener("touchend", handleTouchEndOrCancel, { passive: false });
  canvas.addEventListener("touchcancel", handleTouchEndOrCancel, { passive: false });

  let isMouseDown = false;
  canvas.addEventListener("mousedown", (e) => {
    if (gameState === "playing") {
      syncBgmPlayback();
      const pos = getCanvasCoords(e.clientX, e.clientY);

      if (isDebugMode) {
        for (const btn of getDebugButtonRects()) {
          if (isPointInRect(pos.x, pos.y, btn)) { handleDebugAction(btn.id); return; }
        }
      }
      if (isPointInRect(pos.x, pos.y, getPauseButtonRect())) { pauseGame(); return; }
      if (isPointInRect(pos.x, pos.y, getBarrierButtonRect())) { useBarrier(); return; }
      if (isPointInRect(pos.x, pos.y, getBombButtonRect())) { useBomb(); return; }

      isMouseDown = true;
      beginStickInput(e.clientX, e.clientY, "mouse");
    } else {
      handleTap(e.clientX, e.clientY);
    }
  });

  window.addEventListener("mousemove", (e) => {
    if (isMouseDown && gameState === "playing") moveStickInput(e.clientX, e.clientY);
  });

  window.addEventListener("mouseup", () => {
    if (isMouseDown) { isMouseDown = false; clearStickInput(); }
  });

  window.addEventListener("keydown", (e) => {
    if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " "].includes(e.key)) e.preventDefault();

    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keysPressed.left = true;
    else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keysPressed.right = true;
    else if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") keysPressed.up = true;
    else if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") keysPressed.down = true;

    if (gameState === "playing") {
      if (e.key === " ") { useBomb(); return; }
      if (e.key === "v" || e.key === "V") { useBarrier(); return; }
    }

    if (e.key === "p" || e.key === "P" || e.key === "Escape") {
      if (gameState === "playing") { syncBgmPlayback(); pauseGame(); }
      else if (gameState === "paused") resumeGame();
      return;
    }

    if (!isDebugMode) return;
    if (gameState !== "playing" && gameState !== "choosing" && gameState !== "waveSelect") return;
    if (e.key === "i" || e.key === "I") handleDebugAction("god");
    else if (e.key === "b" || e.key === "B") handleDebugAction("boss");
    else if (e.key === "c" || e.key === "C") handleDebugAction("card");
  });

  window.addEventListener("keyup", (e) => {
    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") keysPressed.left = false;
    else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") keysPressed.right = false;
    else if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") keysPressed.up = false;
    else if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") keysPressed.down = false;
  });

  window.addEventListener("blur", () => {
    clearKeyInput();
    clearStickInput();
    isMouseDown = false;
  });

  // 敵生成＆更新・描画
  function spawnEnemy() {
    const spawnChance = Math.min(0.085, 0.035 + wave * 0.006);
    if (Math.random() >= spawnChance) return;

    const availableTypes = ["normal"];
    if (wave >= 2) availableTypes.push("tank");
    if (wave >= 3) availableTypes.push("dash");
    if (wave >= 4) availableTypes.push("zigzag");
    if (wave >= 5) availableTypes.push("weave");
    if (wave >= 7) availableTypes.push("erratic");

    const type = availableTypes[Math.floor(Math.random() * availableTypes.length)];
    const waveBonusHp = Math.floor((wave - 1) / 2);

    if (type === "zigzag") {
      const startX = 40 + Math.random() * (canvas.width - 80);
      enemies.push({ type: "zigzag", x: startX, baseX: startX, y: -38, width: 38, height: 38, hp: 1 + waveBonusHp, speed: 2.3 + wave * 0.18, phase: Math.random() * Math.PI * 2, scoreValue: 150 });
    } else if (type === "dash") {
      enemies.push({ type: "dash", x: Math.random() * (canvas.width - 32), y: -38, width: 32, height: 38, hp: 1, speed: 5.2 + wave * 0.35, scoreValue: 200 });
    } else if (type === "tank") {
      enemies.push({ type: "tank", x: Math.random() * (canvas.width - 52), y: -52, width: 52, height: 52, hp: 3 + waveBonusHp * 2, speed: 1.5 + wave * 0.12, scoreValue: 250 });
    } else if (type === "weave") {
      const width = 40;
      const startFromLeft = Math.random() < 0.5;
      enemies.push({ type: "weave", x: startFromLeft ? 4 : canvas.width - width - 4, y: -40, width, height: 38, hp: 2 + waveBonusHp, speed: 1.8 + wave * 0.14, vx: (startFromLeft ? 1 : -1) * (3.1 + wave * 0.18), scoreValue: 220 });
    } else if (type === "erratic") {
      const width = 38;
      const initialDir = Math.random() < 0.5 ? -1 : 1;
      enemies.push({ type: "erratic", x: 30 + Math.random() * (canvas.width - width - 60), y: -40, width, height: 38, hp: 2 + waveBonusHp, speed: 1.7 + wave * 0.14, vx: initialDir * (1.8 + Math.random() * 2.4), shiftTimer: 16 + Math.floor(Math.random() * 14), scoreValue: 280 });
    } else {
      enemies.push({ type: "normal", x: Math.random() * (canvas.width - 38), y: -38, width: 38, height: 38, hp: 1 + waveBonusHp, speed: 2.4 + Math.random() * 1.5 + wave * 0.22, scoreValue: 100 });
    }
  }

  function drawEnemyIllustration(e) {
    if (drawSpriteIfReady(enemySprites[e.type], e.x, e.y, e.width, e.height)) return;

    const cx = e.x + e.width / 2;
    const cy = e.y + e.height / 2;

    if (e.type === "zigzag") {
      ctx.fillStyle = "#6a1b9a";
      ctx.beginPath();
      ctx.ellipse(cx, cy + 4, e.width * 0.48, e.height * 0.28, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#e040fb";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = "#ea80fc";
      ctx.beginPath();
      ctx.arc(cx, cy - 3, e.width * 0.24, Math.PI, 0);
      ctx.fill();

      ctx.fillStyle = "#00ffcc";
      ctx.fillRect(cx - 10, cy + 3, 4, 4);
      ctx.fillRect(cx - 2, cy + 5, 4, 4);
      ctx.fillRect(cx + 6, cy + 3, 4, 4);
    } else if (e.type === "dash") {
      ctx.fillStyle = "#ff5500";
      ctx.beginPath();
      ctx.moveTo(cx - 5, e.y + 4);
      ctx.lineTo(cx, e.y - 6 - (frameCount % 4));
      ctx.lineTo(cx + 5, e.y + 4);
      ctx.fill();

      ctx.fillStyle = "#ffaa00";
      ctx.beginPath();
      ctx.moveTo(cx, e.y + e.height);
      ctx.lineTo(e.x, e.y + 6);
      ctx.lineTo(cx, e.y + 14);
      ctx.lineTo(e.x + e.width, e.y + 6);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#fff59d";
      ctx.beginPath();
      ctx.moveTo(cx, e.y + e.height - 4);
      ctx.lineTo(cx - 5, e.y + 12);
      ctx.lineTo(cx + 5, e.y + 12);
      ctx.closePath();
      ctx.fill();
    } else if (e.type === "tank") {
      ctx.fillStyle = "#607d8b";
      ctx.beginPath();
      ctx.moveTo(cx - 4, e.y + 3);
      ctx.lineTo(e.x + e.width - 7, e.y + 8);
      ctx.lineTo(e.x + e.width - 3, e.y + e.height * 0.56);
      ctx.lineTo(e.x + e.width - 11, e.y + e.height - 4);
      ctx.lineTo(cx - 2, e.y + e.height - 2);
      ctx.lineTo(e.x + 6, e.y + e.height - 8);
      ctx.lineTo(e.x + 3, e.y + e.height * 0.45);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "#b0bec5";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = "#455a64";
      ctx.beginPath();
      ctx.arc(cx - 7, cy - 4, 6, 0, Math.PI * 2);
      ctx.arc(cx + 8, cy + 6, 5, 0, Math.PI * 2);
      ctx.fill();
    } else if (e.type === "weave") {
      ctx.fillStyle = "#00695c";
      ctx.beginPath();
      ctx.moveTo(cx, e.y + e.height);
      ctx.lineTo(e.x + e.width, e.y + 12);
      ctx.lineTo(cx + 8, e.y + 4);
      ctx.lineTo(cx - 8, e.y + 4);
      ctx.lineTo(e.x, e.y + 12);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "#00e5ff";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = "#1de9b6";
      ctx.beginPath();
      ctx.moveTo(cx, e.y + 8);
      ctx.lineTo(cx + 9, e.y + 22);
      ctx.lineTo(cx, e.y + 28);
      ctx.lineTo(cx - 9, e.y + 22);
      ctx.closePath();
      ctx.fill();
    } else if (e.type === "erratic") {
      ctx.fillStyle = "#4a148c";
      ctx.beginPath();
      ctx.moveTo(cx, e.y + 2);
      ctx.lineTo(e.x + e.width - 2, cy);
      ctx.lineTo(cx, e.y + e.height - 2);
      ctx.lineTo(e.x + 2, cy);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "#ff4081";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = "#ffea00";
      ctx.beginPath();
      ctx.arc(cx, cy, 6, 0, Math.PI * 2);
      ctx.fill();
    } else if (e.type === "midBoss") {
      ctx.fillStyle = "#4a148c";
      ctx.beginPath();
      ctx.moveTo(e.x, e.y + 12);
      ctx.lineTo(e.x + e.width, e.y + 12);
      ctx.lineTo(e.x + e.width - 14, e.y + e.height - 6);
      ctx.lineTo(cx, e.y + e.height + 6);
      ctx.lineTo(e.x + 14, e.y + e.height - 6);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "#e040fb";
      ctx.lineWidth = 2.5;
      ctx.stroke();

      ctx.fillStyle = "#00ffcc";
      ctx.beginPath();
      ctx.arc(cx, e.y + e.height * 0.48, e.width * 0.13, 0, Math.PI * 2);
      ctx.fill();
    } else if (e.type === "finalBoss") {
      ctx.fillStyle = "#880e4f";
      ctx.beginPath();
      ctx.moveTo(e.x + 8, e.y + 8);
      ctx.lineTo(e.x + e.width - 8, e.y + 8);
      ctx.lineTo(e.x + e.width, e.y + e.height * 0.55);
      ctx.lineTo(e.x + e.width - 16, e.y + e.height);
      ctx.lineTo(e.x + 16, e.y + e.height);
      ctx.lineTo(e.x, e.y + e.height * 0.55);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "#ff1744";
      ctx.lineWidth = 2.5;
      ctx.stroke();

      ctx.fillStyle = "#ffd600";
      ctx.beginPath();
      ctx.arc(cx, cy, e.width * 0.14, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = "#c62828";
      ctx.beginPath();
      ctx.moveTo(cx, e.y + e.height);
      ctx.lineTo(e.x, e.y + 10);
      ctx.lineTo(e.x + 8, e.y + 4);
      ctx.lineTo(e.x + e.width - 8, e.y + 4);
      ctx.lineTo(e.x + e.width, e.y + 10);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "#ff8a80";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.fillStyle = "#ffeb3b";
      ctx.beginPath();
      ctx.ellipse(cx, cy + 2, 5, 8, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function updateAndDrawEnemy(e) {
    e.y += e.speed;
    if (e.type === "zigzag") {
      e.phase += 0.08;
      e.x = Math.max(0, Math.min(canvas.width - e.width, e.baseX + Math.sin(e.phase) * 45));
    } else if (e.type === "weave") {
      e.x += e.vx;
      if (e.x <= 2) { e.x = 2; e.vx = Math.abs(e.vx); }
      else if (e.x >= canvas.width - e.width - 2) { e.x = canvas.width - e.width - 2; e.vx = -Math.abs(e.vx); }
    } else if (e.type === "erratic") {
      e.shiftTimer--;
      if (e.shiftTimer <= 0) {
        e.shiftTimer = 20 + Math.floor(Math.random() * 20);
        e.vx = Math.random() < 0.22 ? 0 : (Math.random() < 0.5 ? -1 : 1) * (1.5 + Math.random() * 3.3);
      }
      e.x += e.vx;
      if (e.x <= 2) { e.x = 2; e.vx = Math.abs(e.vx || 2.5); }
      else if (e.x >= canvas.width - e.width - 2) { e.x = canvas.width - e.width - 2; e.vx = -Math.abs(e.vx || 2.5); }
    }
    drawEnemyIllustration(e);
  }

  function isColliding(a, b) {
    return a.x < b.x + b.width && a.x + a.width > b.x && a.y < b.y + b.height && a.y + a.height > b.y;
  }

  function shootBullets() {
    shotSequenceCount++;
    const homingInterval = getHomingInterval(player.homingLevel);
    const isHomingShot = player.homingLevel > 0 && (shotSequenceCount % homingInterval === 0);

    const centerX = player.x + player.width / 2 - player.bulletWidth / 2;
    const count = player.bulletCount;
    const spreadStep = 0.42;

    for (let i = 0; i < count; i++) {
      const offsetIndex = i - (count - 1) / 2;
      const angle = offsetIndex * spreadStep * 0.45;
      bullets.push({
        x: centerX,
        y: player.y,
        width: player.bulletWidth,
        height: player.bulletHeight,
        vx: Math.sin(angle) * player.bulletSpeed,
        vy: Math.cos(angle) * player.bulletSpeed,
        damage: player.bulletDamage,
        homing: isHomingShot,
        fromPet: false
      });
    }
  }

  function findNearestTarget(bx, by) {
    let bestTarget = null;
    let bestDist = Infinity;

    if (boss) {
      const tx = boss.x + boss.width / 2;
      const ty = boss.y + boss.height / 2;
      const dist = Math.hypot(tx - bx, ty - by);
      if (dist < bestDist) { bestDist = dist; bestTarget = { x: tx, y: ty }; }
    }

    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (e.y + e.height < 0) continue;
      const tx = e.x + e.width / 2;
      const ty = e.y + e.height / 2;
      const dist = Math.hypot(tx - bx, ty - by);
      if (dist < bestDist) { bestDist = dist; bestTarget = { x: tx, y: ty }; }
    }
    return bestTarget;
  }

  function updateAndDrawPlayerBullets() {
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];
      if (b.homing && player.homingLevel > 0) {
        const bx = b.x + b.width / 2;
        const by = b.y + b.height / 2;
        const target = findNearestTarget(bx, by);
        if (target) {
          const speed = Math.hypot(b.vx, -b.vy) || player.bulletSpeed;
          const currentAngle = Math.atan2(-b.vy, b.vx);
          const desiredAngle = Math.atan2(target.y - by, target.x - bx);
          let diff = desiredAngle - currentAngle;
          while (diff > Math.PI) diff -= Math.PI * 2;
          while (diff < -Math.PI) diff += Math.PI * 2;
          const maxTurn = 0.045 + player.homingLevel * 0.022;
          const newAngle = currentAngle + Math.max(-maxTurn, Math.min(maxTurn, diff));
          b.vx = Math.cos(newAngle) * speed;
          b.vy = -Math.sin(newAngle) * speed;
        }
      }

      b.x += b.vx;
      b.y -= b.vy;

      ctx.fillStyle = b.homing ? "#80ffea" : (b.fromPet ? "#ff80ab" : "#ffff00");
      ctx.fillRect(b.x, b.y, b.width, b.height);

      if (b.y < -25 || b.y > canvas.height + 25 || b.x < -25 || b.x > canvas.width + 25) {
        bullets.splice(i, 1);
      }
    }
  }

  // ボス行動＆描画
  function updateAndDrawBoss() {
    if (!boss) return;

    boss.x += boss.vx;
    if (boss.x <= 10 || boss.x + boss.width >= canvas.width - 10) boss.vx *= -1;

    const cx = boss.x + boss.width / 2;
    const cy = boss.y + boss.height / 2;

    boss.shootTimer++;
    boss.subPatternTimer++;

    if (boss.type === "mid") {
      if (boss.subPatternTimer >= 360) boss.subPatternTimer = 0;
      const isSpreadMode = (boss.subPatternTimer >= 180 && boss.subPatternTimer < 240);

      if (isSpreadMode) {
        if (boss.shootTimer >= 10) {
          boss.shootTimer = 0;
          const bulletCount = 16;
          for (let i = 0; i < bulletCount; i++) {
            const angle = (Math.PI * 2 * i) / bulletCount + (boss.subPatternTimer * 0.05);
            enemyBullets.push({ x: cx - 6, y: cy - 6, width: 12, height: 12, vx: Math.cos(angle) * 3.2, vy: Math.sin(angle) * 3.2, damage: 1, color: "#00ffff" });
          }
        }
      } else if (boss.shootTimer >= 42) {
        boss.shootTimer = 0;
        boss.patternCount++;
        const originX = cx - 4.5, originY = boss.y + boss.height;
        const speeds = (boss.patternCount % 3 === 0)
          ? [{ vx: -3.2, vy: 4.5 }, { vx: -1.6, vy: 5.2 }, { vx: 0, vy: 5.8 }, { vx: 1.6, vy: 5.2 }, { vx: 3.2, vy: 4.5 }]
          : [{ vx: -2.0, vy: 5.0 }, { vx: 0, vy: 5.6 }, { vx: 2.0, vy: 5.0 }];
        for (const s of speeds) {
          enemyBullets.push({ x: originX, y: originY, width: 9, height: 9, vx: s.vx, vy: s.vy, damage: 1, color: "#ff55aa" });
        }
      }

      if (!drawSpriteIfReady(enemySprites.midBoss, boss.x, boss.y, boss.width, boss.height)) {
        drawEnemyIllustration(boss);
      }

      const barWidth = 140, barX = (canvas.width - barWidth) / 2;
      ctx.fillStyle = "#333";
      ctx.fillRect(barX, boss.y - 16, barWidth, 8);
      ctx.fillStyle = isSpreadMode ? "#00ffff" : "#c77dff";
      ctx.fillRect(barX, boss.y - 16, barWidth * Math.max(0, boss.hp / boss.maxHp), 8);

      ctx.fillStyle = isSpreadMode ? "#00ffff" : "#e0aaff";
      ctx.font = "bold 12px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(boss.name + (isSpreadMode ? " [RADIAL BURST]" : "") + "  HP: " + Math.max(0, boss.hp) + " / " + boss.maxHp, canvas.width / 2, boss.y - 22);
    } else {
      boss.winderAngle += 0.045;
      if (boss.subPatternTimer >= 360) boss.subPatternTimer = 0;
      const mode = Math.floor(boss.subPatternTimer / 120);

      if (mode === 0 && boss.shootTimer >= 26) {
        boss.shootTimer = 0;
        boss.patternCount++;
        const originX = cx - 6, originY = boss.y + boss.height;
        const speeds = (boss.patternCount % 3 === 0)
          ? [{ vx: -4.2, vy: 6.2 }, { vx: -2.2, vy: 7.0 }, { vx: 0, vy: 7.8 }, { vx: 2.2, vy: 7.0 }, { vx: 4.2, vy: 6.2 }]
          : [{ vx: -2.8, vy: 6.8 }, { vx: 0, vy: 7.5 }, { vx: 2.8, vy: 6.8 }];
        for (const s of speeds) {
          enemyBullets.push({ x: originX, y: originY, width: 12, height: 12, vx: s.vx, vy: s.vy, damage: 2, color: "#ff2a55" });
        }
      } else if (mode === 1 && boss.shootTimer >= 6) {
        boss.shootTimer = 0;
        for (let i = 0; i < 2; i++) {
          const angle = boss.winderAngle + i * Math.PI;
          enemyBullets.push({
            x: cx - 6, y: cy - 6, width: 10, height: 10,
            vx: Math.cos(angle) * 5.5, vy: Math.sin(angle) * 5.5 + 1.2,
            damage: 2, color: i === 0 ? "#ff1744" : "#00e5ff"
          });
        }
      } else if (mode === 2 && boss.shootTimer >= 18) {
        boss.shootTimer = 0;
        const angle = Math.atan2((player.y + player.height / 2) - cy, (player.x + player.width / 2) - cx);
        enemyBullets.push({
          x: cx - 6, y: cy - 6, width: 14, height: 14,
          vx: Math.cos(angle) * 8.5, vy: Math.sin(angle) * 8.5,
          damage: 2, color: "#ffff00"
        });
      }

      if (!drawSpriteIfReady(enemySprites.finalBoss, boss.x, boss.y, boss.width, boss.height)) {
        drawEnemyIllustration(boss);
      }

      const barWidth = 170, barX = (canvas.width - barWidth) / 2;
      ctx.fillStyle = "#333";
      ctx.fillRect(barX, boss.y - 24, barWidth, 8);
      ctx.fillStyle = "#ff4466";
      ctx.fillRect(barX, boss.y - 24, barWidth * Math.max(0, boss.hp / boss.maxHp), 8);

      const modeNames = ["NORMAL BARRAGE", "DOUBLE WINDER", "SNIPER RUSH"];
      ctx.fillStyle = "#ff7799";
      ctx.font = "bold 12px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(boss.name + " [" + modeNames[mode] + "]  HP: " + Math.max(0, boss.hp) + " / " + boss.maxHp, canvas.width / 2, boss.y - 30);
    }

    for (let j = bullets.length - 1; j >= 0; j--) {
      if (isColliding(bullets[j], boss)) {
        boss.hp -= bullets[j].damage;
        bullets.splice(j, 1);

        if (boss.type === "mid") {
          score += 30;
          if (boss.hp <= 0) {
            spawnExplosion(boss.x + boss.width / 2, boss.y + boss.height / 2, "mid", 2.1);
            score += 1000;
            boss = null;
            enemyBullets = [];
            clearStickInput();
            generateChoices();
            gameState = "choosing";
            return;
          }
        } else if (boss.type === "final") {
          score += 50;
          if (boss.hp <= 0) {
            spawnExplosion(boss.x + boss.width / 2, boss.y + boss.height / 2, "final", 2.8);
            score += 3000;
            boss = null;
            enemyBullets = [];
            triggerVictory();
            return;
          }
        }
      }
    }

    if (boss && !isPlayerProtected() && isColliding(getPlayerHitbox(), boss)) {
      damagePlayer(boss.type === "final" ? 2 : 1);
    }
  }

    ctx.fillStyle = "white";
    ctx.font = "18px sans-serif";
    ctx.fillText("FINAL SCORE: " + score, canvas.width / 2, canvas.height / 2 + 6);

    ctx.fillStyle = "#ffd700";
    ctx.font = "bold 16px sans-serif";
    ctx.fillText("HIGH SCORE: " + highScore, canvas.width / 2, canvas.height / 2 + 38);

    drawBackToMenuButton("#ffd700", "#ffd700");
    drawDebugOverlay();
  }

  function drawPlayingScene() {
    updateAndDrawStarfield(false);
    drawPet();
    drawPlayerIllustration();

    for (let i = 0; i < bullets.length; i++) {
      const b = bullets[i];
      ctx.fillStyle = b.homing ? "#80ffea" : (b.fromPet ? "#ff80ab" : "#ffff00");
      ctx.fillRect(b.x, b.y, b.width, b.height);
    }
    for (let i = 0; i < items.length; i++) drawItem(items[i]);

    if (wave === 5 || wave === 10) {
      if (boss) drawEnemyIllustration(boss);
    } else {
      for (let i = 0; i < enemies.length; i++) drawEnemyIllustration(enemies[i]);
    }

    for (let i = 0; i < enemyBullets.length; i++) {
      const eb = enemyBullets[i];
      ctx.fillStyle = eb.color || "#ff55aa";
      ctx.fillRect(eb.x, eb.y, eb.width, eb.height);
    }

    updateAndDrawEffects(false);
    drawHudAndPauseButton();
  }

  // メインループ
  function loop() {
    try {
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      if (gameState === "menu") {
        drawMenuScreen();
      } else if (gameState === "encyclopedia") {
        drawEncyclopediaScreen();
      } else if (gameState === "paused") {
        drawPlayingScene();
        drawPausedScreen();
      } else if (gameState === "waveSelect") {
        drawWaveSelectScreen();
      } else if (gameState === "playing") {
        frameCount++;
        if (player.invincibleTimer > 0) player.invincibleTimer--;
        if (player.barrierTimer > 0) player.barrierTimer--;
        if (bombFlashTimer > 0) bombFlashTimer--;

        updateAndDrawStarfield(true, 1.0);

        ctx.save();
        if (screenShake > 0) {
          ctx.translate((Math.random() - 0.5) * screenShake * 1.4, (Math.random() - 0.5) * screenShake * 1.4);
          screenShake = Math.max(0, screenShake - 0.5);
        }

        updatePlayerMovement();
        if (frameCount % player.fireInterval === 0) shootBullets();
        firePetBullets();

        drawPet();
        drawPlayerIllustration();
        updateAndDrawPlayerBullets();
        updateAndDrawItems();

        if (wave === 5 || wave === 10) {
          updateAndDrawBoss();
        } else {
          spawnEnemy();
          const playerHitbox = getPlayerHitbox();
          for (let i = enemies.length - 1; i >= 0; i--) {
            const e = enemies[i];
            updateAndDrawEnemy(e);

            if (!isPlayerProtected() && isColliding(playerHitbox, e)) {
              spawnExplosion(e.x + e.width / 2, e.y + e.height / 2, e.type, e.type === "tank" ? 1.3 : 1.0);
              enemies.splice(i, 1);
              if (damagePlayer(1)) break;
              continue;
            }

            let destroyed = false;
            for (let j = bullets.length - 1; j >= 0; j--) {
              if (isColliding(bullets[j], e)) {
                e.hp -= bullets[j].damage;
                bullets.splice(j, 1);
                if (e.hp <= 0) {
                  spawnExplosion(e.x + e.width / 2, e.y + e.height / 2, e.type, e.type === "tank" ? 1.35 : 1.0);
                  maybeDropItemFromEnemy(e);
                  enemies.splice(i, 1);
                  score += e.scoreValue;
                  killsInWave++;
                  destroyed = true;
                }
                break;
              }
            }
            if (destroyed) {
              if (killsInWave >= killsToNextWave) {
                clearStickInput();
                generateChoices();
                gameState = "choosing";
                break;
              }
              continue;
            }

            if (e.y > canvas.height) enemies.splice(i, 1);
          }
        }

        const playerHitboxForBullets = getPlayerHitbox();
        for (let i = enemyBullets.length - 1; i >= 0; i--) {
          const eb = enemyBullets[i];
          eb.x += eb.vx;
          eb.y += eb.vy;
          ctx.fillStyle = eb.color || "#ff55aa";
          ctx.fillRect(eb.x, eb.y, eb.width, eb.height);

          if (!isPlayerProtected() && isColliding(playerHitboxForBullets, eb)) {
            const hitDamage = eb.damage || 1;
            enemyBullets.splice(i, 1);
            if (damagePlayer(hitDamage)) break;
            continue;
          }

          if (eb.y > canvas.height + 20 || eb.x < -20 || eb.x > canvas.width + 20) {
            enemyBullets.splice(i, 1);
          }
        }

        updateAndDrawEffects(true);
        ctx.restore();

        if (bombFlashTimer > 0) {
          ctx.save();
          ctx.fillStyle = "rgba(255, 245, 200, " + (bombFlashTimer / 18) * 0.45 + ")";
          ctx.fillRect(0, 0, canvas.width, canvas.height);
          ctx.restore();
        }

        drawHudAndPauseButton();
      } else if (gameState === "choosing") {
        drawChoosingScreen();
      } else if (gameState === "gameover") {
        drawGameOverScreen();
      } else if (gameState === "victory") {
        drawVictoryScreen();
      }
    } catch (err) {
      ctx.fillStyle = "#05050a";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ff6688";
      ctx.font = "bold 14px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("描画エラー", canvas.width / 2, canvas.height / 2 - 10);
      ctx.fillStyle = "#cccccc";
      ctx.font = "12px sans-serif";
      ctx.fillText(String(err && err.message ? err.message : err), canvas.width / 2, canvas.height / 2 + 14);
    }

    requestAnimationFrame(loop);
  }

  loop();
</script>
</body>
</html>
