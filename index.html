<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<title>シンプル・シューティング</title>
<style>
  body {
    background-color: #111;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    font-family: sans-serif;
  }
  canvas {
    background-color: #000;
    border: 2px solid #00ffcc;
    box-shadow: 0 0 15px rgba(0, 255, 204, 0.3);
  }
  p {
    margin-top: 10px;
    font-size: 14px;
    color: #aaa;
  }
</style>
</head>
<body>

  <canvas id="gameCanvas" width="400" height="600"></canvas>
  <p>操作方法：【←】【→】キーで移動 ／ 【スペース】キーで弾を撃つ ／ 【Enter】でリスタート</p>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  // ゲームの状態
  let score = 0;
  let isGameOver = false;

  // プレイヤー（自機）の設定
  const player = {
    x: canvas.width / 2 - 20,
    y: canvas.height - 60,
    width: 40,
    height: 40,
    speed: 5,
    color: "#00ffcc"
  };

  // 弾と敵のリスト
  let bullets = [];
  let enemies = [];

  // キー入力の記録
  const keys = {};
  window.addEventListener("keydown", (e) => {
    keys[e.code] = true;
    // スペースキーで弾を撃つ
    if (e.code === "Space" && !isGameOver) {
      bullets.push({
        x: player.x + player.width / 2 - 3,
        y: player.y,
        width: 6,
        height: 15,
        speed: 8
      });
    }
    // Enterキーでリスタート
    if (e.code === "Enter" && isGameOver) {
      resetGame();
    }
  });
  window.addEventListener("keyup", (e) => keys[e.code] = false);

  // ゲームのリセット
  function resetGame() {
    score = 0;
    isGameOver = false;
    player.x = canvas.width / 2 - 20;
    bullets = [];
    enemies = [];
    loop();
  }

  // 敵をランダムに発生させる
  function spawnEnemy() {
    if (Math.random() < 0.03) { // 出現率
      enemies.push({
        x: Math.random() * (canvas.width - 35),
        y: -35,
        width: 35,
        height: 35,
        speed: 2 + Math.random() * 2 // 速度もランダム
      });
    }
  }

  // 当たり判定の計算
  function isColliding(a, b) {
    return a.x < b.x + b.width &&
           a.x + a.width > b.x &&
           a.y < b.y + b.height &&
           a.y + a.height > b.y;
  }

  // 画面の更新と描画（ゲームのメインループ）
  function loop() {
    if (isGameOver) {
      ctx.fillStyle = "rgba(0, 0, 0, 0.7)";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#ff4444";
      ctx.font = "bold 36px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 20);
      ctx.fillStyle = "white";
      ctx.font = "20px sans-serif";
      ctx.fillText("Score: " + score, canvas.width / 2, canvas.height / 2 + 20);
      ctx.font = "16px sans-serif";
      ctx.fillText("Enterキーで再挑戦", canvas.width / 2, canvas.height / 2 + 60);
      return;
    }

    // 画面を一度クリア
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    // プレイヤーの移動
    if (keys["ArrowLeft"] && player.x > 0) player.x -= player.speed;
    if (keys["ArrowRight"] && player.x < canvas.width - player.width) player.x += player.speed;

    // プレイヤーの描画（三角形の宇宙船風）
    ctx.fillStyle = player.color;
    ctx.beginPath();
    ctx.moveTo(player.x + player.width / 2, player.y);
    ctx.lineTo(player.x, player.y + player.height);
    ctx.lineTo(player.x + player.width, player.y + player.height);
    ctx.closePath();
    ctx.fill();

    // 弾の移動と描画
    ctx.fillStyle = "#ffff00";
    for (let i = bullets.length - 1; i >= 0; i--) {
      let b = bullets[i];
      b.y -= b.speed;
      ctx.fillRect(b.x, b.y, b.width, b.height);
      if (b.y < 0) bullets.splice(i, 1); // 画面外に出たら消す
    }

    // 敵の生成・移動・描画
    spawnEnemy();
    ctx.fillStyle = "#ff4466";
    for (let i = enemies.length - 1; i >= 0; i--) {
      let e = enemies[i];
      e.y += e.speed;
      ctx.fillRect(e.x, e.y, e.width, e.height);

      // プレイヤーと敵がぶつかったらゲームオーバー
      if (isColliding(player, e)) {
        isGameOver = true;
      }

      // 弾と敵の当たり判定
      for (let j = bullets.length - 1; j >= 0; j--) {
        if (isColliding(bullets[j], e)) {
          enemies.splice(i, 1);
          bullets.splice(j, 1);
          score += 100;
          break;
        }
      }

      // 画面下まで行ったら消す
      if (e && e.y > canvas.height) enemies.splice(i, 1);
    }

    // スコア表示
    ctx.fillStyle = "white";
    ctx.font = "20px sans-serif";
    ctx.textAlign = "left";
    ctx.fillText("SCORE: " + score, 15, 30);

    // 次のフレームを予約（1秒間に約60回繰り返す）
    requestAnimationFrame(loop);
  }

  // ゲーム開始
  loop();
</script>
</body>
</html>
