<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ローグライク・シューティング</title>
<style>
  body {
    background-color: #111;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    overflow: hidden;
    touch-action: none;
    font-family: sans-serif;
  }
  canvas {
    background-color: #05050a;
    border: 2px solid #00ffcc;
    max-width: 95vw;
    max-height: 82vh;
  }
  p {
    margin-top: 8px;
    font-size: 13px;
    color: #aaa;
  }
</style>
</head>
<body>

  <canvas id="gameCanvas" width="360" height="540"></canvas>
  <p>タッチ＆スライド / 矢印キー・WASD で移動！（Spaceでボム / Pで一時停止）</p>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  const HIGH_SCORE_KEY = "roguelike_shooting_highscore_v1";
  const PLAYER_INVINCIBLE_DURATION = 90; // 約1.5秒（60fps換算）
  const BARRIER_ITEM_DURATION = 300; // バリアアイテムの無敵時間（約5秒）
  const BASE_PLAYER_SPEED = 2.2;
  const MAX_WAVE = 10;
  const MAX_BOMBS = 3;

  // BGM設定（メニュー用とプレイ用で別々の曲を設定できます）
  const menuBgm = new Audio("./menu_bgm.mp3");
  menuBgm.loop = true;
  menuBgm.volume = 0.45;

  const gameBgm = new Audio("./bgm.mp3");
  gameBgm.loop = true;
  gameBgm.volume = 0.45;

  let isMuted = false;

  // 制作者向けデバッグモード状態
  let isDebugMode = false;
  let isGodMode = false;
  let secretTapCount = 0;
  let lastSecretTapTime = 0;

  function getTargetBgm() {
    return gameState === "menu" ? menuBgm : gameBgm;
  }

  function syncBgmPlayback() {
    const target = getTargetBgm();
    const other = target === menuBgm ? gameBgm : menuBgm;

    if (!other.paused) {
      other.pause();
    }

    if (isMuted) {
      target.muted = true;
      return;
    }

    target.muted = false;
    if (target.paused) {
      target.play().catch(() => {});
    }
  }

  function ensureBgmPlaying() {
    syncBgmPlayback();
  }

  function toggleMute() {
    isMuted = !isMuted;
    menuBgm.muted = isMuted;
    gameBgm.muted = isMuted;
    syncBgmPlayback();
  }

  // 外部画像（ドット絵PNG）の読み込み設定
  const playerSprite = new Image();
  playerSprite.src = "./player.png";

  const enemySprites = {
    normal: new Image(),
    zigzag: new Image(),
    dash: new Image(),
    tank: new Image(),
    weave: new Image(),
    erratic: new Image(),
    midBoss: new Image(),
    finalBoss: new Image()
  };

  enemySprites.normal.src = "./enemy_normal.png";
  enemySprites.zigzag.src = "./enemy_zigzag.png";
  enemySprites.dash.src = "./enemy_dash.png";
  enemySprites.tank.src = "./enemy_tank.png";
  enemySprites.weave.src = "./enemy_weave.png";
  enemySprites.erratic.src = "./enemy_erratic.png";
  enemySprites.midBoss.src = "./boss_mid.png";
  enemySprites.finalBoss.src = "./boss_final.png";

  function drawSpriteIfReady(img, x, y, width, height) {
    if (img && img.complete && img.naturalWidth > 0) {
      ctx.save();
      ctx.imageSmoothingEnabled = false;
      ctx.drawImage(img, x, y, width, height);
      ctx.restore();
      return true;
    }
    return false;
  }

  function loadHighScore() {
    try {
      const saved = localStorage.getItem(HIGH_SCORE_KEY);
      const parsed = saved ? parseInt(saved, 10) : 0;
      return Number.isFinite(parsed) && parsed > 0 ? parsed : 0;
    } catch (e) {
      return 0;
    }
  }

  function saveHighScoreIfNeeded() {
    if (isDebugMode) return;
    if (score > highScore) {
      highScore = score;
      try {
        localStorage.setItem(HIGH_SCORE_KEY, String(highScore));
      } catch (e) {}
    }
  }

  function resetHighScore() {
    highScore = 0;
    try {
      localStorage.removeItem(HIGH_SCORE_KEY);
    } catch (e) {}
    confirmReset = false;
  }

  // ゲーム状態: "menu", "playing", "paused", "choosing", "waveSelect", "gameover", "victory"
  let gameState = "menu";
  let confirmReset = false;
  let score = 0;
  let highScore = loadHighScore();
  let wave = 1;
  let killsInWave = 0;
  let killsToNextWave = 10;
  let frameCount = 0;
  let bombFlashTimer = 0;

  // 流れる星空の背景（遠景・中景・近景の3層パララックス）
  const STAR_COLORS = ["#ffffff", "#cceeff", "#aaddff", "#fff5cc", "#80ffea"];
  const stars = [];

  function initStarfield() {
    stars.length = 0;
    const layers = [
      { count: 34, minSize: 1.0, maxSize: 1.4, minSpeed: 0.45, maxSpeed: 0.85, minAlpha: 0.28, maxAlpha: 0.52 },
      { count: 20, minSize: 1.6, maxSize: 2.2, minSpeed: 1.25, maxSpeed: 1.95, minAlpha: 0.50, maxAlpha: 0.78 },
      { count: 11, minSize: 2.4, maxSize: 3.1, minSpeed: 2.40, maxSpeed: 3.50, minAlpha: 0.75, maxAlpha: 1.00 }
    ];

    for (const layer of layers) {
      for (let i = 0; i < layer.count; i++) {
        stars.push({
          x: Math.random() * canvas.width,
          y: Math.random() * canvas.height,
          size: layer.minSize + Math.random() * (layer.maxSize - layer.minSize),
          speed: layer.minSpeed + Math.random() * (layer.maxSpeed - layer.minSpeed),
          alpha: layer.minAlpha + Math.random() * (layer.maxAlpha - layer.minAlpha),
          color: STAR_COLORS[Math.floor(Math.random() * STAR_COLORS.length)],
          twinklePhase: Math.random() * Math.PI * 2
        });
      }
    }
  }

  function updateAndDrawStarfield(updatePhysics = true, speedMultiplier = 1.0) {
    ctx.fillStyle = "#05050a";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    for (let i = 0; i < stars.length; i++) {
      const s = stars[i];
      if (updatePhysics) {
        s.y += s.speed * speedMultiplier;
        s.twinklePhase += 0.04;
        if (s.y > canvas.height + 4) {
          s.y = -4;
          s.x = Math.random() * canvas.width;
        }
      }

      const twinkle = 0.85 + Math.sin(s.twinklePhase) * 0.15;
      ctx.save();
      ctx.globalAlpha = Math.min(1, s.alpha * twinkle);
      ctx.fillStyle = s.color;
      ctx.fillRect(Math.floor(s.x), Math.floor(s.y), Math.ceil(s.size), Math.ceil(s.size));
      ctx.restore();
    }
  }

  initStarfield();

  // 撃破エフェクト（火花パーティクル・衝撃波リング・画面揺れ）
  let particles = [];
  let shockwaves = [];
  let screenShake = 0;

  function getExplosionPalette(type) {
    if (type === "zigzag") return ["#e040fb", "#ea80fc", "#00ffcc", "#ffffff"];
    if (type === "dash") return ["#ff6d00", "#ffab00", "#fff59d", "#ffffff"];
    if (type === "tank") return ["#78909c", "#90a4ae", "#cfd8dc", "#ffffff"];
    if (type === "weave") return ["#00e676", "#00c853", "#69f0ae", "#ffffff"];
    if (type === "erratic") return ["#00b0ff", "#40c4ff", "#18ffff", "#ffffff"];
    if (type === "mid") return ["#e040fb", "#00ffcc", "#ffd740", "#ffffff"];
    if (type === "final") return ["#ff1744", "#ff9100", "#ffd600", "#00ffcc", "#ffffff"];
    if (type === "item_heart") return ["#ff4081", "#ff80ab", "#ffffff"];
    if (type === "item_barrier") return ["#00e5ff", "#84ffff", "#ffffff"];
    if (type === "item_bomb") return ["#ff9100", "#ffd740", "#ffffff"];
    return ["#ff5252", "#ffab40", "#fff59d", "#ffffff"];
  }

  function spawnExplosion(x, y, type = "normal", scale = 1) {
    const palette = getExplosionPalette(type);
    const particleCount = Math.round(14 * scale);

    for (let i = 0; i < particleCount; i++) {
      const angle = (Math.PI * 2 * i) / particleCount + (Math.random() - 0.5) * 0.45;
      const speed = (1.6 + Math.random() * 3.4) * Math.sqrt(scale);
      const maxLife = Math.round((16 + Math.random() * 12) * Math.min(1.8, scale));
      particles.push({
        x: x,
        y: y,
        vx: Math.cos(angle) * speed,
        vy: Math.sin(angle) * speed,
        size: (2.2 + Math.random() * 2.8) * Math.min(1.6, scale),
        color: palette[Math.floor(Math.random() * palette.length)],
        life: maxLife,
        maxLife: maxLife
      });
    }

    shockwaves.push({
      x: x,
      y: y,
      radius: 4 * scale,
      maxRadius: 28 * scale,
      color: palette[0],
      life: Math.round(14 * Math.min(1.6, scale)),
      maxLife: Math.round(14 * Math.min(1.6, scale))
    });

    if (scale >= 2.0) {
      shockwaves.push({
        x: x,
        y: y,
        radius: 2,
        maxRadius: 42 * scale,
        color: "#ffffff",
        life: 22,
        maxLife: 22
      });
    }

    screenShake = Math.max(screenShake, Math.min(8, Math.round(2.5 * scale)));
  }

  function updateAndDrawEffects(updatePhysics = true) {
    for (let i = shockwaves.length - 1; i >= 0; i--) {
      const sw = shockwaves[i];
      if (updatePhysics) {
        sw.life--;
        const progress = 1 - Math.max(0, sw.life / sw.maxLife);
        sw.radius = 4 + (sw.maxRadius - 4) * (1 - Math.pow(1 - progress, 2));
      }
      if (sw.life <= 0) {
        shockwaves.splice(i, 1);
        continue;
      }
      ctx.save();
      ctx.globalAlpha = Math.max(0, sw.life / sw.maxLife) * 0.85;
      ctx.strokeStyle = sw.color;
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(sw.x, sw.y, sw.radius, 0, Math.PI * 2);
      ctx.stroke();
      ctx.restore();
    }

    for (let i = particles.length - 1; i >= 0; i--) {
      const p = particles[i];
      if (updatePhysics) {
        p.x += p.vx;
        p.y += p.vy;
        p.vx *= 0.92;
        p.vy *= 0.92;
        p.life--;
      }
      if (p.life <= 0) {
        particles.splice(i, 1);
        continue;
      }
      const alpha = Math.max(0, p.life / p.maxLife);
      const drawSize = p.size * (0.4 + 0.6 * alpha);
      ctx.save();
      ctx.globalAlpha = alpha;
      ctx.fillStyle = p.color;
      ctx.fillRect(p.x - drawSize / 2, p.y - drawSize / 2, drawSize, drawSize);
      ctx.restore();
    }
  }

  const player = {
    x: canvas.width / 2 - 20,
    y: canvas.height - 75,
    width: 40,
    height: 40,
    speed: BASE_PLAYER_SPEED,
    hp: 3,
    maxHp: 3,
    invincibleTimer: 0,
    barrierTimer: 0,
    bombs: 1,
    homingLevel: 0,
    fireInterval: 16,
    bulletCount: 1,
    bulletSpeed: 9,
    bulletDamage: 1,
    bulletWidth: 6,
    bulletHeight: 14,
    color: "#00ffcc"
  };

  // イラストの中心胴体（コア）に合わせた少し小さめの当たり判定
  function getPlayerHitbox() {
    const hitW = Math.round(player.width * 0.6);
    const hitH = Math.round(player.height * 0.65);
    return {
      x: player.x + (player.width - hitW) / 2,
      y: player.y + (player.height - hitH) / 2 + 2,
      width: hitW,
      height: hitH
    };
  }

  function isPlayerProtected() {
    return isGodMode || player.invincibleTimer > 0 || player.barrierTimer > 0;
  }

  function damagePlayer(amount = 1) {
    if (isPlayerProtected()) return false;
    player.hp -= amount;
    player.invincibleTimer = PLAYER_INVINCIBLE_DURATION;
    spawnExplosion(player.x + player.width / 2, player.y + player.height / 2, "dash", 0.9);
    if (player.hp <= 0) {
      player.hp = 0;
      triggerGameOver();
    }
    return true;
  }

  function useBomb() {
    if (gameState !== "playing") return false;
    if (player.bombs <= 0) return false;

    player.bombs--;
    bombFlashTimer = 18;
    player.invincibleTimer = Math.max(player.invincibleTimer, 60);
    screenShake = 8;

    const px = player.x + player.width / 2;
    const py = player.y + player.height / 2;
    spawnExplosion(px, py, "item_bomb", 2.8);

    // 敵弾を全消去
    enemyBullets = [];

    // 画面内の通常敵を撃破
    for (let i = enemies.length - 1; i >= 0; i--) {
      const e = enemies[i];
      spawnExplosion(e.x + e.width / 2, e.y + e.height / 2, e.type, e.type === "tank" ? 1.35 : 1.0);
      score += e.scoreValue;
      killsInWave++;
      enemies.splice(i, 1);
    }

    // ボスがいる場合は大ダメージ
    if (boss) {
      const bombDamage = boss.type === "mid" ? 28 : 95;
      boss.hp -= bombDamage;
      spawnExplosion(boss.x + boss.width / 2, boss.y + boss.height / 2, "item_bomb", 1.8);

      if (boss.type === "mid" && boss.hp <= 0) {
        spawnExplosion(boss.x + boss.width / 2, boss.y + boss.height / 2, "mid", 2.1);
        score += 1000;
        boss = null;
        clearStickInput();
        generateChoices();
        gameState = "choosing";
        return true;
      } else if (boss.type === "final" && boss.hp <= 0) {
        spawnExplosion(boss.x + boss.width / 2, boss.y + boss.height / 2, "final", 2.8);
        score += 3000;
        boss = null;
        triggerVictory();
        return true;
      }
    } else if (killsInWave >= killsToNextWave) {
      clearStickInput();
      generateChoices();
      gameState = "choosing";
    }

    return true;
  }

  function drawPlayerIllustration() {
    const hasBarrier = player.barrierTimer > 0;
    const isBlinking = !isGodMode && !hasBarrier && player.invincibleTimer > 0 && Math.floor(player.invincibleTimer / 3) % 2 !== 0;
    if (isBlinking) {
      return;
    }

    ctx.save();
    if (!hasBarrier && (player.invincibleTimer > 0 || isGodMode)) {
      ctx.globalAlpha = isGodMode ? 0.92 : 0.72;
    }

    if (!drawSpriteIfReady(playerSprite, player.x, player.y, player.width, player.height)) {
      const cx = player.x + player.width / 2;
      const flameFlicker = (frameCount % 4) * 2;

      // 推進ノズルの噴射炎
      ctx.fillStyle = "#ff9100";
      ctx.beginPath();
      ctx.moveTo(cx - 7, player.y + player.height - 2);
      ctx.lineTo(cx, player.y + player.height + 9 + flameFlicker);
      ctx.lineTo(cx + 7, player.y + player.height - 2);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#fff59d";
      ctx.beginPath();
      ctx.moveTo(cx - 3.5, player.y + player.height - 2);
      ctx.lineTo(cx, player.y + player.height + 4 + Math.floor(flameFlicker / 2));
      ctx.lineTo(cx + 3.5, player.y + player.height - 2);
      ctx.closePath();
      ctx.fill();

      // 主翼・機体シルエット
      ctx.fillStyle = "#00897b";
      ctx.beginPath();
      ctx.moveTo(cx, player.y + 8);
      ctx.lineTo(player.x + player.width + 2, player.y + player.height - 4);
      ctx.lineTo(cx + 9, player.y + player.height - 7);
      ctx.lineTo(cx - 9, player.y + player.height - 7);
      ctx.lineTo(player.x - 2, player.y + player.height - 4);
      ctx.closePath();
      ctx.fill();

      // メインボディ
      ctx.fillStyle = player.color;
      ctx.beginPath();
      ctx.moveTo(cx, player.y);
      ctx.lineTo(cx + 11, player.y + player.height - 6);
      ctx.lineTo(cx, player.y + player.height - 10);
      ctx.lineTo(cx - 11, player.y + player.height - 6);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = "#b2fff2";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // コックピット（キャノピー）
      ctx.fillStyle = "#1a237e";
      ctx.beginPath();
      ctx.ellipse(cx, player.y + 18, 4.2, 7.5, 0, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#80d8ff";
      ctx.beginPath();
      ctx.ellipse(cx - 1, player.y + 15.5, 1.8, 3.2, -0.2, 0, Math.PI * 2);
      ctx.fill();
    }

    // バリアアイテム効果中 / 無敵時間中 / GodMode中のシールドリング表示
    if (hasBarrier) {
      const cx = player.x + player.width / 2;
      const cy = player.y + player.height / 2;
      const isExpiring = player.barrierTimer < 75 && Math.floor(player.barrierTimer / 4) % 2 === 0;
      if (!isExpiring) {
        ctx.fillStyle = "rgba(0, 229, 255, 0.16)";
        ctx.beginPath();
        ctx.arc(cx, cy, 26, 0, Math.PI * 2);
        ctx.fill();

        ctx.strokeStyle = "#00e5ff";
        ctx.lineWidth = 2.5;
        ctx.beginPath();
        ctx.arc(cx, cy, 26, 0, Math.PI * 2);
        ctx.stroke();
      }
    } else if (player.invincibleTimer > 0 || isGodMode) {
      const cx = player.x + player.width / 2;
      const cy = player.y + player.height / 2;
      ctx.strokeStyle = isGodMode ? "#ffd700" : "#80ffff";
      ctx.lineWidth = 2;
      ctx.beginPath();
      ctx.arc(cx, cy, 23, 0, Math.PI * 2);
      ctx.stroke();
    }

    ctx.restore();
  }

  // キーボード入力状態（矢印キー・WASD）
  const keysPressed = {
    left: false,
    right: false,
    up: false,
    down: false
  };

  function clearKeyInput() {
    keysPressed.left = false;
    keysPressed.right = false;
    keysPressed.up = false;
    keysPressed.down = false;
  }

  // 指を止めた瞬間にピタッと止まる「相対スライド追従」操作処理
  const dragInput = {
    active: false,
    touchId: null,
    lastX: 0,
    lastY: 0,
    pendingDx: 0,
    pendingDy: 0
  };

  function clearStickInput() {
    dragInput.active = false;
    dragInput.touchId = null;
    dragInput.pendingDx = 0;
    dragInput.pendingDy = 0;
  }

  function getCanvasCoords(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    return {
      x: (clientX - rect.left) * (canvas.width / rect.width),
      y: (clientY - rect.top) * (canvas.height / rect.height)
    };
  }

  function beginStickInput(clientX, clientY, touchId = null) {
    const pos = getCanvasCoords(clientX, clientY);
    dragInput.active = true;
    dragInput.touchId = touchId;
    dragInput.lastX = pos.x;
    dragInput.lastY = pos.y;
    dragInput.pendingDx = 0;
    dragInput.pendingDy = 0;
  }

  function moveStickInput(clientX, clientY) {
    if (!dragInput.active) return;
    const pos = getCanvasCoords(clientX, clientY);
    const diffX = pos.x - dragInput.lastX;
    const diffY = pos.y - dragInput.lastY;
    dragInput.lastX = pos.x;
    dragInput.lastY = pos.y;

    // 1.0px未満のわずかな指の震えは無視してピタッと止まりやすくする
    if (Math.hypot(diffX, diffY) < 1.0) return;

    dragInput.pendingDx += diffX;
    dragInput.pendingDy += diffY;
  }

  function clampPlayerPosition() {
    if (player.x < 0) player.x = 0;
    if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
    if (player.y < 56) player.y = 56;
    if (player.y > canvas.height - player.height) player.y = canvas.height - player.height;
  }

  function updatePlayerMovement() {
    // キーボード移動（矢印キー / WASD）
    let kx = 0;
    let ky = 0;
    if (keysPressed.left) kx -= 1;
    if (keysPressed.right) kx += 1;
    if (keysPressed.up) ky -= 1;
    if (keysPressed.down) ky += 1;

    if (kx !== 0 || ky !== 0) {
      const len = Math.hypot(kx, ky);
      const keyMoveSpeed = Math.max(3.6, player.speed * 1.45);
      player.x += (kx / len) * keyMoveSpeed;
      player.y += (ky / len) * keyMoveSpeed;
      clampPlayerPosition();
    }

    // タッチ／マウス相対スライド追従移動
    if (!dragInput.active) return;
    if (dragInput.pendingDx === 0 && dragInput.pendingDy === 0) return;

    const sensitivity = 0.55 * (player.speed / BASE_PLAYER_SPEED);
    const maxStep = player.speed * 1.65;

    const moveX = Math.max(-maxStep, Math.min(maxStep, dragInput.pendingDx * sensitivity));
    const moveY = Math.max(-maxStep, Math.min(maxStep, dragInput.pendingDy * sensitivity));

    player.x += moveX;
    player.y += moveY;

    dragInput.pendingDx = 0;
    dragInput.pendingDy = 0;

    clampPlayerPosition();
  }

  let bullets = [];
  let enemies = [];
  let enemyBullets = [];
  let items = [];
  let choices = [];
  let boss = null;

  // 落下アイテム（ハート・バリア・ボム）の生成と更新
  function spawnItemAt(x, y, forcedType = null) {
    const types = ["heart", "barrier", "bomb"];
    const type = forcedType || types[Math.floor(Math.random() * types.length)];
    const size = 26;
    const clampedX = Math.max(12, Math.min(canvas.width - size - 12, x - size / 2));
    items.push({
      type: type,
      x: clampedX,
      y: y,
      width: size,
      height: size,
      vy: 1.85,
      wobblePhase: Math.random() * Math.PI * 2
    });
  }

  function maybeDropItemFromEnemy(e) {
    // 敵撃破時に約14%の確率でアイテムをドロップ
    if (Math.random() < 0.14) {
      spawnItemAt(e.x + e.width / 2, e.y + e.height / 2);
    }
  }

  function maybeSpawnSkyItem() {
    // 定期的に上空からもランダムで降ってくる（約9秒に1回ペース）
    if (frameCount > 0 && frameCount % 540 === 0) {
      const randomX = 28 + Math.random() * (canvas.width - 56);
      spawnItemAt(randomX, -28);
    }
  }

  function collectItem(item) {
    const cx = item.x + item.width / 2;
    const cy = item.y + item.height / 2;

    if (item.type === "heart") {
      if (player.hp < player.maxHp) {
        player.hp++;
      } else {
        score += 300;
      }
      spawnExplosion(cx, cy, "item_heart", 1.0);
    } else if (item.type === "barrier") {
      player.barrierTimer = BARRIER_ITEM_DURATION;
      spawnExplosion(cx, cy, "item_barrier", 1.1);
    } else if (item.type === "bomb") {
      if (player.bombs < MAX_BOMBS) {
        player.bombs++;
      } else {
        score += 300;
      }
      spawnExplosion(cx, cy, "item_bomb", 1.0);
    }
  }

  function drawItem(item) {
    const cx = item.x + item.width / 2;
    const cy = item.y + item.height / 2;
    const r = item.width / 2;

    ctx.save();
    if (item.type === "heart") {
      ctx.fillStyle = "rgba(255, 64, 129, 0.25)";
      ctx.beginPath();
      ctx.arc(cx, cy, r + 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#ff80ab";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      // ハートアイコン
      ctx.fillStyle = "#ff4081";
      ctx.beginPath();
      ctx.moveTo(cx, cy + 7);
      ctx.bezierCurveTo(cx - 10, cy, cx - 10, cy - 8, cx, cy - 3);
      ctx.bezierCurveTo(cx + 10, cy - 8, cx + 10, cy, cx, cy + 7);
      ctx.fill();
    } else if (item.type === "barrier") {
      ctx.fillStyle = "rgba(0, 229, 255, 0.24)";
      ctx.beginPath();
      ctx.arc(cx, cy, r + 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#00e5ff";
      ctx.lineWidth = 2;
      ctx.stroke();

      // シールドアイコン
      ctx.fillStyle = "#84ffff";
      ctx.beginPath();
      ctx.moveTo(cx, cy - 8);
      ctx.lineTo(cx + 7, cy - 4);
      ctx.lineTo(cx + 6, cy + 3);
      ctx.lineTo(cx, cy + 8);
      ctx.lineTo(cx - 6, cy + 3);
      ctx.lineTo(cx - 7, cy - 4);
      ctx.closePath();
      ctx.fill();
    } else if (item.type === "bomb") {
      ctx.fillStyle = "rgba(255, 145, 0, 0.26)";
      ctx.beginPath();
      ctx.arc(cx, cy, r + 2, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#ffd740";
      ctx.lineWidth = 1.8;
      ctx.stroke();

      // ボムアイコン
      ctx.fillStyle = "#ff9100";
      ctx.beginPath();
      ctx.arc(cx, cy + 2, 7, 0, Math.PI * 2);
      ctx.fill();

      ctx.strokeStyle = "#ffffff";
      ctx.lineWidth = 1.8;
      ctx.beginPath();
      ctx.moveTo(cx + 3, cy - 4);
      ctx.lineTo(cx + 7, cy - 8);
      ctx.stroke();

      ctx.fillStyle = "#ffff00";
      ctx.fillRect(cx + 6, cy - 10, 3, 3);
    }
    ctx.restore();
  }

  function updateAndDrawItems() {
    maybeSpawnSkyItem();
    const playerHitbox = getPlayerHitbox();

    for (let i = items.length - 1; i >= 0; i--) {
      const item = items[i];
      item.y += item.vy;
      item.wobblePhase += 0.08;
      item.x += Math.sin(item.wobblePhase) * 0.45;

      drawItem(item);

      if (isColliding(playerHitbox, item)) {
        collectItem(item);
        items.splice(i, 1);
        continue;
      }

      if (item.y > canvas.height + 30) {
        items.splice(i, 1);
      }
    }
  }

  function pickWeightedCard(pool) {
    const totalWeight = pool.reduce((sum, item) => sum + (item.rarity === "rare" ? 1 : 4), 0);
    let roll = Math.random() * totalWeight;
    for (const item of pool) {
      roll -= (item.rarity === "rare" ? 1 : 4);
      if (roll <= 0) return item;
    }
    return pool[pool.length - 1];
  }

  function generateChoices() {
    const eligiblePool = upgradePool.filter((u) => !u.minWave || wave >= u.minWave);
    const remaining = [...eligiblePool];
    choices = [];

    while (choices.length < 3 && remaining.length > 0) {
      const picked = pickWeightedCard(remaining);
      choices.push(picked);
      const idx = remaining.indexOf(picked);
      remaining.splice(idx, 1);
    }
  }

  function getWaveSelectRects() {
    const cols = 2;

        x: startX + col * (btnW + gapX),
        y: startY + row * (btnH + gapY),
        width: btnW,
        height: btnH
      });
    }
    return rects;

  function handleTap(clientX, clientY) {
    const { x, y } = getCanvasCoords(clientX, clientY);

    if (gameState === "menu") {
      // 隠しボタン：メニュー画面左上（0〜55, 0〜55）を3回連続タップでデバッグモード切替
      if (x >= 0 && x <= 55 && y >= 0 && y <= 55) {
        const now = Date.now();
        if (now - lastSecretTapTime < 800) {
          secretTapCount++;
        } else {
          secretTapCount = 1;
        }
        lastSecretTapTime = now;

        if (secretTapCount >= 3) {
          isDebugMode = !isDebugMode;
          isGodMode = isDebugMode;
          secretTapCount = 0;
        }
        return;
      }

      if (confirmReset) {
        if (isPointInRect(x, y, getConfirmYesButtonRect())) {
          resetHighScore();
        } else if (isPointInRect(x, y, getConfirmNoButtonRect())) {
          confirmReset = false;
        }
        return;
      }

      if (isPointInRect(x, y, getStartButtonRect())) {
        startNewGame();
      } else if (isPointInRect(x, y, getMuteButtonRect())) {
        toggleMute();
      } else if (isPointInRect(x, y, getResetButtonRect())) {
        ensureBgmPlaying();
        confirmReset = true;
      } else {
        ensureBgmPlaying();
      }
      return;
    }

    if (gameState === "paused") {
      if (isPointInRect(x, y, getResumeButtonRect())) {
        resumeGame();
      } else if (isPointInRect(x, y, getPauseRetryButtonRect())) {
        startNewGame();
      } else if (isPointInRect(x, y, getPauseMuteButtonRect())) {
        toggleMute();
      } else if (isPointInRect(x, y, getPauseMenuButtonRect())) {
        returnToMenu();
      }
      return;
    }

    if (gameState === "waveSelect") {
      if (!isDebugMode) {
        gameState = "playing";
        return;
      }
      const waveRects = getWaveSelectRects();
      for (const r of waveRects) {
        if (isPointInRect(x, y, r)) {
          enterWave(r.wave);
          break;
        }
      }
      return;
    }

    if (gameState === "gameover") {
      if (isPointInRect(x, y, getGameOverRetryButtonRect())) {
        startNewGame();
      } else if (isPointInRect(x, y, getBackToMenuButtonRect())) {
        returnToMenu();
      }
      return;
    }

    if (gameState === "victory") {
      if (isPointInRect(x, y, getBackToMenuButtonRect())) {
        returnToMenu();
      }
      return;
    }

    if (gameState === "choosing") {
      const cardRects = getCardRects();
      for (const r of cardRects) {
        if (isPointInRect(x, y, r)) {
          r.choice.apply();
          enterWave(wave + 1);
          break;
        }
      }
    }
  }

  canvas.addEventListener("touchstart", (e) => {

    if (e.touches.length === 0) return;

    if (gameState === "playing") {
      ensureBgmPlaying();
      const t = e.changedTouches[0];
      const pos = getCanvasCoords(t.clientX, t.clientY);

      if (isDebugMode) {
        const debugBtns = getDebugButtonRects();
        for (const btn of debugBtns) {
          if (isPointInRect(pos.x, pos.y, btn)) {
            handleDebugAction(btn.id);
            return;
          }
        }
      }

      if (isPointInRect(pos.x, pos.y, getPauseButtonRect())) {
        pauseGame();
        return;
      }

      if (isPointInRect(pos.x, pos.y, getBombButtonRect())) {
        useBomb();
        return;
      }

      if (!dragInput.active) {
        beginStickInput(t.clientX, t.clientY, t.identifier);
      }
    } else {
      const t = e.changedTouches[0];
      handleTap(t.clientX, t.clientY);
    }
  }, { passive: false });

  canvas.addEventListener("touchmove", (e) => {
    e.preventDefault();
    if (gameState !== "playing" || !dragInput.active) return;
    for (let i = 0; i < e.changedTouches.length; i++) {
      const t = e.changedTouches[i];
      if (t.identifier === dragInput.touchId) {
        moveStickInput(t.clientX, t.clientY);
        break;

  // キーボード操作（矢印キー・WASD移動 / Spaceでボム / P・Esc一時停止 / デバッグショートカット）
  window.addEventListener("keydown", (e) => {
    if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " "].includes(e.key)) {
      e.preventDefault();
    }

    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") {
      keysPressed.left = true;
    } else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") {
      keysPressed.right = true;
    } else if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") {
      keysPressed.up = true;
    } else if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") {
      keysPressed.down = true;
    }

    if (e.key === " " && gameState === "playing") {
      useBomb();
      return;
    }

    if (e.key === "p" || e.key === "P" || e.key === "Escape") {
      if (gameState === "playing") {
        ensureBgmPlaying();
        pauseGame();
      } else if (gameState === "paused") {
        resumeGame();
      }
      return;
    }

    if (!isDebugMode) return;
    if (gameState !== "playing" && gameState !== "choosing" && gameState !== "waveSelect") return;
    if (e.key === "i" || e.key === "I") {
      handleDebugAction("god");
    } else if (e.key === "v" || e.key === "V") {
      handleDebugAction("waveSelect");
    } else if (e.key === "b" || e.key === "B") {
      handleDebugAction("boss");
    } else if (e.key === "c" || e.key === "C") {
      handleDebugAction("card");
    }
  });

  window.addEventListener("keyup", (e) => {
    if (e.key === "ArrowLeft" || e.key === "a" || e.key === "A") {
      keysPressed.left = false;
    } else if (e.key === "ArrowRight" || e.key === "d" || e.key === "D") {
      keysPressed.right = false;
    } else if (e.key === "ArrowUp" || e.key === "w" || e.key === "W") {
      keysPressed.up = false;
    } else if (e.key === "ArrowDown" || e.key === "s" || e.key === "S") {
      keysPressed.down = false;
    }
  });

  window.addEventListener("blur", () => {
    clearKeyInput();
    clearStickInput();
    isMouseDown = false;

  function spawnEnemy() {
    const spawnChance = Math.min(0.085, 0.035 + wave * 0.006);
    if (Math.random() >= spawnChance) return;

    const availableTypes = ["normal"];
    if (wave >= 2) {
      availableTypes.push("tank");
    }
    if (wave >= 3) {
      availableTypes.push("dash");
    }
    if (wave >= 4) {
      availableTypes.push("zigzag");
    }
    if (wave >= 5) {
      availableTypes.push("weave");
    }
    if (wave >= 7) {
      availableTypes.push("erratic");
    }

    const type = availableTypes[Math.floor(Math.random() * availableTypes.length)];
    const waveBonusHp = Math.floor((wave - 1) / 2);

    if (type === "zigzag") {
      const startX = 40 + Math.random() * (canvas.width - 80);
      enemies.push({
        type: "zigzag",
        x: startX,
        baseX: startX,
        y: -38,
        width: 38,
        height: 38,
        hp: 1 + waveBonusHp,
        speed: 2.3 + wave * 0.18,
        phase: Math.random() * Math.PI * 2,
        scoreValue: 150
      });
    } else if (type === "dash") {
      enemies.push({
        type: "dash",
        x: Math.random() * (canvas.width - 32),
        y: -38,
        width: 32,
        height: 38,
        hp: 1,
        speed: 5.2 + wave * 0.35,
        scoreValue: 200
      });
    } else if (type === "tank") {
      enemies.push({
        type: "tank",
        x: Math.random() * (canvas.width - 52),
        y: -52,
        width: 52,
        height: 52,
        hp: 3 + waveBonusHp * 2,
        speed: 1.5 + wave * 0.12,
        scoreValue: 250
      });
    } else if (type === "weave") {
      const width = 40;
      const startFromLeft = Math.random() < 0.5;
      enemies.push({
        type: "weave",
        x: startFromLeft ? 4 : canvas.width - width - 4,
        y: -40,
        width: width,
        height: 38,
        hp: 2 + waveBonusHp,
        speed: 1.8 + wave * 0.14,
        vx: (startFromLeft ? 1 : -1) * (3.1 + wave * 0.18),
        scoreValue: 220
      });
    } else if (type === "erratic") {
      const width = 38;
      const initialDir = Math.random() < 0.5 ? -1 : 1;
      enemies.push({
        type: "erratic",
        x: 30 + Math.random() * (canvas.width - width - 60),
        y: -40,
        width: width,
        height: 38,
        hp: 2 + waveBonusHp,
        speed: 1.7 + wave * 0.14,
        vx: initialDir * (1.8 + Math.random() * 2.4),
        shiftTimer: 16 + Math.floor(Math.random() * 14),
        scoreValue: 280
      });
    } else {
      enemies.push({
        type: "normal",
        x: Math.random() * (canvas.width - 38),
        y: -38,
        width: 38,
        height: 38,
        hp: 1 + waveBonusHp,
        speed: 2.4 + Math.random() * 1.5 + wave * 0.22,
        scoreValue: 100
      });
    }
  }

  function drawEnemyIllustration(e) {
    if (drawSpriteIfReady(enemySprites[e.type], e.x, e.y, e.width, e.height)) {
      return;
    }

    const cx = e.x + e.width / 2;
    const cy = e.y + e.height / 2;

    if (e.type === "zigzag") {
      ctx.fillStyle = "#6a1b9a";
      ctx.beginPath();
      ctx.ellipse(cx, cy + 4, e.width * 0.48, e.height * 0.28, 0, 0, Math.PI * 2);
      ctx.fill();
      ctx.strokeStyle = "#e040fb";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = "#ea80fc";
      ctx.beginPath();
      ctx.arc(cx, cy - 3, e.width * 0.24, Math.PI, 0);
      ctx.fill();

      ctx.fillStyle = "#00ffcc";
      ctx.fillRect(cx - 10, cy + 3, 4, 4);
      ctx.fillRect(cx - 2, cy + 5, 4, 4);
      ctx.fillRect(cx + 6, cy + 3, 4, 4);
    } else if (e.type === "dash") {
      ctx.fillStyle = "#ff5500";
      ctx.beginPath();
      ctx.moveTo(cx - 5, e.y + 4);
      ctx.lineTo(cx, e.y - 6 - (frameCount % 4));
      ctx.lineTo(cx + 5, e.y + 4);
      ctx.fill();

      ctx.fillStyle = "#ffaa00";
      ctx.beginPath();
      ctx.moveTo(cx, e.y + e.height);
      ctx.lineTo(e.x, e.y + 6);
      ctx.lineTo(cx, e.y + 14);
      ctx.lineTo(e.x + e.width, e.y + 6);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#fff59d";
      ctx.beginPath();
      ctx.moveTo(cx, e.y + e.height - 4);
      ctx.lineTo(cx - 5, e.y + 12);
      ctx.lineTo(cx + 5, e.y + 12);
      ctx.closePath();
      ctx.fill();
    } else if (e.type === "tank") {
      ctx.fillStyle = "#607d8b";
      ctx.beginPath();
      ctx.moveTo(cx - 4, e.y + 3);
      ctx.lineTo(e.x + e.width - 7, e.y + 8);
      ctx.lineTo(e.x + e.width - 3, e.y + e.height * 0.56);
      ctx.lineTo(e.x + e.width - 11, e.y + e.height - 4);
      ctx.lineTo(cx - 2, e.y + e.height - 2);
      ctx.lineTo(e.x + 6, e.y + e.height - 8);
      ctx.lineTo(e.x + 3, e.y + e.height * 0.45);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "#b0bec5";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = "#455a64";
      ctx.beginPath();
      ctx.arc(cx - 7, cy - 4, 6, 0, Math.PI * 2);
      ctx.arc(cx + 8, cy + 6, 5, 0, Math.PI * 2);
      ctx.fill();

      ctx.fillStyle = "#90a4ae";
      ctx.beginPath();
      ctx.arc(cx - 3, cy + 9, 3.5, 0, Math.PI * 2);
      ctx.fill();
    } else if (e.type === "weave") {
      ctx.fillStyle = "#00695c";
      ctx.beginPath();
      ctx.moveTo(cx, e.y + e.height);
      ctx.lineTo(e.x + e.width, e.y + 12);
      ctx.lineTo(cx + 8, e.y + 4);
      ctx.lineTo(cx - 8, e.y + 4);
      ctx.lineTo(e.x, e.y + 12);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = "#00e5ff";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = "#1de9b6";
      ctx.beginPath();
      ctx.moveTo(cx, e.y + 8);
      ctx.lineTo(cx + 9, e.y + 22);
      ctx.lineTo(cx, e.y + 28);
      ctx.lineTo(cx - 9, e.y + 22);
      ctx.closePath();
      ctx.fill();

      ctx.fillStyle = "#e0f7fa";
      ctx.fillRect(cx - 2, e.y + 14, 4, 6);
    } else if (e.type === "erratic") {
      ctx.fillStyle = "#4a148c";
      ctx.beginPath();
      ctx.moveTo(cx, e.y + 2);
      ctx.lineTo(e.x + e.width - 2, cy);
      ctx.lineTo(cx, e.y + e.height - 2);
      ctx.lineTo(e.x + 2, cy);
      ctx.closePath();
      ctx.fill();
      ctx.strokeStyle = "#ff4081";
      ctx.lineWidth = 2;
      ctx.stroke();

      ctx.fillStyle = "#ffea00";
      ctx.beginPath();
      ctx.arc(cx, cy, 6, 0, Math.PI * 2);
      ctx.fill();
    } else {
      ctx.fillStyle = "#c62828";
      ctx.beginPath();
      ctx.moveTo(cx, e.y + e.height);
      ctx.lineTo(e.x, e.y + 10);
      ctx.lineTo(e.x + 8, e.y + 4);
      ctx.lineTo(e.x + e.width - 8, e.y + 4);
      ctx.lineTo(e.x + e.width, e.y + 10);
      ctx.closePath();
      ctx.fill();

      ctx.strokeStyle = "#ff8a80";
      ctx.lineWidth = 1.5;
      ctx.stroke();

      ctx.fillStyle = "#ffeb3b";
      ctx.beginPath();
      ctx.ellipse(cx, cy + 2, 5, 8, 0, 0, Math.PI * 2);
      ctx.fill();
    }
  }

  function updateAndDrawEnemy(e) {
    e.y += e.speed;

    if (e.type === "zigzag") {
      e.phase += 0.08;
      e.x = e.baseX + Math.sin(e.phase) * 45;
      if (e.x < 0) e.x = 0;
      if (e.x > canvas.width - e.width) e.x = canvas.width - e.width;
    } else if (e.type === "weave") {
      e.x += e.vx;
      if (e.x <= 2) {
        e.x = 2;
        e.vx = Math.abs(e.vx);
      } else if (e.x >= canvas.width - e.width - 2) {
        e.x = canvas.width - e.width - 2;
        e.vx = -Math.abs(e.vx);
      }
    } else if (e.type === "erratic") {
      e.shiftTimer--;
      if (e.shiftTimer <= 0) {
        e.shiftTimer = 20 + Math.floor(Math.random() * 20);
        const roll = Math.random();
        if (roll < 0.22) {
          e.vx = 0;
        } else {
          const dir = Math.random() < 0.5 ? -1 : 1;
          e.vx = dir * (1.5 + Math.random() * 3.3);
        }
      }
      e.x += e.vx;
      if (e.x <= 2) {
        e.x = 2;
        e.vx = Math.abs(e.vx || 2.5);
      } else if (e.x >= canvas.width - e.width - 2) {
        e.x = canvas.width - e.width - 2;
        e.vx = -Math.abs(e.vx || 2.5);
      }
    }

    drawEnemyIllustration(e);
  }

  function isColliding(a, b) {
    return a.x < b.x + b.width &&
           a.x + a.width > b.x &&
           a.y < b.y + b.height &&
           a.y + a.height > b.y;
  }

  function shootBullets() {
    const centerX = player.x + player.width / 2 - player.bulletWidth / 2;
    const count = player.bulletCount;
    // 拡散角度を広めに調整
    const spreadStep = 0.42;

    for (let i = 0; i < count; i++) {
      const offsetIndex = i - (count - 1) / 2;
      const angle = offsetIndex * spreadStep * 0.45;
      const vx = Math.sin(angle) * player.bulletSpeed;
      const vy = Math.cos(angle) * player.bulletSpeed;
      bullets.push({
        x: centerX,
        y: player.y,
        width: player.bulletWidth,
        height: player.bulletHeight,
        vx: vx,
        vy: vy,
        damage: player.bulletDamage,
        homing: player.homingLevel > 0
      });
    }
  }

  function findNearestTarget(bx, by) {
    let bestTarget = null;
    let bestDist = Infinity;

    if (boss) {
      const tx = boss.x + boss.width / 2;
      const ty = boss.y + boss.height / 2;
      const dist = Math.hypot(tx - bx, ty - by);
      if (dist < bestDist) {
        bestDist = dist;
        bestTarget = { x: tx, y: ty };
      }
    }

    for (let i = 0; i < enemies.length; i++) {
      const e = enemies[i];
      if (e.y + e.height < 0) continue;
      const tx = e.x + e.width / 2;
      const ty = e.y + e.height / 2;
      const dist = Math.hypot(tx - bx, ty - by);
      if (dist < bestDist) {
        bestDist = dist;
        bestTarget = { x: tx, y: ty };
      }
    }

    return bestTarget;
  }

  function updateAndDrawPlayerBullets() {
    for (let i = bullets.length - 1; i >= 0; i--) {
      const b = bullets[i];

      if (b.homing && player.homingLevel > 0) {
        const bx = b.x + b.width / 2;
        const by = b.y + b.height / 2;
        const target = findNearestTarget(bx, by);
        if (target) {
          const speed = Math.hypot(b.vx, -b.vy) || player.bulletSpeed;
          const currentAngle = Math.atan2(-b.vy, b.vx);
          const desiredAngle = Math.atan2(target.y - by, target.x - bx);
          let diff = desiredAngle - currentAngle;
          while (diff > Math.PI) diff -= Math.PI * 2;
          while (diff < -Math.PI) diff += Math.PI * 2;

          const maxTurn = 0.065 + player.homingLevel * 0.035;
          const newAngle = currentAngle + Math.max(-maxTurn, Math.min(maxTurn, diff));
          b.vx = Math.cos(newAngle) * speed;
          b.vy = -Math.sin(newAngle) * speed;
        }
      }

      b.x += b.vx;
      b.y -= b.vy;

      ctx.fillStyle = b.homing ? "#80ffea" : "#ffff00";
      ctx.fillRect(b.x, b.y, b.width, b.height);

      if (b.y < -25 || b.y > canvas.height + 25 || b.x < -25 || b.x > canvas.width + 25) {
        bullets.splice(i, 1);
      }
    }
  }

  function updateAndDrawBoss() {
    if (!boss) return;

    boss.x += boss.vx;
    if (boss.x <= 10 || boss.x + boss.width >= canvas.width - 10) {
      boss.vx *= -1;
    }

    const cx = boss.x + boss.width / 2;
    const cy = boss.y + boss.height / 2;

    boss.shootTimer++;
    boss.subPatternTimer++;

    if (boss.type === "mid") {
      if (boss.subPatternTimer >= 360) {
        boss.subPatternTimer = 0;
      }

      const isSpreadMode = (boss.subPatternTimer >= 180 && boss.subPatternTimer < 240);

      if (isSpreadMode) {
        if (boss.shootTimer >= 10) {
          boss.shootTimer = 0;
          const bulletCount = 16;
          const speed = 3.2;
          for (let i = 0; i < bulletCount; i++) {
            const angle = (Math.PI * 2 * i) / bulletCount + (boss.subPatternTimer * 0.05);
            enemyBullets.push({
              x: cx - 6,
              y: cy - 6,
              width: 12,
              height: 12,
              vx: Math.cos(angle) * speed,
              vy: Math.sin(angle) * speed,
              damage: 1,
              color: "#00ffff"
            });
          }
        }
      } else {
        if (boss.shootTimer >= 42) {
          boss.shootTimer = 0;
          boss.patternCount++;
          const originX = cx - 4.5;
          const originY = boss.y + boss.height;
          const speeds = (boss.patternCount % 3 === 0)
            ? [
                { vx: -3.2, vy: 4.5 },
                { vx: -1.6, vy: 5.2 },
                { vx: 0, vy: 5.8 },
                { vx: 1.6, vy: 5.2 },
                { vx: 3.2, vy: 4.5 }
              ]
            : [
                { vx: -2.0, vy: 5.0 },
                { vx: 0, vy: 5.6 },
                { vx: 2.0, vy: 5.0 }
              ];
          for (const s of speeds) {
            enemyBullets.push({
              x: originX,
              y: originY,
              width: 9,
              height: 9,
              vx: s.vx,
              vy: s.vy,
              damage: 1,
              color: "#ff55aa"
            });
          }
        }
      }

      if (!drawSpriteIfReady(enemySprites.midBoss, boss.x, boss.y, boss.width, boss.height)) {
        ctx.fillStyle = "#4a148c";
        ctx.beginPath();
        ctx.moveTo(boss.x, boss.y + 12);
        ctx.lineTo(boss.x + boss.width, boss.y + 12);
        ctx.lineTo(boss.x + boss.width - 14, boss.y + boss.height - 6);
        ctx.lineTo(cx, boss.y + boss.height + 6);
        ctx.lineTo(boss.x + 14, boss.y + boss.height - 6);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = "#e040fb";
        ctx.lineWidth = 2.5;
        ctx.stroke();

        ctx.fillStyle = "#7b1fa2";
        ctx.fillRect(boss.x + 8, boss.y + 20, 12, 34);
        ctx.fillRect(boss.x + boss.width - 20, boss.y + 20, 12, 34);

        ctx.fillStyle = isSpreadMode ? "#00ffff" : "#00ffcc";
        ctx.beginPath();
        ctx.arc(cx, boss.y + 28, 12, 0, Math.PI * 2);
        ctx.fill();
        ctx.fillStyle = "#ffffff";
        ctx.beginPath();
        ctx.arc(cx - 3, boss.y + 25, 4, 0, Math.PI * 2);
        ctx.fill();
      }

      const barWidth = 140;
      const barX = (canvas.width - barWidth) / 2;
      ctx.fillStyle = "#333";
      ctx.fillRect(barX, boss.y - 16, barWidth, 8);
      ctx.fillStyle = isSpreadMode ? "#00ffff" : "#c77dff";
      ctx.fillRect(barX, boss.y - 16, barWidth * Math.max(0, boss.hp / boss.maxHp), 8);

      ctx.fillStyle = isSpreadMode ? "#00ffff" : "#e0aaff";
      ctx.font = "bold 12px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(boss.name + (isSpreadMode ? " [RADIAL BURST]" : "") + "  HP: " + Math.max(0, boss.hp) + " / " + boss.maxHp, canvas.width / 2, boss.y - 22);
    } else {
      boss.winderAngle += 0.045;

      // 3つの攻撃パターン（各120フレーム = 計360フレームでループ）
      if (boss.subPatternTimer >= 360) {
        boss.subPatternTimer = 0;
      }

      const mode = Math.floor(boss.subPatternTimer / 120);

      if (mode === 0) {
        if (boss.shootTimer >= 26) {
          boss.shootTimer = 0;
          boss.patternCount++;
          const originX = cx - 6;
          const originY = boss.y + boss.height;
          const speeds = (boss.patternCount % 3 === 0)
            ? [{ vx: -4.2, vy: 6.2 }, { vx: -2.2, vy: 7.0 }, { vx: 0, vy: 7.8 }, { vx: 2.2, vy: 7.0 }, { vx: 4.2, vy: 6.2 }]
            : [{ vx: -2.8, vy: 6.8 }, { vx: 0, vy: 7.5 }, { vx: 2.8, vy: 6.8 }];
          for (const s of speeds) {
            enemyBullets.push({ x: originX, y: originY, width: 12, height: 12, vx: s.vx, vy: s.vy, damage: 2, color: "#ff2a55" });
          }
        }
      } else if (mode === 1) {
        if (boss.shootTimer >= 6) {
          boss.shootTimer = 0;
          const speed = 5.5;
          for (let i = 0; i < 2; i++) {
            const angle = boss.winderAngle + i * Math.PI;
            enemyBullets.push({
              x: cx - 6, y: cy - 6, width: 10, height: 10,
              vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed + 1.2,
              damage: 2, color: i === 0 ? "#ff1744" : "#00e5ff"
            });
          }
        }
      } else if (mode === 2) {
        if (boss.shootTimer >= 18) {
          boss.shootTimer = 0;
          const targetX = player.x + player.width / 2;
          const targetY = player.y + player.height / 2;
          const angle = Math.atan2(targetY - cy, targetX - cx);
          const speed = 8.5;
          enemyBullets.push({
            x: cx - 6, y: cy - 6, width: 14, height: 14,
            vx: Math.cos(angle) * speed, vy: Math.sin(angle) * speed,
            damage: 2, color: "#ffff00"
          });
        }
      }

      if (!drawSpriteIfReady(enemySprites.finalBoss, boss.x, boss.y, boss.width, boss.height)) {
        ctx.fillStyle = "#ff6f00";
        ctx.beginPath();
        ctx.moveTo(boss.x + 18, boss.y + 14);
        ctx.lineTo(boss.x + 2, boss.y - 12);
        ctx.lineTo(boss.x + 34, boss.y + 14);
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(boss.x + boss.width - 18, boss.y + 14);
        ctx.lineTo(boss.x + boss.width - 2, boss.y - 12);
        ctx.lineTo(boss.x + boss.width - 34, boss.y + 14);
        ctx.fill();

        ctx.fillStyle = "#880e4f";
        ctx.beginPath();
        ctx.moveTo(boss.x + 12, boss.y + 10);
        ctx.lineTo(boss.x + boss.width - 12, boss.y + 10);
        ctx.lineTo(boss.x + boss.width, boss.y + 38);
        ctx.lineTo(boss.x + boss.width - 22, boss.y + boss.height);
        ctx.lineTo(boss.x + 22, boss.y + boss.height);
        ctx.lineTo(boss.x, boss.y + 38);
        ctx.closePath();
        ctx.fill();
        ctx.strokeStyle = "#ff1744";
        ctx.lineWidth = 3;
        ctx.stroke();

        ctx.fillStyle = "#ffd600";
        ctx.beginPath();
        ctx.moveTo(cx - 34, boss.y + 28);
        ctx.lineTo(cx - 10, boss.y + 36);
        ctx.lineTo(cx - 30, boss.y + 42);
        ctx.closePath();
        ctx.fill();

        ctx.beginPath();
        ctx.moveTo(cx + 34, boss.y + 28);
        ctx.lineTo(cx + 10, boss.y + 36);
        ctx.lineTo(cx + 30, boss.y + 42);
        ctx.closePath();
        ctx.fill();

        ctx.fillStyle = "#eceff1";
        for (let k = -2; k <= 2; k++) {
          ctx.beginPath();
          ctx.moveTo(cx + k * 14 - 4, boss.y + boss.height - 8);
          ctx.lineTo(cx + k * 14, boss.y + boss.height + 5);
          ctx.lineTo(cx + k * 14 + 4, boss.y + boss.height - 8);
          ctx.fill();
        }
      }

      const barWidth = 170;
      const barX = (canvas.width - barWidth) / 2;
      ctx.fillStyle = "#333";
      ctx.fillRect(barX, boss.y - 24, barWidth, 8);
      ctx.fillStyle = "#ff4466";
      ctx.fillRect(barX, boss.y - 24, barWidth * Math.max(0, boss.hp / boss.maxHp), 8);

      const modeNames = ["NORMAL BARRAGE", "DOUBLE WINDER", "SNIPER RUSH"];
      ctx.fillStyle = "#ff7799";
      ctx.font = "bold 12px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(boss.name + " [" + modeNames[mode] + "]  HP: " + Math.max(0, boss.hp) + " / " + boss.maxHp, canvas.width / 2, boss.y - 30);
    }

    for (let j = bullets.length - 1; j >= 0; j--) {
      if (isColliding(bullets[j], boss)) {
        boss.hp -= bullets[j].damage;
        bullets.splice(j, 1);

        if (boss.type === "mid") {
          score += 30;
          if (boss.hp <= 0) {
            spawnExplosion(boss.x + boss.width / 2, boss.y + boss.height / 2, "mid", 2.1);
            score += 1000;
            boss = null;
            enemyBullets = [];
            clearStickInput();
            generateChoices();
            gameState = "choosing";
            return;
          }
        } else if (boss.type === "final") {
          score += 50;
          if (boss.hp <= 0) {
            spawnExplosion(boss.x + boss.width / 2, boss.y + boss.height / 2, "final", 2.8);
            score += 3000;
            boss = null;
            enemyBullets = [];
            triggerVictory();
            return;
          }
        }
      }
    }

    const playerHitbox = getPlayerHitbox();
    if (boss && !isPlayerProtected() && isColliding(playerHitbox, boss)) {
      damagePlayer(boss.type === "final" ? 2 : 1);
    }
  }

  function drawDebugOverlay() {
    if (!isDebugMode) return;

    ctx.save();
    ctx.fillStyle = "rgba(255, 215, 0, 0.16)";
    ctx.strokeStyle = "#ffd700";
    ctx.lineWidth = 1;
    ctx.fillRect(canvas.width / 2 - 52, 4, 104, 16);
    ctx.strokeRect(canvas.width / 2 - 52, 4, 104, 16);

    ctx.fillStyle = "#ffd700";
    ctx.font = "bold 10px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("DEBUG MODE", canvas.width / 2, 15);

    if (gameState === "playing") {
      const debugBtns = getDebugButtonRects();
      for (const btn of debugBtns) {
        const activeGod = btn.id === "god" && isGodMode;
        ctx.fillStyle = activeGod ? "#3a2e08" : "rgba(15, 25, 40, 0.9)";
        ctx.strokeStyle = activeGod ? "#ffd700" : "#00ffcc";
        ctx.lineWidth = 1.5;
        ctx.fillRect(btn.x, btn.y, btn.width, btn.height);
        ctx.strokeRect(btn.x, btn.y, btn.width, btn.height);

        ctx.fillStyle = activeGod ? "#ffd700" : "#ffffff";
        ctx.font = "bold 11px sans-serif";
        ctx.textAlign = "center";
        ctx.fillText(btn.label, btn.x + btn.width / 2, btn.y + 17);
      }
    }
    ctx.restore();
  }

  function drawWaveSelectScreen() {
    updateAndDrawStarfield(true, 0.35);

    ctx.fillStyle = "rgba(0, 0, 0, 0.80)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#ffd700";
    ctx.font = "bold 22px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("WAVE SELECT", canvas.width / 2, 66);

    ctx.fillStyle = "#cccccc";
    ctx.font = "13px sans-serif";
    ctx.fillText("移動したいWAVEをタップしてください", canvas.width / 2, 92);

    const waveRects = getWaveSelectRects();
    for (const r of waveRects) {
      const isBossWave = r.wave === 5 || r.wave === 10;
      const isCurrent = r.wave === wave;
      ctx.fillStyle = isBossWave ? "#2a1638" : "#162232";
      ctx.strokeStyle = isCurrent ? "#ffd700" : (isBossWave ? "#ff77aa" : "#00ffcc");
      ctx.lineWidth = isCurrent ? 2.5 : 1.5;
      ctx.fillRect(r.x, r.y, r.width, r.height);
      ctx.strokeRect(r.x, r.y, r.width, r.height);

      ctx.fillStyle = isCurrent ? "#ffd700" : (isBossWave ? "#ff99bb" : "#ffffff");
      ctx.font = "bold 13px sans-serif";
      ctx.textAlign = "center";
      ctx.fillText(r.label, r.x + r.width / 2, r.y + 26);
    }

    drawDebugOverlay();
  }

  function drawHudAndPauseButton() {
    ctx.fillStyle = "white";
    ctx.font = "bold 15px sans-serif";
    ctx.textAlign = "left";
    if (wave === 5) {
      ctx.fillStyle = "#c77dff";
      ctx.fillText("WAVE 5 - MID-BOSS", 12, 24);
      ctx.fillStyle = "white";
    } else if (wave === 10) {
      ctx.fillStyle = "#ff5577";
      ctx.fillText("WAVE 10 - FINAL BOSS", 12, 24);
      ctx.fillStyle = "white";
    } else {
      ctx.fillText("WAVE " + wave + " (" + killsInWave + "/" + killsToNextWave + ")", 12, 24);
    }
    ctx.fillText("SCORE: " + score, 12, 44);

    ctx.textAlign = "right";
    ctx.fillStyle = isGodMode ? "#ffd700" : "#ff6688";
    ctx.fillText(
      isGodMode ? "HP: ∞ (GOD)" : "HP: " + "♥".repeat(player.hp) + "♡".repeat(Math.max(0, player.maxHp - player.hp)),
      canvas.width - 12,
      24
    );

    const pauseBtn = getPauseButtonRect();
    ctx.fillStyle = "#162232";
    ctx.strokeStyle = "#00ffcc";
    ctx.lineWidth = 1.5;
    ctx.fillRect(pauseBtn.x, pauseBtn.y, pauseBtn.width, pauseBtn.height);
    ctx.strokeRect(pauseBtn.x, pauseBtn.y, pauseBtn.width, pauseBtn.height);

    ctx.fillStyle = "#00ffcc";
    ctx.font = "bold 11px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("|| 一時停止", pauseBtn.x + pauseBtn.width / 2, pauseBtn.y + 16);

    // 右下のボムボタン（ストック表示＆使用）
    const bombBtn = getBombButtonRect();
    const hasBomb = player.bombs > 0;
    ctx.save();
    ctx.fillStyle = hasBomb ? "rgba(42, 26, 8, 0.9)" : "rgba(20, 24, 32, 0.72)";
    ctx.strokeStyle = hasBomb ? "#ff9100" : "#556677";
    ctx.lineWidth = 2;
    ctx.fillRect(bombBtn.x, bombBtn.y, bombBtn.width, bombBtn.height);
    ctx.strokeRect(bombBtn.x, bombBtn.y, bombBtn.width, bombBtn.height);

    ctx.fillStyle = hasBomb ? "#ffd740" : "#778899";
    ctx.font = "bold 12px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("BOMB x" + player.bombs, bombBtn.x + bombBtn.width / 2, bombBtn.y + 21);
    ctx.restore();

    drawDebugOverlay();
  }

  function drawPausedScreen() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.84)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#00ffcc";
    ctx.font = "bold 28px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("PAUSED", canvas.width / 2, 160);

    ctx.fillStyle = "#cccccc";
    ctx.font = "14px sans-serif";
    ctx.fillText("WAVE " + wave + "  |  SCORE: " + score, canvas.width / 2, 190);

    const resumeBtn = getResumeButtonRect();
    ctx.fillStyle = "#00ffcc";
    ctx.fillRect(resumeBtn.x, resumeBtn.y, resumeBtn.width, resumeBtn.height);
    ctx.fillStyle = "#05050a";
    ctx.font = "bold 16px sans-serif";
    ctx.fillText("ゲームに戻る", canvas.width / 2, resumeBtn.y + 27);

    const retryBtn = getPauseRetryButtonRect();
    ctx.fillStyle = "#102826";
    ctx.strokeStyle = "#80ffea";
    ctx.lineWidth = 2;
    ctx.fillRect(retryBtn.x, retryBtn.y, retryBtn.width, retryBtn.height);
    ctx.strokeRect(retryBtn.x, retryBtn.y, retryBtn.width, retryBtn.height);
    ctx.fillStyle = "#80ffea";
    ctx.font = "bold 15px sans-serif";
    ctx.fillText("リトライ（最初から）", canvas.width / 2, retryBtn.y + 27);

    const muteBtn = getPauseMuteButtonRect();
    ctx.fillStyle = isMuted ? "#261829" : "#12242b";
    ctx.strokeStyle = isMuted ? "#ff7799" : "#00ffcc";
    ctx.lineWidth = 1.5;
    ctx.fillRect(muteBtn.x, muteBtn.y, muteBtn.width, muteBtn.height);
    ctx.strokeRect(muteBtn.x, muteBtn.y, muteBtn.width, muteBtn.height);
    ctx.fillStyle = isMuted ? "#ff88a8" : "#80ffea";
    ctx.font = "bold 14px sans-serif";
    ctx.fillText(isMuted ? "BGM: オフ（タップでオン）" : "BGM: オン（タップでオフ）", canvas.width / 2, muteBtn.y + 26);

    const menuBtn = getPauseMenuButtonRect();
    ctx.fillStyle = "#162032";
    ctx.strokeStyle = "#ffd700";
    ctx.lineWidth = 2;
    ctx.fillRect(menuBtn.x, menuBtn.y, menuBtn.width, menuBtn.height);
    ctx.strokeRect(menuBtn.x, menuBtn.y, menuBtn.width, menuBtn.height);
    ctx.fillStyle = "#ffd700";
    ctx.font = "bold 16px sans-serif";
    ctx.fillText("メニューに戻る", canvas.width / 2, menuBtn.y + 27);
  }

  function drawMenuScreen() {
    updateAndDrawStarfield(true, 0.45);

    ctx.fillStyle = "#00ffcc";
    ctx.font = "bold 24px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("ROGUELIKE", canvas.width / 2, 102);

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 28px sans-serif";
    ctx.fillText("SHOOTING", canvas.width / 2, 137);

    ctx.fillStyle = "#111927";
    ctx.strokeStyle = "#ffd700";
    ctx.lineWidth = 2;
    ctx.fillRect(55, 176, canvas.width - 110, 76);
    ctx.strokeRect(55, 176, canvas.width - 110, 76);

    ctx.fillStyle = "#ffd700";
    ctx.font = "bold 14px sans-serif";
    ctx.fillText("HIGH SCORE", canvas.width / 2, 203);

    ctx.fillStyle = "#ffffff";
    ctx.font = "bold 24px sans-serif";
    ctx.fillText(String(highScore), canvas.width / 2, 235);

    const startBtn = getStartButtonRect();
    ctx.fillStyle = "#00ffcc";
    ctx.fillRect(startBtn.x, startBtn.y, startBtn.width, startBtn.height);

    ctx.fillStyle = "#05050a";
    ctx.font = "bold 19px sans-serif";
    ctx.fillText("ゲームスタート", canvas.width / 2, startBtn.y + 31);

    const muteBtn = getMuteButtonRect();
    ctx.fillStyle = isMuted ? "#261829" : "#12242b";
    ctx.strokeStyle = isMuted ? "#ff7799" : "#00ffcc";
    ctx.lineWidth = 1.5;
    ctx.fillRect(muteBtn.x, muteBtn.y, muteBtn.width, muteBtn.height);
    ctx.strokeRect(muteBtn.x, muteBtn.y, muteBtn.width, muteBtn.height);

    ctx.fillStyle = isMuted ? "#ff88a8" : "#80ffea";
    ctx.font = "bold 13px sans-serif";
    ctx.fillText(isMuted ? "BGM: ミュート中（タップで再生）" : "BGM: 再生中（タップで消音）", canvas.width / 2, muteBtn.y + 24);

    if (confirmReset) {
      ctx.fillStyle = "#ff8899";
      ctx.font = "bold 13px sans-serif";
      ctx.fillText("ハイスコアを 0 にリセットしますか？", canvas.width / 2, 376);

      const yesBtn = getConfirmYesButtonRect();
      ctx.fillStyle = "#3a1420";
      ctx.strokeStyle = "#ff5577";
      ctx.lineWidth = 2;
      ctx.fillRect(yesBtn.x, yesBtn.y, yesBtn.width, yesBtn.height);
      ctx.strokeRect(yesBtn.x, yesBtn.y, yesBtn.width, yesBtn.height);
      ctx.fillStyle = "#ff7799";
      ctx.font = "bold 14px sans-serif";
      ctx.fillText("リセットする", yesBtn.x + yesBtn.width / 2, yesBtn.y + 25);

      const noBtn = getConfirmNoButtonRect();
      ctx.fillStyle = "#162032";
      ctx.strokeStyle = "#8899aa";
      ctx.lineWidth = 2;
      ctx.fillRect(noBtn.x, noBtn.y, noBtn.width, noBtn.height);
      ctx.strokeRect(noBtn.x, noBtn.y, noBtn.width, noBtn.height);
      ctx.fillStyle = "#e0e8f0";
      ctx.font = "bold 14px sans-serif";
      ctx.fillText("キャンセル", noBtn.x + noBtn.width / 2, noBtn.y + 25);
    } else {
      const resetBtn = getResetButtonRect();
      ctx.fillStyle = "#1a1423";
      ctx.strokeStyle = "#ff6688";
      ctx.lineWidth = 1.5;
      ctx.fillRect(resetBtn.x, resetBtn.y, resetBtn.width, resetBtn.height);
      ctx.strokeRect(resetBtn.x, resetBtn.y, resetBtn.width, resetBtn.height);

      ctx.fillStyle = "#ff88a2";
      ctx.font = "bold 14px sans-serif";
      ctx.fillText("スコアをリセット", canvas.width / 2, resetBtn.y + 24);
    }

    ctx.fillStyle = "#8899aa";
    ctx.font = "13px sans-serif";
    ctx.fillText("WAVE 10 ラスボス撃破でクリア", canvas.width / 2, 452);

    drawDebugOverlay();
  }

  function drawBackToMenuButton(borderColor, textColor) {
    const btn = getBackToMenuButtonRect();
    ctx.fillStyle = "#162032";
    ctx.strokeStyle = borderColor;
    ctx.lineWidth = 2;
    ctx.fillRect(btn.x, btn.y, btn.width, btn.height);
    ctx.strokeRect(btn.x, btn.y, btn.width, btn.height);

    ctx.fillStyle = textColor;
    ctx.font = "bold 16px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("メニューに戻る", canvas.width / 2, btn.y + 28);
  }

  function drawGameOverRetryButton() {
    const btn = getGameOverRetryButtonRect();
    ctx.fillStyle = "#00ffcc";
    ctx.fillRect(btn.x, btn.y, btn.width, btn.height);

    ctx.fillStyle = "#05050a";
    ctx.font = "bold 16px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("リトライ", canvas.width / 2, btn.y + 28);
  }

  function drawChoosingScreen() {
    updateAndDrawStarfield(true, 0.35);

    ctx.fillStyle = "rgba(0, 0, 0, 0.72)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#00ffcc";
    ctx.font = "bold 22px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("WAVE " + wave + " クリア！", canvas.width / 2, 65);

    ctx.fillStyle = "#fff";
    ctx.font = "15px sans-serif";
    ctx.fillText("強化カードを1つ選んでください", canvas.width / 2, 95);

    const cardRects = getCardRects();
    for (const r of cardRects) {
      const isRare = r.choice.rarity === "rare";
      ctx.fillStyle = isRare ? "#2a1638" : "#1a2234";
      ctx.strokeStyle = isRare ? "#ff66ff" : "#00ffcc";
      ctx.lineWidth = isRare ? 2.5 : 2;
      ctx.fillRect(r.x, r.y, r.width, r.height);
      ctx.strokeRect(r.x, r.y, r.width, r.height);

      ctx.fillStyle = isRare ? "#ff99ff" : "#ffd700";
      ctx.font = "bold 18px sans-serif";
      ctx.textAlign = "left";
      ctx.fillText(r.choice.title, r.x + 16, r.y + 32);

      ctx.fillStyle = "#e0e0e0";
      ctx.font = "14px sans-serif";
      ctx.fillText(r.choice.desc, r.x + 16, r.y + 60);
    }

    drawDebugOverlay();
  }

  function drawGameOverScreen() {
    updateAndDrawStarfield(true, 0.25);

    ctx.fillStyle = "rgba(0, 0, 0, 0.74)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#ff4444";
    ctx.font = "bold 32px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 78);

    ctx.fillStyle = "white";
    ctx.font = "18px sans-serif";
    ctx.fillText("到達 WAVE: " + wave, canvas.width / 2, canvas.height / 2 - 34);
    ctx.fillText("SCORE: " + score, canvas.width / 2, canvas.height / 2 - 4);

    ctx.fillStyle = "#ffd700";
    ctx.font = "bold 16px sans-serif";
    ctx.fillText("HIGH SCORE: " + highScore, canvas.width / 2, canvas.height / 2 + 28);

    drawGameOverRetryButton();
    drawBackToMenuButton("#00ffcc", "#00ffcc");
    drawDebugOverlay();
  }

  function drawVictoryScreen() {
    updateAndDrawStarfield(true, 0.6);

    ctx.fillStyle = "rgba(0, 10, 20, 0.76)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#ffd700";
    ctx.font = "bold 30px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("GAME CLEAR!", canvas.width / 2, canvas.height / 2 - 68);

    ctx.fillStyle = "#00ffcc";
    ctx.font = "bold 16px sans-serif";
    ctx.fillText("Ω-OVERLORD 撃破おめでとう！", canvas.width / 2, canvas.height / 2 - 32);

    ctx.fillStyle = "white";
    ctx.font = "18px sans-serif";
    ctx.fillText("FINAL SCORE: " + score, canvas.width / 2, canvas.height / 2 + 6);

    ctx.fillStyle = "#ffd700";
    ctx.font = "bold 16px sans-serif";
    ctx.fillText("HIGH SCORE: " + highScore, canvas.width / 2, canvas.height / 2 + 38);

    drawBackToMenuButton("#ffd700", "#ffd700");
    drawDebugOverlay();
  }

  function drawPlayingScene() {
    updateAndDrawStarfield(false);
    drawPlayerIllustration();

    for (let i = 0; i < bullets.length; i++) {
      const b = bullets[i];
      ctx.fillStyle = b.homing ? "#80ffea" : "#ffff00";
      ctx.fillRect(b.x, b.y, b.width, b.height);
    }

    for (let i = 0; i < items.length; i++) {
      drawItem(items[i]);
    }

    if (wave === 5 || wave === 10) {
      if (boss) {
        drawEnemyIllustration(boss);
      }
    } else {
      for (let i = 0; i < enemies.length; i++) {
        drawEnemyIllustration(enemies[i]);
      }
    }

    for (let i = 0; i < enemyBullets.length; i++) {
      const eb = enemyBullets[i];
      ctx.fillStyle = eb.color || "#ff55aa";
      ctx.fillRect(eb.x, eb.y, eb.width, eb.height);
    }

    updateAndDrawEffects(false);
    drawHudAndPauseButton();
  }

  function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (gameState === "menu") {
      drawMenuScreen();
    } else if (gameState === "paused") {
      drawPlayingScene();
      drawPausedScreen();
    } else if (gameState === "waveSelect") {
      drawWaveSelectScreen();
    } else if (gameState === "playing") {
      frameCount++;
      if (player.invincibleTimer > 0) player.invincibleTimer--;
      if (player.barrierTimer > 0) player.barrierTimer--;
      if (bombFlashTimer > 0) bombFlashTimer--;

      updateAndDrawStarfield(true, 1.0);

      ctx.save();
      if (screenShake > 0) {
        const shakeX = (Math.random() - 0.5) * screenShake * 1.4;
        const shakeY = (Math.random() - 0.5) * screenShake * 1.4;
        ctx.translate(shakeX, shakeY);
        screenShake = Math.max(0, screenShake - 0.5);
      }

      updatePlayerMovement();

      if (frameCount % player.fireInterval === 0) {
        shootBullets();
      }

      drawPlayerIllustration();
      updateAndDrawPlayerBullets();
      updateAndDrawItems();

      if (wave === 5 || wave === 10) {
        updateAndDrawBoss();
      } else {
        spawnEnemy();
        const playerHitbox = getPlayerHitbox();
        for (let i = enemies.length - 1; i >= 0; i--) {
          let e = enemies[i];
          updateAndDrawEnemy(e);

          if (!isPlayerProtected() && isColliding(playerHitbox, e)) {
            spawnExplosion(e.x + e.width / 2, e.y + e.height / 2, e.type, e.type === "tank" ? 1.3 : 1.0);
            enemies.splice(i, 1);
            if (damagePlayer(1)) {
              break;
            }
            continue;
          }

          let destroyed = false;
          for (let j = bullets.length - 1; j >= 0; j--) {
            if (isColliding(bullets[j], e)) {
              e.hp -= bullets[j].damage;
              bullets.splice(j, 1);
              if (e.hp <= 0) {
                spawnExplosion(e.x + e.width / 2, e.y + e.height / 2, e.type, e.type === "tank" ? 1.35 : 1.0);
                maybeDropItemFromEnemy(e);
                enemies.splice(i, 1);
                score += e.scoreValue;
                killsInWave++;
                destroyed = true;
              }
              break;
            }
          }
          if (destroyed) {
            if (killsInWave >= killsToNextWave) {
              clearStickInput();
              generateChoices();
              gameState = "choosing";
              break;
            }
            continue;
          }

          if (e.y > canvas.height) {
            enemies.splice(i, 1);
          }
        }
      }

      const playerHitboxForBullets = getPlayerHitbox();
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        let eb = enemyBullets[i];
        eb.x += eb.vx;
        eb.y += eb.vy;
        ctx.fillStyle = eb.color || "#ff55aa";
        ctx.fillRect(eb.x, eb.y, eb.width, eb.height);

        if (!isPlayerProtected() && isColliding(playerHitboxForBullets, eb)) {
          const hitDamage = eb.damage || 1;
          enemyBullets.splice(i, 1);
          if (damagePlayer(hitDamage)) {
            break;
          }
          continue;
        }

        if (eb.y > canvas.height + 20 || eb.x < -20 || eb.x > canvas.width + 20) {
          enemyBullets.splice(i, 1);
        }
      }

      updateAndDrawEffects(true);
      ctx.restore();

      if (bombFlashTimer > 0) {
        ctx.save();
        ctx.fillStyle = "rgba(255, 245, 200, " + (bombFlashTimer / 18) * 0.45 + ")";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.restore();
      }

      drawHudAndPauseButton();
    } else if (gameState === "choosing") {
      drawChoosingScreen();
    } else if (gameState === "gameover") {
      drawGameOverScreen();
    } else if (gameState === "victory") {
      drawVictoryScreen();
    }

    requestAnimationFrame(loop);
  }

  loop();
</script>
</body>
</html>
