　<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
<title>ローグライク・シューティング</title>
<style>
  body {
    background-color: #111;
    color: white;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    height: 100vh;
    margin: 0;
    overflow: hidden;
    touch-action: none;
    font-family: sans-serif;
  }
  canvas {
    background-color: #05050a;
    border: 2px solid #00ffcc;
    max-width: 95vw;
    max-height: 82vh;
  }
  p {
    margin-top: 8px;
    font-size: 13px;
    color: #aaa;
  }
</style>
</head>
<body>

  <canvas id="gameCanvas" width="360" height="540"></canvas>
  <p>指で移動 ／ WAVE 10で絶対倒せないボスが登場！</p>

<script>
  const canvas = document.getElementById("gameCanvas");
  const ctx = canvas.getContext("2d");

  // ゲーム状態: "playing", "choosing", "gameover"
  let gameState = "playing";
  let score = 0;
  let wave = 1;
  let killsInWave = 0;
  let killsToNextWave = 10;
  let frameCount = 0;

  // プレイヤーのステータス
  const player = {
    x: canvas.width / 2 - 20,
    y: canvas.height - 65,
    width: 40,
    height: 40,
    hp: 3,
    maxHp: 3,
    invincibleTimer: 0,
    fireInterval: 16,
    bulletCount: 1,
    bulletSpeed: 9,
    bulletDamage: 1,
    color: "#00ffcc"
  };

  let bullets = [];
  let enemies = [];
  let enemyBullets = [];
  let choices = [];
  let boss = null; // WAVE 10のボス

  const upgradePool = [
    { id: "multi", title: "拡散ショット", desc: "弾の同時発射数を +2", apply: () => { player.bulletCount = Math.min(7, player.bulletCount + 2); } },
    { id: "rapid", title: "超連射エンジン", desc: "弾の発射間隔を短縮", apply: () => { player.fireInterval = Math.max(5, Math.floor(player.fireInterval * 0.78)); } },
    { id: "power", title: "高威力プラズマ", desc: "弾の攻撃力 +1", apply: () => { player.bulletDamage += 1; } },
    { id: "heal", title: "ナノリペア", desc: "最大HP +1 ＆ 全回復", apply: () => { player.maxHp += 1; player.hp = player.maxHp; } },
    { id: "speed", title: "高速弾丸", desc: "弾のスピードUP", apply: () => { player.bulletSpeed += 2.5; } }
  ];

  function generateChoices() {
    const shuffled = [...upgradePool].sort(() => Math.random() - 0.5);
    choices = shuffled.slice(0, 3);
  }

  function getCardRects() {
    const cardW = 300;
    const cardH = 85;
    const startX = (canvas.width - cardW) / 2;
    const startY = 125;
    const gap = 18;
    return choices.map((c, idx) => ({
      x: startX,
      y: startY + idx * (cardH + gap),
      width: cardW,
      height: cardH,
      choice: c
    }));
  }

  function spawnBoss() {
    boss = {
      name: "Ω-OVERLORD",
      x: canvas.width / 2 - 55,
      y: 75,
      width: 110,
      height: 70,
      hp: 9999,
      maxHp: 9999,
      vx: 2.2,
      shootTimer: 0
    };
  }

  function movePlayer(clientX) {
    const rect = canvas.getBoundingClientRect();
    const scaleX = canvas.width / rect.width;
    const touchX = (clientX - rect.left) * scaleX;
    player.x = touchX - player.width / 2;
    if (player.x < 0) player.x = 0;
    if (player.x > canvas.width - player.width) player.x = canvas.width - player.width;
  }

  function handleTap(clientX, clientY) {
    const rect = canvas.getBoundingClientRect();
    const x = (clientX - rect.left) * (canvas.width / rect.width);
    const y = (clientY - rect.top) * (canvas.height / rect.height);

    if (gameState === "gameover") {
      resetGame();
      return;
    }

    if (gameState === "choosing") {
      const cardRects = getCardRects();
      for (const r of cardRects) {
        if (x >= r.x && x <= r.x + r.width && y >= r.y && y <= r.y + r.height) {
          r.choice.apply();
          wave++;
          killsInWave = 0;
          killsToNextWave = 10 + (wave - 1) * 5;
          bullets = [];
          enemies = [];
          enemyBullets = [];
          player.invincibleTimer = 60;
          gameState = "playing";

          // 10ウェーブ目に入ったらボス出現！
          if (wave === 10) {
            spawnBoss();
          }
          break;
        }
      }
    }
  }

  canvas.addEventListener("touchmove", (e) => {
    e.preventDefault();
    if (gameState === "playing" && e.touches.length > 0) {
      movePlayer(e.touches[0].clientX);
    }
  }, { passive: false });

  canvas.addEventListener("touchstart", (e) => {
    e.preventDefault();
    if (e.touches.length > 0) {
      const t = e.touches[0];
      if (gameState === "playing") {
        movePlayer(t.clientX);
      } else {
        handleTap(t.clientX, t.clientY);
      }
    }
  }, { passive: false });

  canvas.addEventListener("mousemove", (e) => {
    if (gameState === "playing") movePlayer(e.clientX);
  });

  canvas.addEventListener("click", (e) => {
    if (gameState !== "playing") {
      handleTap(e.clientX, e.clientY);
    }
  });

  function resetGame() {
    score = 0;
    wave = 1;
    killsInWave = 0;
    killsToNextWave = 10;
    frameCount = 0;
    boss = null;
    player.hp = 3;
    player.maxHp = 3;
    player.invincibleTimer = 0;
    player.fireInterval = 16;
    player.bulletCount = 1;
    player.bulletSpeed = 9;
    player.bulletDamage = 1;
    player.x = canvas.width / 2 - 20;
    bullets = [];
    enemies = [];
    enemyBullets = [];
    gameState = "playing";
  }

  function spawnEnemy() {
    const spawnChance = Math.min(0.08, 0.032 + wave * 0.006);
    if (Math.random() < spawnChance) {
      const hp = 1 + Math.floor((wave - 1) / 2);
      enemies.push({
        x: Math.random() * (canvas.width - 36),
        y: -36,
        width: 36,
        height: 36,
        hp: hp,
        speed: 2.2 + Math.random() * 1.8 + wave * 0.25
      });
    }
  }

  function isColliding(a, b) {
    return a.x < b.x + b.width &&
           a.x + a.width > b.x &&
           a.y < b.y + b.height &&
           a.y + a.height > b.y;
  }

  function shootBullets() {
    const centerX = player.x + player.width / 2 - 3;
    const count = player.bulletCount;
    const spreadStep = 0.22;

    for (let i = 0; i < count; i++) {
      const offsetIndex = i - (count - 1) / 2;
      const vx = offsetIndex * spreadStep * player.bulletSpeed * 0.35;
      bullets.push({
        x: centerX,
        y: player.y,
        width: 6,
        height: 14,
        vx: vx,
        vy: player.bulletSpeed,
        damage: player.bulletDamage
      });
    }
  }

  function updateAndDrawBoss() {
    if (!boss) return;

    // 左右に移動
    boss.x += boss.vx;
    if (boss.x <= 10 || boss.x + boss.width >= canvas.width - 10) {
      boss.vx *= -1;
    }

    // 定期的に3方向へ弾を発射
    boss.shootTimer++;
    if (boss.shootTimer >= 55) {
      boss.shootTimer = 0;
      const originX = boss.x + boss.width / 2 - 5;
      const originY = boss.y + boss.height;
      const speeds = [
        { vx: -1.8, vy: 4.5 },
        { vx: 0, vy: 5.2 },
        { vx: 1.8, vy: 4.5 }
      ];
      for (const s of speeds) {
        enemyBullets.push({
          x: originX,
          y: originY,
          width: 10,
          height: 10,
          vx: s.vx,
          vy: s.vy
        });
      }
    }

    // ボス本体の描画
    ctx.fillStyle = "#b80028";
    ctx.fillRect(boss.x, boss.y, boss.width, boss.height);
    ctx.strokeStyle = "#ff4466";
    ctx.lineWidth = 3;
    ctx.strokeRect(boss.x, boss.y, boss.width, boss.height);

    // ボスの目（コア）
    ctx.fillStyle = "#ffcc00";
    ctx.fillRect(boss.x + 22, boss.y + 22, 18, 14);
    ctx.fillRect(boss.x + boss.width - 40, boss.y + 22, 18, 14);

    // ボス名とHP表示
    ctx.fillStyle = "#ff6688";
    ctx.font = "bold 13px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText(boss.name + "  HP: " + Math.max(0, boss.hp) + " / " + boss.maxHp, canvas.width / 2, boss.y - 10);

    // プレイヤー弾とボスの当たり判定
    for (let j = bullets.length - 1; j >= 0; j--) {
      if (isColliding(bullets[j], boss)) {
        boss.hp -= bullets[j].damage;
        // 絶対倒せないようにHPを1以上に保つ
        if (boss.hp < 1) {
          boss.hp = 1;
        }
        bullets.splice(j, 1);
        score += 25;
      }
    }

    // プレイヤーとボスの接触判定
    if (player.invincibleTimer === 0 && isColliding(player, boss)) {
      player.hp -= 1;
      player.invincibleTimer = 60;
      if (player.hp <= 0) {
        gameState = "gameover";
      }
    }
  }

  function drawChoosingScreen() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.85)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#00ffcc";
    ctx.font = "bold 22px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("WAVE " + wave + " クリア！", canvas.width / 2, 65);

    ctx.fillStyle = "#fff";
    ctx.font = "15px sans-serif";
    ctx.fillText("強化カードを1つ選んでください", canvas.width / 2, 95);

    const cardRects = getCardRects();
    for (const r of cardRects) {
      ctx.fillStyle = "#1a2234";
      ctx.strokeStyle = "#00ffcc";
      ctx.lineWidth = 2;
      ctx.fillRect(r.x, r.y, r.width, r.height);
      ctx.strokeRect(r.x, r.y, r.width, r.height);

      ctx.fillStyle = "#ffd700";
      ctx.font = "bold 18px sans-serif";
      ctx.textAlign = "left";
      ctx.fillText(r.choice.title, r.x + 16, r.y + 32);

      ctx.fillStyle = "#e0e0e0";
      ctx.font = "14px sans-serif";
      ctx.fillText(r.choice.desc, r.x + 16, r.y + 60);
    }
  }

  function drawGameOverScreen() {
    ctx.fillStyle = "rgba(0, 0, 0, 0.8)";
    ctx.fillRect(0, 0, canvas.width, canvas.height);

    ctx.fillStyle = "#ff4444";
    ctx.font = "bold 32px sans-serif";
    ctx.textAlign = "center";
    ctx.fillText("GAME OVER", canvas.width / 2, canvas.height / 2 - 40);

    ctx.fillStyle = "white";
    ctx.font = "18px sans-serif";
    ctx.fillText("到達 WAVE: " + wave, canvas.width / 2, canvas.height / 2 + 5);
    ctx.fillText("SCORE: " + score, canvas.width / 2, canvas.height / 2 + 35);

    ctx.fillStyle = "#00ffcc";
    ctx.font = "16px sans-serif";
    ctx.fillText("タップして最初から挑戦", canvas.width / 2, canvas.height / 2 + 80);
  }

  function loop() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);

    if (gameState === "playing") {
      frameCount++;
      if (player.invincibleTimer > 0) player.invincibleTimer--;

      if (frameCount % player.fireInterval === 0) {
        shootBullets();
      }

      // プレイヤー描画（無敵中は点滅）
      if (player.invincibleTimer === 0 || Math.floor(player.invincibleTimer / 4) % 2 === 0) {
        ctx.fillStyle = player.color;
        ctx.beginPath();
        ctx.moveTo(player.x + player.width / 2, player.y);
        ctx.lineTo(player.x, player.y + player.height);
        ctx.lineTo(player.x + player.width, player.y + player.height);
        ctx.closePath();
        ctx.fill();
      }

      // プレイヤー弾の更新と描画
      ctx.fillStyle = "#ffff00";
      for (let i = bullets.length - 1; i >= 0; i--) {
        let b = bullets[i];
        b.x += b.vx;
        b.y -= b.vy;
        ctx.fillRect(b.x, b.y, b.width, b.height);
        if (b.y < -20 || b.x < -20 || b.x > canvas.width + 20) {
          bullets.splice(i, 1);
        }
      }

      // WAVE 10未満は通常ザコ敵、WAVE 10はボス戦
      if (wave < 10) {
        spawnEnemy();
        for (let i = enemies.length - 1; i >= 0; i--) {
          let e = enemies[i];
          e.y += e.speed;

          ctx.fillStyle = e.hp > 1 ? "#ff8800" : "#ff4466";
          ctx.fillRect(e.x, e.y, e.width, e.height);

          if (player.invincibleTimer === 0 && isColliding(player, e)) {
            player.hp -= 1;
            player.invincibleTimer = 60;
            enemies.splice(i, 1);
            if (player.hp <= 0) {
              gameState = "gameover";
              break;
            }
            continue;
          }

          let destroyed = false;
          for (let j = bullets.length - 1; j >= 0; j--) {
            if (isColliding(bullets[j], e)) {
              e.hp -= bullets[j].damage;
              bullets.splice(j, 1);
              if (e.hp <= 0) {
                enemies.splice(i, 1);
                score += 100;
                killsInWave++;
                destroyed = true;
              }
              break;
            }
          }
          if (destroyed) {
            if (killsInWave >= killsToNextWave) {
              generateChoices();
              gameState = "choosing";
              break;
            }
            continue;
          }

          if (e.y > canvas.height) {
            enemies.splice(i, 1);
          }
        }
      } else {
        updateAndDrawBoss();
      }

      // ボスの弾の更新・描画・当たり判定
      ctx.fillStyle = "#ff55aa";
      for (let i = enemyBullets.length - 1; i >= 0; i--) {
        let eb = enemyBullets[i];
        eb.x += eb.vx;
        eb.y += eb.vy;
        ctx.fillRect(eb.x, eb.y, eb.width, eb.height);

        if (player.invincibleTimer === 0 && isColliding(player, eb)) {
          player.hp -= 1;
          player.invincibleTimer = 60;
          enemyBullets.splice(i, 1);
          if (player.hp <= 0) {
            gameState = "gameover";
            break;
          }
          continue;
        }

        if (eb.y > canvas.height + 20 || eb.x < -20 || eb.x > canvas.width + 20) {
          enemyBullets.splice(i, 1);
        }
      }

      // HUD（ステータス表示）
      ctx.fillStyle = "white";
      ctx.font = "bold 15px sans-serif";
      ctx.textAlign = "left";
      if (wave < 10) {
        ctx.fillText("WAVE " + wave + " (" + killsInWave + "/" + killsToNextWave + ")", 12, 24);
      } else {
        ctx.fillStyle = "#ff5577";
        ctx.fillText("WAVE 10 - BOSS BATTLE", 12, 24);
        ctx.fillStyle = "white";
      }
      ctx.fillText("SCORE: " + score, 12, 44);

      ctx.textAlign = "right";
      ctx.fillStyle = "#ff6688";
      ctx.fillText("HP: " + "♥".repeat(player.hp) + "♡".repeat(Math.max(0, player.maxHp - player.hp)), canvas.width - 12, 24);
    } else if (gameState === "choosing") {
      drawChoosingScreen();
    } else if (gameState === "gameover") {
      drawGameOverScreen();
    }

    requestAnimationFrame(loop);
  }

  loop();
</script>
</body>
</html>
